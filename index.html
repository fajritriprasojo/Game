<!DOCTYPE html>
<html lang="id">

<title>⚽ Liga Manajer Indonesia</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:radial-gradient(circle at 20% 0%,#16241d 0%,#0b120f 60%);
  color:#e8f0ec;min-height:100vh;padding:12px;overflow-x:hidden}
.wrap{max-width:940px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;
  padding:12px 14px;margin-bottom:12px;border-radius:14px;
  background:linear-gradient(100deg,#1b3a2c,#12261d);
  border:1px solid #2c4a3a;box-shadow:0 6px 24px rgba(0,0,0,.35);
  position:sticky;top:6px;z-index:50}
header h1{font-size:16px;letter-spacing:.5px;cursor:pointer;user-select:none}
#hdr-sub{font-size:10px;color:#8fbfa4;text-align:right;line-height:1.5}
.card{background:#131e19;border:1px solid #24382e;border-radius:14px;
  padding:14px;margin-bottom:12px}
h2{font-size:15px;margin-bottom:10px;color:#a8e6c1}
h3{font-size:12px;color:#7fae94;margin:12px 0 8px;text-transform:uppercase;letter-spacing:1px}
h4{font-size:11px;color:#7fae94;margin:8px 0 4px;text-transform:uppercase;letter-spacing:1px}
.btn{background:#1d3227;color:#c8f0d8;border:1px solid #2f5442;
  padding:8px 14px;border-radius:9px;cursor:pointer;font-size:12px;
  font-weight:600;font-family:inherit;transition:.15s}
.btn:hover{background:#26432f}
.btn.primary{background:linear-gradient(100deg,#2ecc71,#20a35a);color:#04160c;border:none}
.btn.primary:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:5px 10px;font-size:11px}
.btn.danger{background:#3a1d20;border-color:#e63946;color:#ff8f96}
.btn.gold{background:linear-gradient(100deg,#ffd700,#ffaa00);color:#1a1400;border:none;font-weight:800}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.team-card{background:#16241d;border:1px solid #27402f;border-radius:10px;
  padding:10px;cursor:pointer;transition:.18s;position:relative;overflow:hidden}
.team-card:hover{transform:translateY(-2px);border-color:#3f7a5a}
.team-card .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
.team-card .nm{font-weight:700;font-size:13px;margin-left:6px}
.team-card .mt{font-size:10px;color:#8bb59f;margin-left:6px;margin-top:4px}
.div-label{display:inline-block;padding:2px 7px;border-radius:5px;font-size:9px;
  font-weight:800;margin-left:6px;letter-spacing:.5px}
.div-1{background:#e9c46a;color:#1a1400}
.div-2{background:#457b9d;color:#fff}
.tabs{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.tab{padding:7px 12px;border-radius:8px;background:#131e19;border:1px solid #24382e;
  cursor:pointer;font-size:12px;font-weight:600;color:#8bb59f;white-space:nowrap}
.tab.active{background:#2ecc71;color:#04160c;border-color:#2ecc71}
.plist{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media(max-width:600px){.plist{grid-template-columns:1fr}}
.pcard{display:flex;align-items:center;gap:8px;padding:7px 10px;
  background:#182720;border:1px solid #24382e;border-radius:9px;
  cursor:pointer;transition:.13s;font-size:12px}
.pcard:hover{border-color:#3f7a5a;background:#1d3026}
.pcard.sel{border-color:#2ecc71;background:#1b3a28;box-shadow:0 0 0 2px rgba(46,204,113,.25)}
.pos{width:34px;text-align:center;font-size:9px;font-weight:800;padding:3px 0;
  border-radius:5px;letter-spacing:.5px;display:inline-block}
.pos.GK{background:#5e60ce;color:#fff}
.pos.DEF{background:#2a9d8f;color:#04160c}
.pos.MID{background:#e9c46a;color:#241c00}
.pos.FWD{background:#e63946;color:#fff}
.pos-mini{display:inline-block;font-size:8px;font-weight:800;padding:1px 5px;
  border-radius:4px;margin-right:2px;letter-spacing:.3px}
.pname{flex:1;font-weight:600}
.pmeta{font-size:10px;color:#7fae94}
.rate{font-weight:800;font-size:13px;color:#a8e6c1;min-width:22px;text-align:right}
.special-icon{display:inline-block;font-size:14px;margin-left:4px;cursor:pointer;
  filter:drop-shadow(0 0 3px #ffd700)}
table{width:100%;border-collapse:collapse;font-size:11px}
th{text-align:left;padding:6px 4px;color:#7fae94;font-size:9px;
  text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #24382e}
td{padding:6px 4px;border-bottom:1px solid #1b2a22}
tr.mine td{background:rgba(46,204,113,.12);font-weight:700}
tr.mine td:first-child{border-left:3px solid #2ecc71}
tr.rel td{background:rgba(230,57,70,.10)}
tr.rel td:first-child{border-left:3px solid #e63946}
tr.pro td{background:rgba(46,204,113,.08)}
tr.pro td:first-child{border-left:3px solid #2ecc71}
.num{text-align:center}
.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  gap:10px;padding:16px;background:linear-gradient(100deg,#132018,#0d1a14);
  border-radius:14px;border:1px solid #24382e;margin-bottom:12px}
.sb-team{text-align:center;font-weight:700;font-size:13px}
.sb-badge{width:38px;height:38px;border-radius:50%;margin:0 auto 6px;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900}
.score{font-size:30px;font-weight:900;letter-spacing:2px;color:#fff;
  transition:.2s;font-variant-numeric:tabular-nums;text-align:center}
.score.pulse{color:#2ecc71;transform:scale(1.12)}
.events{max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:5px}
.event{padding:7px 10px;border-radius:8px;font-size:11px;
  background:#16241d;border-left:3px solid #2f5442;animation:slide .3s ease}
.event.goal{background:#1d3a27;border-left-color:#2ecc71;font-weight:700}
.event.goal.away{background:#3a1d20;border-left-color:#e63946}
.event.card{background:#332c14;border-left-color:#e9c46a}
.event.commentary{background:#0f1a15;border-left-color:#3a5a4a;
  color:#a8bfb4;font-style:italic;font-size:10px}
@keyframes slide{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
.badge-round{display:inline-block;background:#1d3227;color:#8fbfa4;
  padding:3px 9px;border-radius:16px;font-size:11px;font-weight:600}
.empty{color:#5f7d6c;font-size:12px;padding:14px;text-align:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:#e63946;color:#fff;padding:10px 18px;border-radius:10px;
  font-size:12px;font-weight:600;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.5);
  max-width:88vw;text-align:center}
.div-toggle{display:flex;gap:6px;margin-bottom:10px}
.div-toggle .tab{font-size:11px;padding:5px 12px}
.scroll-box{max-height:440px;overflow-y:auto}
.scroll-box::-webkit-scrollbar{width:5px}
.scroll-box::-webkit-scrollbar-thumb{background:#2f5442;border-radius:3px}
.pitch-wrap{background:#0d1a14;padding:8px;border-radius:14px;
  border:1px solid #24382e;margin-bottom:12px}
.pitch{width:100%;display:block;border-radius:8px;background:#2d6b3a}
.pitch .pp{transition:transform .45s ease}
.pitch .ball{transition:transform .45s ease}
.stamina-bar{width:36px;height:5px;background:#2c3a33;border-radius:3px;
  overflow:hidden;display:inline-block;margin-left:4px;vertical-align:middle}
.stamina-fill{height:100%;background:#2ecc71;transition:.3s}
.stamina-fill.mid{background:#e9c46a}
.stamina-fill.low{background:#e63946}
.inj-badge{background:#e63946;color:#fff;font-size:9px;font-weight:800;
  padding:2px 5px;border-radius:4px;margin-left:4px}
.bracket{display:flex;gap:8px;overflow-x:auto;padding:8px 0}
.bracket-col{min-width:150px;display:flex;flex-direction:column;justify-content:space-around;gap:8px}
.bracket-match{background:#182720;border:1px solid #2f5442;border-radius:8px;padding:6px 8px;font-size:11px}
.bracket-match.mine{border-color:#2ecc71;background:#1b3a28}
.bracket-match .win{color:#a8e6c1;font-weight:700}
.bracket-match .lose{color:#7fae94;opacity:.6}
.news-item{background:#16241d;border-left:3px solid #457b9d;border-radius:8px;
  padding:8px 10px;margin-bottom:6px;font-size:12px}
.news-item .head{color:#a8e6c1;font-weight:700;margin-bottom:2px;font-size:11px}
.news-item .time{font-size:9px;color:#7fae94;text-transform:uppercase;letter-spacing:1px}
.pc-answer{display:block;width:100%;text-align:left;padding:10px;margin-bottom:6px;
  background:#182720;border:1px solid #2f5442;border-radius:8px;color:#e8f0ec;
  font-size:12px;cursor:pointer;font-family:inherit}
.pc-answer:hover{background:#1d3026;border-color:#2ecc71}
#devPanel{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:14px}
#devPanel .inner{background:#0f1a15;border:2px solid #ffd700;border-radius:14px;
  padding:16px;max-width:420px;width:100%;max-height:88vh;overflow-y:auto;
  box-shadow:0 0 40px rgba(255,215,0,.3)}
#devPanel h2{color:#ffd700;text-align:center;margin-bottom:4px;font-size:16px}
#devPanel .sub{text-align:center;color:#8bb59f;font-size:11px;margin-bottom:14px}
#devPanel .btn{width:100%;margin-bottom:6px;text-align:left}
#devPanel .sect{color:#7fae94;font-size:10px;text-transform:uppercase;
  letter-spacing:1px;margin:12px 0 6px}
#devBadge{position:fixed;top:8px;right:8px;background:#ffd700;color:#1a1400;
  font-size:10px;font-weight:900;padding:3px 8px;border-radius:6px;z-index:150;
  letter-spacing:1px;animation:devPulse 1.5s infinite}
@keyframes devPulse{0%,100%{opacity:1}50%{opacity:.55}}
#createModal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:210;
  display:flex;align-items:center;justify-content:center;padding:14px}
#createModal .inner{background:#0f1a15;border:2px solid #2ecc71;border-radius:14px;
  padding:16px;max-width:460px;width:100%;max-height:90vh;overflow-y:auto}
#createModal h2{color:#a8e6c1;text-align:center;margin-bottom:4px;font-size:16px}
#createModal .sub{text-align:center;color:#8bb59f;font-size:11px;margin-bottom:14px}
#createModal label{display:block;font-size:11px;color:#7fae94;
  text-transform:uppercase;letter-spacing:1px;margin:10px 0 4px}
#createModal input,#createModal select{width:100%;padding:9px 10px;
  background:#182720;border:1px solid #2f5442;border-radius:8px;
  color:#e8f0ec;font-size:13px;font-family:inherit}
#createModal input:focus,#createModal select:focus{outline:none;border-color:#2ecc71}
#createModal .cost{background:#16241d;padding:8px 10px;border-radius:8px;
  font-size:12px;color:#a8e6c1;margin-top:10px;text-align:center}
#createModal .row{margin-top:14px}
#createModal .row .btn{flex:1}

body.light{background:radial-gradient(circle at 20% 0%,#e8f5ee 0%,#d5e8dc 60%);color:#1a2e22}
body.light header{background:linear-gradient(100deg,#fff,#f0f7f3);border-color:#a8d4bc}

body.light .tab{background:#e0efe5;color:#3a6b4a;border-color:#a8d4bc}
body.light .tab.active{background:#2ecc71;color:#04160c}
body.light h2{color:#1a6b3a}
body.light td{border-color:#d6e8dc}
body.light th{color:#5a8a6a}
body.light .pcard,body.light .team-card{background:#f0f7f3;border-color:#c8e0d2}
body.light .event{background:#e8f0eb;color:#1a2e22}
body.light #hdr-sub{color:#5a8a6a}
body.light .scoreboard{background:linear-gradient(100deg,#f0f7f3,#e8f0eb)}
body.light .score{color:#0a3a1f}
body.light .news-item{background:#f0f7f3}
body.light .bracket-match{background:#f0f7f3}

body.light .empty{color:#8ba899}

@media(max-width:400px){
  body{padding:8px}
  header{padding:10px 10px}

  .btn{padding:7px 11px;font-size:11px}
  .tab{padding:6px 9px;font-size:11px}
  .score{font-size:24px}
}

/* ==================== UTIL ==================== */
const rnd=(a,b)=>Math.random()*(b-a)+a;
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:60;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}
function formatIDR(n){
  const rp=Math.abs(n);
  const sign=n<0?'-':'';
  if(rp>=1e15) return `${sign}Rp ${(rp/1e15).toFixed(2)} P`;
  if(rp>=1e12) return `${sign}Rp ${(rp/1e12).toFixed(2)} T`;
  if(rp>=1e9)  return `${sign}Rp ${(rp/1e9).toFixed(2)} M`;
  if(rp>=1e6)  return `${sign}Rp ${(rp/1e6).toFixed(1)} jt`;
  if(rp>=1e3)  return `${sign}Rp ${(rp/1e3).toFixed(0)} rb`;
  return `${sign}Rp ${Math.round(rp)}`;
}

function generateIndonesianName(){
  const r=Math.random();
  if(r<0.15) return pick(NAMA_DEPAN);
  if(r<0.70){
    const mode=Math.random();
    if(mode<0.55) return pick(NAMA_DEPAN)+' '+pick(NAMA_BELAKANG);
    if(mode<0.80) return pick(NAMA_DEPAN)+' '+pick(NAMA_TENGAH);
    return pick(NAMA_TENGAH)+' '+pick(NAMA_BELAKANG);
  }
  return pick(NAMA_DEPAN)+' '+pick(NAMA_TENGAH)+' '+pick(NAMA_BELAKANG);
}

/* ==================== SISTEM POSISI & KEAHLIAN ==================== */
function rollPositions(primaryPos){
  if(primaryPos==='GK') return ['GK'];
  const positions=[primaryPos];
  if(Math.random()<0.60){
    const pool=POSITION_COMPAT[primaryPos].secondaries.filter(p=>p!==primaryPos);
    if(pool.length){
      positions.push(pick(pool));
      if(Math.random()<0.25){
        const pool2=['DEF','MID','FWD'].filter(p=>!positions.includes(p));
        if(pool2.length) positions.push(pick(pool2));
      }
    }
  }
  return positions;
}
function rollSkills(positions){
  const skills=[];
  const seen=new Set();
  const mainPool=SKILL_POOL[positions[0]]||[];
  const mainCount=ri(2,3);
  for(let i=0;i<mainCount;i++){
    const s=pick(mainPool);
    if(!seen.has(s)){ skills.push({name:s, source:positions[0]}); seen.add(s); }
  }
  for(let i=1;i<positions.length;i++){
    const pool=SKILL_POOL[positions[i]]||[];
    const s=pick(pool);
    if(!seen.has(s)){ skills.push({name:s, source:positions[i]}); seen.add(s); }
  }
  return skills;
}
function rollSpecialSkill(tier){
  if(tier==='golden'){
    const s=pick(SPECIAL_SKILLS.golden);
    return {...s, tier:'golden'};
  }
  if(tier==='elite' && Math.random()<0.5){
    const s=pick(SPECIAL_SKILLS.elite);
    return {...s, tier:'elite'};
  }
  return null;
}
function hasSpecial(p, id){
  return p && p.specialSkill && p.specialSkill.id===id;
}

/* ==================== GENERATOR PEMAIN ==================== */
function makeSquad(base){
  const comp={GK:2,DEF:5,MID:5,FWD:4};
  const out=[];
  for(const pos of ['GK','DEF','MID','FWD']){
    for(let i=0;i<comp[pos];i++){
      const positions=rollPositions(pos);
      const skills=rollSkills(positions);
      out.push({
        id:PID++,
        name:generateIndonesianName(),
        pos,
        positions,
        skills,
        specialSkill:null,
        age:ri(18,34),
        rating:Math.max(45,Math.min(95,Math.round(base+rnd(-6,6)))),
        seasonGoals:0, careerGoals:0, apps:0,
        assists:0, yellow:0, red:0, cs:0, mvp:0,
        stamina:100, injury:0, injuryType:'',
        ratings:[], avgRating:0,
        talent:1.0, tier:'normal',
        potential:Math.max(70,Math.min(95,base+ri(3,15))),
        goalBonus:ri(3,15)*1e6,
        assistBonus:ri(2,10)*1e6,
        csBonus:ri(5,20)*1e6,
        mvpBonus:ri(10,50)*1e6,
        lastSeasonBonus:0,
        contractYears:ri(1,5),
        weeklyWage:Math.round((base+rnd(-6,6)-40)*1.5e6)
      });
    }
  }
  return out;
}
function makeYouth(baseR, fromPlayer=null){
  const pos = fromPlayer ? fromPlayer.pos : pick(['GK','DEF','DEF','MID','MID','FWD','FWD']);
  const name = fromPlayer ? fromPlayer.name : generateIndonesianName();

  const roll = Math.random();
  let talent, tier;
  if(roll < 0.03){        talent = 2.0; tier = 'golden'; }
  else if(roll < 0.15){   talent = 1.5; tier = 'elite'; }
  else if(roll < 0.40){   talent = 1.2; tier = 'talented'; }
  else {                  talent = 1.0; tier = 'normal'; }

  const potBase = baseR + (tier==='golden'?25 : tier==='elite'?18 : tier==='talented'?12 : 6);
  const potential = Math.max(60, Math.min(96, Math.round(potBase + rnd(-3,3))));
  const startBoost = tier==='golden'?8 : tier==='elite'?5 : tier==='talented'?2 : 0;

  const positions = rollPositions(pos);
  const skills = rollSkills(positions);
  const specialSkill = rollSpecialSkill(tier);

  return {
    id: PID++,
    name, pos, positions, skills, specialSkill,
    age: fromPlayer ? 16 : ri(13,16),
    rating: Math.max(42, Math.min(72, Math.round(baseR*0.65 + rnd(-6,8) + startBoost))),
    talent, tier, potential,
    seasonGoals:0, careerGoals:0, apps:0,
    assists:0, yellow:0, red:0, cs:0, mvp:0,
    stamina:100, injury:0, injuryType:'',
    ratings:[], avgRating:0,
    goalBonus:ri(2,8)*1e6, assistBonus:ri(1,5)*1e6,
    csBonus:ri(3,10)*1e6, mvpBonus:ri(5,25)*1e6,
    lastSeasonBonus:0,
    contractYears:ri(2,5),
    weeklyWage:Math.round((baseR*0.5-20)*1e6)
  };
}
function autoPickXI(team,formation){
  const need=FORMATIONS[formation];
  const xi=[];
  for(const pos of ['GK','DEF','MID','FWD']){
    const c=team.players.filter(p=>p.pos===pos && !p.injury)
      .sort((a,b)=>b.rating-a.rating);
    for(let i=0;i<need[pos];i++){
      if(c[i]) xi.push(c[i].id);
    }
  }
  team.xi=xi;
}

    const baseR = avg(t.players.map(p=>p.rating));
    for(let i=0;i<5;i++) t.academy.push(makeYouth(baseR));
  });

function getDivIndices(div){
  return state.teams.map((t,i)=>t.div===div?i:-1).filter(i=>i>=0);
}
function makeFixtures(teamIndices){
  let ids=[...teamIndices];
  const n=ids.length;
  const rounds=[];
  for(let r=0;r<n-1;r++){
    const pairs=[];
    for(let i=0;i<n/2;i++) pairs.push([ids[i],ids[n-1-i]]);
    rounds.push(pairs);
    const fixed=ids[0], rest=ids.slice(1);
    rest.unshift(rest.pop());
    ids=[fixed,...rest];
  }
  return rounds.map(rd=>rd.map(([h,a])=>({home:h,away:a,played:false,hg:0,ag:0})));
}
function randomizeAIFormations(){
  const forms=Object.keys(FORMATIONS);
  state.teams.forEach((t,i)=>{
    if(i===state.myIdx) return;
    if(Math.random()<0.5){
      t.formation=pick(forms);
      autoPickXI(t,t.formation);
    }
    t.tactics.mentality=pick(['seimbang','menyerang','defensif']);
  });
}

/* ==================== HELPERS ==================== */
const getP=(team,id)=>team.players.find(p=>p.id===id);
function teamStats(team){
  const xi=team.xi.map(id=>getP(team,id)).filter(Boolean);
  const by={GK:[],DEF:[],MID:[],FWD:[]};
  xi.forEach(p=>by[p.pos].push(p.rating));
  const gk=avg(by.GK),def=avg(by.DEF),mid=avg(by.MID),fwd=avg(by.FWD);
  let atk=fwd*.55+mid*.30+def*.15;
  let dfn=gk*.35+def*.45+mid*.20;
  const m=team.tactics.mentality;
  if(m==='menyerang'){atk*=1.10;dfn*=0.92;}
  else if(m==='defensif'){atk*=0.90;dfn*=1.10;}
  return {atk,def:dfn,mid};
}
function pickScorer(team){
  const xi=team.xi.map(id=>getP(team,id)).filter(Boolean);
  if(!xi.length) return null;
  const w={GK:0,DEF:1,MID:3.5,FWD:6};
  const tot=xi.reduce((s,p)=>s+w[p.pos],0);
  let r=Math.random()*tot;
  for(const p of xi){ r-=w[p.pos]; if(r<=0) return p; }
  return xi[xi.length-1];
}
function pickAssist(team, scorerId){
  const xi=team.xi.map(id=>getP(team,id)).filter(p=>p&&p.id!==scorerId);
  if(!xi.length) return null;
  const w={GK:0,DEF:1,MID:5,FWD:4};
  const tot=xi.reduce((s,p)=>s+w[p.pos],0);
  let r=Math.random()*tot;
  for(const p of xi){ r-=w[p.pos]; if(r<=0) return p; }
  return xi[0];
}
function pickMVP(team){
  const xi=team.xi.map(id=>getP(team,id)).filter(Boolean);
  if(!xi.length) return null;
  const w=xi.map(p=>Math.pow(p.rating,2));
  const tot=w.reduce((a,b)=>a+b,0);
  let r=Math.random()*tot;
  for(let i=0;i<xi.length;i++){ r-=w[i]; if(r<=0) return xi[i]; }
  return xi[xi.length-1];
}
function checkXI(team){
  const need=FORMATIONS[team.formation];
  const c={GK:0,DEF:0,MID:0,FWD:0};
  team.xi.forEach(id=>{const p=getP(team,id); if(p)c[p.pos]++;});
  return c.GK===need.GK&&c.DEF===need.DEF&&c.MID===need.MID&&c.FWD===need.FWD;
}
function marketValue(p){
  const ageF=p.age<=23?1.4:p.age<=27?1.2:p.age<=30?0.9:p.age<=33?0.5:0.25;
  return Math.max(3, Math.round((p.rating-40)*(p.rating-40)/30*ageF)) * 1e9;
}
function weeklyWage(p){
  return Math.round((p.rating-40) * 1.5e6);
}

/* ==================== SIMULASI MATCH ==================== */
function simulateSegment(home, away, fromMin, toMin, ctx){
  const wMod = ctx.weather ? ctx.weather.goal : 1.0;
  const H=ctx.H, A=ctx.A, possH=ctx.possH;

  for(let min=fromMin; min<=toMin; min++){
    if(Math.random()<0.22){
      const isHome=Math.random()<possH;
      const t=isHome?home:away;
      const kat=pick(['buildup','buildup','buildup','atmosfer','atmosfer','corner','foul']);
      ctx.events.push({min,type:'commentary',text:komentarBaris(t,kat)});
    }

    if(Math.random()<0.50){
      const isHome=Math.random()<possH;
      const hb=ctx.homeBoost||0, ab=ctx.awayBoost||0;
      const atkMul=(isHome?1.06:1)*(1+(isHome?hb:ab));
      const defMul=(isHome?1:1.06)*(1+(isHome?ab:hb)*0.7);
      const atk=(isHome?H.atk:A.atk)*atkMul;
      const dfn=(isHome?A.def:H.def)*defMul;
      let pGoal=0.115*(atk/(atk+dfn))*2*wMod;

      const att2=isHome?home:away;
      att2.xi.forEach(id=>{
        const pl=getP(att2,id);
        if(!pl) return;
        if(hasSpecial(pl,'finisher')) pGoal*=1.15;
        if(hasSpecial(pl,'speed') && Math.random()<0.5) pGoal*=1.08;
        if(hasSpecial(pl,'leader')) pGoal*=1.02;
      });

      const att=isHome?home:away, def=isHome?away:home;

      if(Math.random()<pGoal){
        const s=pickScorer(att);
        if(!s) continue;
        if(isHome)ctx.hg++; else ctx.ag++;
        let assistTxt='', assistId=null;
        const maestroOn=att.xi.some(id=>hasSpecial(getP(att,id),'maestro'));
        const assistChance=maestroOn?0.90:0.75;
        if(Math.random()<assistChance){
          const a=pickAssist(att, s.id);
          if(a){ a.assists++; assistId=a.id; assistTxt=` (assist: ${a.name})`; }
        }
        ctx.events.push({
          min, type:'goal', team:isHome?'home':'away',
          scorerId:s.id, assistId,
          text:`⚽ GOL! ${s.name} (${att.name})${assistTxt} — ${ctx.hg}-${ctx.ag}`
        });
      } else {
        const s=pickScorer(att);
        if(Math.random()<0.45){
          ctx.events.push({min,type:'commentary',text:komentarBaris(def,'save')});
        } else {
          ctx.events.push({min,type:'commentary',
            text:pick(KOMENTAR.shot).replace('{p}', s?s.name:'penyerang')});
        }
      }
    }

    if(Math.random()<0.010){
      const isHome=Math.random()<0.5;
      const t=isHome?home:away;
      const p=pick(t.xi.map(id=>getP(t,id)).filter(Boolean));
      if(p){
        const isRed=Math.random()<0.08;
        if(isRed) p.red++;
        else p.yellow++;
        ctx.events.push({
          min, type:'card', team:isHome?'home':'away', playerId:p.id, red:isRed,
          text:isRed?`🟥 KARTU MERAH! ${p.name} (${t.name}) diusir wasit!`
                     :`🟨 Kartu kuning untuk ${p.name} (${t.name}).`
        });
      }
    }
  }
}
function computeMatchRatings(team, gf, ga, events, mvp){
  team.xi.forEach(id=>{
    const p=getP(team,id);
    if(!p) return;
    let r=6.0;
    events.forEach(e=>{
      if(e.type==='goal' && e.scorerId===id) r+=1.5;
      if(e.type==='goal' && e.assistId===id) r+=1.0;
      if(e.type==='card' && e.playerId===id) r-= e.red?1.5:0.5;
    });
    if(p.pos==='GK' && ga===0) r+=1.5;
    if(p.pos==='DEF' && ga===0) r+=0.8;
    if(p.pos==='FWD' && gf>=3) r+=0.3;
    if(mvp && mvp.id===id) r+=0.5;
    if(hasSpecial(p,'clutch') && events.some(e=>e.min>45)) r+=0.5;
    if(hasSpecial(p,'biggame') && (state.pialaNasional||state.ligaChampions)) r+=0.4;
    r += rnd(-0.4,0.4);
    r = Math.max(1,Math.min(10,r));
    if(!p.ratings) p.ratings=[];
    p.ratings.push(Math.round(r*10)/10);
    if(p.ratings.length>60) p.ratings=p.ratings.slice(-60);
    p.avgRating = p.ratings.reduce((a,b)=>a+b,0)/p.ratings.length;
  });
}
function finalizeMatch(home, away, ctx){
  const hGK=home.xi.map(id=>getP(home,id)).find(p=>p&&p.pos==='GK');
  const aGK=away.xi.map(id=>getP(away,id)).find(p=>p&&p.pos==='GK');
  if(ctx.ag===0 && hGK) hGK.cs++;
  if(ctx.hg===0 && aGK) aGK.cs++;

  let mvp=null;
  if(ctx.hg>ctx.ag) mvp=pickMVP(home);
  else if(ctx.ag>ctx.hg) mvp=pickMVP(away);
  else mvp=pickMVP(Math.random()<0.5?home:away);
  if(mvp) mvp.mvp++;

  ctx.events.forEach(e=>{
    if(e.type==='goal'){
      const t=e.team==='home'?home:away;
      const p=getP(t,e.scorerId);
      if(p){p.seasonGoals++;p.careerGoals++;}
    }
  });

  [home,away].forEach(t=>{
    t.xi.forEach(id=>{
      const p=getP(t,id);
      if(!p) return;
      p.apps++;
      p.stamina=Math.max(0,p.stamina-STAMINA_COST+ri(-4,4));
      let injChance=0.15;
      if(hasSpecial(p,'ironman')) injChance*=0.5;
      if(p.stamina<25 && Math.random()<injChance){
        p.injury=ri(1,5);
        p.injuryType=pick(INJURIES);
        p.stamina=Math.min(p.stamina,40);
      }
    });
  });

  computeMatchRatings(home, ctx.hg, ctx.ag, ctx.events, ctx.hg>ctx.ag?mvp:null);
  computeMatchRatings(away, ctx.ag, ctx.hg, ctx.events, ctx.ag>ctx.hg?mvp:null);
}

/* ==================== PLAY ROUND (FASE 1) ==================== */
function playRound(){
  // Pulihkan non-XI
  state.teams.forEach(t=>{
    t.players.forEach(p=>{
      if(!t.xi.includes(p.id)) p.stamina=Math.min(100,p.stamina+STAMINA_RECOVER);
      if(p.injury>0) p.injury=Math.max(0,p.injury-1);
    });
  });

  // Press conference kadang muncul
  if(!state.pcAnswered && Math.random()<0.35){
    state.pcAnswered=true;
    openPressConference();
    return;
  }

  if(state.sound) sfxWhistle();

  let mine=null;
  [1,2].forEach(div=>{
    const round=state.fixtures[div][state.round];
    if(!round) return;
    round.forEach(f=>{
      const h=state.teams[f.home], a=state.teams[f.away];
      const isUser = f.home===state.myIdx || f.away===state.myIdx;
      const weather=rollWeather();

      if(isUser){
        const H=teamStats(h), A=teamStats(a);
        const ctx={
          H, A, possH:H.mid/(H.mid+A.mid),
          hg:0, ag:0, events:[], weather,
          homeBoost:0, awayBoost:0
        };
        simulateSegment(h, a, 1, 45, ctx);
        state.lastWeather=weather;
        mine={f,h,a,ctx,subsLeft:5,finished:false};
      } else {
        const H=teamStats(h), A=teamStats(a);
        const ctx={H,A,possH:H.mid/(H.mid+A.mid),hg:0,ag:0,events:[],weather,homeBoost:0,awayBoost:0};
        simulateSegment(h, a, 1, 90, ctx);
        f.hg=ctx.hg; f.ag=ctx.ag; f.played=true;
        finalizeMatch(h,a,ctx);
      }
    });
  });

  pendingMatch=mine;
  if(mine){
    state.view='match';
    state.pcAnswered=false;
    render();
    animateHalf(1);
  } else {
    nextRound();
  }
}

/* ==================== KLASEMEN ==================== */
function getTable(div){
  const idxs=getDivIndices(div);
  const t=idxs.map(i=>({team:state.teams[i], idx:i, P:0,W:0,D:0,L:0,GF:0,GA:0,Pts:0,form:[]}));
  const map={}; t.forEach(r=>map[r.idx]=r);
  state.fixtures[div].flat().forEach(f=>{
    if(!f.played)return;
    const h=map[f.home],a=map[f.away];
    if(!h||!a)return;
    h.P++;a.P++;h.GF+=f.hg;h.GA+=f.ag;a.GF+=f.ag;a.GA+=f.hg;
    if(f.hg>f.ag){h.W++;a.L++;h.Pts+=3;h.form.push('W');a.form.push('L');}
    else if(f.hg<f.ag){a.W++;h.L++;a.Pts+=3;a.form.push('W');h.form.push('L');}
    else{h.D++;a.D++;h.Pts++;a.Pts++;h.form.push('D');a.form.push('D');}
  });
  t.sort((x,y)=>y.Pts-x.Pts||(y.GF-y.GA)-(x.GF-x.GA)||y.GF-x.GF);
  return t;
}
function renderTable(){
  const div=state.tableDiv;
  const t=getTable(div);
  const divToggle=`<div class="div-toggle">
    <div class="tab ${div===1?'active':''}" onclick="setTableDiv(1)">🏆 Divisi 1</div>
    <div class="tab ${div===2?'active':''}" onclick="setTableDiv(2)">🥈 Divisi 2</div>
  </div>`;
  return `<div class="card">
    <h2>Klasemen Divisi ${div}</h2>
    ${divToggle}
    <div class="scroll-box">
    <table>
      <tr><th>#</th><th>Klub</th><th class="num">M</th><th class="num">W</th><th class="num">D</th>
      <th class="num">L</th><th class="num">SG</th><th class="num">Pts</th><th>Form</th></tr>
      ${t.map((r,i)=>{
        const isMine=r.idx===state.myIdx;
        const isRel=div===1&&i>=t.length-RELEGATED;
        const isPro=div===2&&i<PROMOTED;
        const cls=[isMine?'mine':'',isRel?'rel':'',isPro?'pro':''].filter(Boolean).join(' ');
        const form=(r.form||[]).slice(-5).map(f=>{
          const c=f==='W'?'#2ecc71':f==='D'?'#e9c46a':'#e63946';
          return `<span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${c};color:#04160c;font-size:8px;font-weight:800;text-align:center;line-height:12px;margin-right:2px">${f}</span>`;
        }).join('');
        const badge=r.team.acquiredBy===state.myIdx?'<span style="color:#ffd700;font-size:10px;font-weight:800">👑</span>':'';
        return `<tr class="${cls}">
          <td>${i+1}</td>
          <td><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${r.team.color};margin-right:5px"></span>${r.team.name} ${badge}</td>
          <td class="num">${r.P}</td><td class="num">${r.W}</td><td class="num">${r.D}</td>
          <td class="num">${r.L}</td>
          <td class="num">${r.GF-r.GA>0?'+':''}${r.GF-r.GA}</td>
          <td class="num" style="font-weight:800;color:#a8e6c1">${r.Pts}</td>

/* ==================== STATISTIK ==================== */
function topScorers(){
  const all=[];
  state.teams.forEach(t=>t.players.forEach(p=>{if(p.seasonGoals>0)all.push({p,t});}));
  all.sort((a,b)=>b.p.seasonGoals-a.p.seasonGoals);
  return all.slice(0,10);
}
function topAssisters(){
  const all=[];
  state.teams.forEach(t=>t.players.forEach(p=>{if(p.assists>0)all.push({p,t});}));
  all.sort((a,b)=>b.p.assists-a.p.assists);
  return all.slice(0,10);
}
function getCards(){
  const all=[];
  state.teams.forEach(t=>t.players.forEach(p=>{if(p.yellow>0||p.red>0)all.push({p,t});}));
  all.sort((a,b)=>(b.p.red*10+b.p.yellow)-(a.p.red*10+a.p.yellow));
  return all.slice(0,10);
}
function getCleanSheets(){
  const all=[];
  state.teams.forEach(t=>t.players.forEach(p=>{if(p.pos==='GK'&&p.cs>0)all.push({p,t});}));
  all.sort((a,b)=>b.p.cs-a.p.cs);
  return all.slice(0,10);
}
function getMVP(){
  const all=[];
  state.teams.forEach(t=>t.players.forEach(p=>{if(p.mvp>0)all.push({p,t});}));
  all.sort((a,b)=>b.p.mvp-a.p.mvp);
  return all.slice(0,10);
}
function renderStats(){
  const sections=[
    {title:'⚽ Top Skor',list:topScorers(),unit:'Gol',getVal:x=>x.p.seasonGoals,color:'#2ecc71'},
    {title:'🎯 Top Asis',list:topAssisters(),unit:'Asis',getVal:x=>x.p.assists,color:'#457b9d'},
    {title:'🟨🟥 Kartu Terbanyak',list:getCards(),unit:'Kartu',getVal:x=>`${x.p.yellow}🟨 ${x.p.red}🟥`,color:'#e9c46a'},
    {title:'🧤 Clean Sheet (Kiper)',list:getCleanSheets(),unit:'CS',getVal:x=>x.p.cs,color:'#5e60ce'},
    {title:'⭐ Pemain Terbaik (MVP)',list:getMVP(),unit:'MVP',getVal:x=>x.p.mvp,color:'#ffd700'}
  ];
  return `<div class="card">
    <h2>📈 Statistik Musim ${state.season}</h2>
    ${sections.map(s=>`
      <h3>${s.title}</h3>
      ${s.list.length?`<table>
        <tr><th>#</th><th>Pemain</th><th>Klub</th><th class="num">${s.unit}</th></tr>

/* ==================== LEGENDA ==================== */
function addAllTime(cat, name, val, teamName){
  if(!name || !val) return;
  const d=state.allTime[cat];
  if(!d[name]) d[name]={name, val:0, teams:[]};
  d[name].val += val;
  if(teamName && !d[name].teams.includes(teamName)) d[name].teams.push(teamName);
}
function accumulateSeason(){
  if(!state.allTime) state.allTime={scorers:{},assisters:{},mvp:{},cs:{},apps:{},cards:{}};
  state.teams.forEach(t=>{
    t.players.forEach(p=>{
      addAllTime('scorers', p.name, p.seasonGoals, t.name);
      addAllTime('assisters', p.name, p.assists, t.name);
      addAllTime('mvp', p.name, p.mvp, t.name);
      addAllTime('cs', p.name, p.cs, t.name);
      addAllTime('apps', p.name, p.apps, t.name);
      addAllTime('cards', p.name, p.yellow+p.red*2, t.name);
    });
  });
}
function goatScore(name){
  const A=state.allTime;
  return (A.scorers[name]?.val||0)*3
       + (A.assisters[name]?.val||0)*2.5
       + (A.mvp[name]?.val||0)*4
       + (A.cs[name]?.val||0)*2.5
       + (A.apps[name]?.val||0)*0.1
       - (A.cards[name]?.val||0)*0.5;
}
function getGOATs(){
  const names=new Set();
  Object.values(state.allTime).forEach(cat=>Object.keys(cat).forEach(n=>names.add(n)));
  const arr=[...names].map(n=>({
    name:n, score:Math.round(goatScore(n)),
    goals:state.allTime.scorers[n]?.val||0,
    assists:state.allTime.assisters[n]?.val||0,
    mvp:state.allTime.mvp[n]?.val||0,
    cs:state.allTime.cs[n]?.val||0,
    apps:state.allTime.apps[n]?.val||0,
    teams:(state.allTime.scorers[n]||state.allTime.mvp[n]||state.allTime.apps[n]||{teams:[]}).teams
  }));
  arr.sort((a,b)=>b.score-a.score);
  return arr;
}
function getTopBy(cat, n=10){
  const d=state.allTime[cat]||{};
  return Object.values(d).sort((a,b)=>b.val-a.val).slice(0,n);
}
function renderLegenda(){
  const A=state.allTime;
  if(!A || !Object.keys(A.scorers).length){
    return `<div class="card"><h2>🏛️ Legenda</h2>
      <div class="empty">Belum ada data. Selesaikan minimal 1 musim.</div></div>`;
  }
  const goats=getGOATs().slice(0,10);
  const section=(title,list,unit,color)=>`
    <h3 style="margin-top:14px">${title}</h3>
    ${list.length?`<table>
      <tr><th>#</th><th>Pemain</th><th>Klub</th><th class="num">${unit}</th></tr>
      ${list.map((x,i)=>`<tr>
        <td>${i+1}</td>
        <td>${x.name}</td>
        <td style="font-size:10px;color:#8bb59f">${(x.teams||[]).join(', ')||'-'}</td>
        <td class="num" style="font-weight:800;color:${color}">${x.val}</td>
      </tr>`).join('')}
    </table>`:'<div class="empty">-</div>'}`;

  return `<div class="card">
    <h2>🏛️ Legenda Liga Indonesia</h2>
    <h3 style="margin-top:14px;color:#ffd700;font-size:15px">🐐 GOAT — Greatest of All Time</h3>
    <p style="font-size:10px;color:#7fae94;margin-bottom:8px">
      Skor = ⚽×3 + 🎯×2.5 + 🏅×4 + 🧤×2.5 + 📋×0.1 − 🟨🟥×0.5
    </p>
    <table>
      <tr><th>#</th><th>Pemain</th><th class="num">Skor</th><th class="num">⚽</th><th class="num">🎯</th><th class="num">🏅</th></tr>
      ${goats.map((x,i)=>`<tr class="${i===0?'mine':''}">
        <td style="font-size:14px">${i+1}${i===0?' 🐐':''}</td>
        <td>${x.name}<br><span style="font-size:9px;color:#8bb59f">${(x.teams||[]).join(', ')}</span></td>
        <td class="num" style="font-weight:900;color:#ffd700;font-size:14px">${x.score}</td>
        <td class="num">${x.goals}</td>
        <td class="num">${x.assists}</td>
        <td class="num">${x.mvp}</td>
      </tr>`).join('')}
    </table>
    ${section('⚽ Top Skor Sepanjang Masa',getTopBy('scorers'),'Gol','#2ecc71')}
    ${section('🎯 Top Asis Sepanjang Masa',getTopBy('assisters'),'Asis','#457b9d')}
    ${section('🏅 Top MVP Sepanjang Masa',getTopBy('mvp'),'MVP','#e9c46a')}
    ${section('🧤 Top Clean Sheet Sepanjang Masa',getTopBy('cs'),'CS','#5e60ce')}
    ${section('📋 Top Penampilan Sepanjang Masa',getTopBy('apps'),'Laga','#8bb59f')}
  </div>`;
}

/* ==================== TRANSFER ==================== */
function renderTransfer(){
  const my=state.teams[state.myIdx];
  const myPlayers=[...my.players].sort((a,b)=>b.rating-a.rating);
  const avail=[];
  state.teams.forEach((t,i)=>{
    if(i===state.myIdx) return;
    t.players.forEach(p=>{
      if(t.xi.includes(p.id)) return;
      if(p.age>40) return;
      const price=marketValue(p);
      if(price<=my.budget*1.5) avail.push({p,from:t,price});
    });
  });
  avail.sort((a,b)=>b.p.rating-a.p.rating);
  const buyList=avail.slice(0,50);
  return `<div class="card">
    <h2>💰 Bursa Transfer</h2>
    <div style="font-size:14px;color:#e9c46a;margin-bottom:12px">
      Budget Anda: <b>${formatIDR(my.budget)}</b>
    </div>
    <h3>Jual Pemain (${myPlayers.length})</h3>
    <div class="scroll-box" style="max-height:240px">
      <table>
        <tr><th>Nama</th><th>Pos</th><th class="num">Rat</th><th class="num">Umur</th><th class="num">Harga</th><th></th></tr>
        ${myPlayers.map(p=>{
          const price=Math.round(marketValue(p)*0.8);
          const inXI=my.xi.includes(p.id);
          return `<tr>
            <td>${p.name}${inXI?' <span style="color:#2ecc71;font-size:9px">XI</span>':''}${p.specialSkill?` <span onclick="showPlayerDetail(${p.id})" style="cursor:pointer">${p.specialSkill.icon}</span>`:''}</td>
            <td><span class="pos-mini pos ${p.pos}">${p.pos}</span></td>
            <td class="num">${p.rating}</td>
            <td class="num">${p.age}</td>
            <td class="num">${formatIDR(price)}</td>
            <td><button class="btn small" onclick="sellPlayer(${p.id})">Jual</button></td>
          </tr>`;
        }).join('')}
      </table>
    </div>
    <h3>Beli Pemain</h3>
    <div class="scroll-box" style="max-height:320px">
      <table>
        <tr><th>Nama</th><th>Klub</th><th>Pos</th><th class="num">Rat</th><th class="num">Harga</th><th></th></tr>
        ${buyList.map(x=>`<tr>
          <td>${x.p.name}${x.p.specialSkill?` <span onclick="showPlayerDetailOther(${x.p.id})" style="cursor:pointer">${x.p.specialSkill.icon}</span>`:''}</td>
          <td style="font-size:10px">${x.from.name}</td>
          <td><span class="pos-mini pos ${x.p.pos}">${x.p.pos}</span></td>
          <td class="num">${x.p.rating}</td>
          <td class="num">${formatIDR(x.price)}</td>
          <td><button class="btn small" ${x.price>my.budget?'disabled':''} onclick="buyPlayer(${x.p.id})">Beli</button></td>
        </tr>`).join('')}
      </table>
    </div>
  </div>`;
}
function buyPlayer(pid){
  const my=state.teams[state.myIdx];
  let seller=null, p=null;
  for(const t of state.teams){
    if(t===my) continue;
    const found=t.players.find(x=>x.id===pid);
    if(found){ seller=t; p=found; break; }
  }
  if(!p){ toast('Pemain tidak ditemukan'); return; }
  const price=marketValue(p);
  if(price>my.budget){ toast('Budget tidak cukup'); return; }
  my.budget-=price;
  seller.budget+=price;
  seller.players=seller.players.filter(x=>x.id!==pid);
  seller.xi=seller.xi.filter(id=>id!==pid);
  if(seller.xi.length<11) autoPickXI(seller,seller.formation);
  my.players.push(p);
  toast(`✅ ${p.name} bergabung! -${formatIDR(price)}`);
  render();
}
function sellPlayer(pid){
  const my=state.teams[state.myIdx];
  const p=my.players.find(x=>x.id===pid);
  if(!p) return;
  const price=Math.round(marketValue(p)*0.8);
  my.budget+=price;
  my.players=my.players.filter(x=>x.id!==pid);
  my.xi=my.xi.filter(id=>id!==pid);
  if(my.xi.length<11) autoPickXI(my,my.formation);
  toast(`💸 ${p.name} dijual +${formatIDR(price)}`);
  render();
}
function showPlayerDetailOther(pid){
  for(const t of state.teams){
    const p=t.players.find(x=>x.id===pid);
    if(p){
      const spec=p.specialSkill?`<div style="background:#1a1408;padding:10px;border-radius:8px;margin-top:8px;border:1px solid #ffd700">
        <div style="font-size:20px">${p.specialSkill.icon}</div>
        <div style="color:#ffd700;font-weight:800;font-size:13px">${p.specialSkill.name}</div>
        <div style="font-size:10px;color:#e9c46a">${p.specialSkill.desc}</div>
      </div>`:'';
      const skills=(p.skills||[]).map(s=>`<span style="display:inline-block;background:#182720;padding:3px 7px;border-radius:5px;font-size:10px;margin:2px;border:1px solid #2f5442">${s.name}</span>`).join('');
      const modal=document.createElement('div');
      modal.id='createModal';
      modal.innerHTML=`<div class="inner">
        <h2>${p.name}</h2>
        <div class="sub">${t.name} · ${p.pos} · ${p.age}th · Rating ${p.rating}</div>
        <div style="background:#16241d;padding:10px;border-radius:8px;font-size:12px;line-height:1.8;color:#a8e6c1">
          <b>Posisi:</b> ${(p.positions||[p.pos]).join(' · ')}<br>
          <b>Potential:</b> ${p.potential||'-'}<br>
          <b>Nilai pasar:</b> ${formatIDR(marketValue(p))}
        </div>
        ${spec}
        <h3 style="margin-top:12px">Keahlian</h3>
        <div>${skills||'<span class="empty">-</span>'}</div>
        <button class="btn primary" style="width:100%;margin-top:14px" onclick="this.closest('#createModal').remove()">Tutup</button>
      </div>`;
      document.body.appendChild(modal);
      return;
    }
  }
}

/* ==================== INTERAKSI ==================== */
function setTab(t){ state.tab=t; state.selectedStarter=null; render(); }
function setTableDiv(d){ state.tableDiv=d; render(); }
function selectStarter(id){
  state.selectedStarter = state.selectedStarter===id ? null : id;
  render();
}
function swapWith(benchId){
  if(state.selectedStarter===null){ toast('Pilih pemain inti dulu'); return; }
  const my=state.teams[state.myIdx];
  const newP=getP(my,benchId);
  if(newP && newP.injury>0){ toast(`${newP.name} masih cedera ${newP.injury} pekan`); return; }
  const i=my.xi.indexOf(state.selectedStarter);
  const backup=my.xi[i];
  my.xi[i]=benchId;
  if(!checkXI(my)){ my.xi[i]=backup; toast('Formasi jadi tidak valid!'); return; }
  state.selectedStarter=null;
  render();
}
function setFormation(f){
  const my=state.teams[state.myIdx];
  my.formation=f; autoPickXI(my,f);
  state.selectedStarter=null; render();
}
function setMentality(m){ state.teams[state.myIdx].tactics.mentality=m; render(); }
function toggleTraining(pid){
  state.training=state.training||[];
  if(state.training.includes(pid)){
    state.training=state.training.filter(x=>x!==pid);
  } else if(state.training.length<3){
    state.training.push(pid);
  } else {
    toast('Maksimal 3 pemain latihan'); return;
  }
  render();
}
function promoteYouth(pid){
  const my=state.teams[state.myIdx];
  const p=my.academy.find(x=>x.id===pid);
  if(!p){ toast('Pemain tidak ditemukan'); return; }
  if(p.age<15){ toast('Usia minimal 15 tahun untuk promosi'); return; }
  if(my.players.length>=25){ toast('Tim utama penuh (maks 25)'); return; }
  my.academy=my.academy.filter(x=>x.id!==pid);
  my.players.push(p);
  toast(`⬆️ ${p.name} naik ke tim utama!`);
  render();
}
function releaseYouth(pid){
  const my=state.teams[state.myIdx];
  const p=my.academy.find(x=>x.id===pid);
  if(!p) return;
  my.academy=my.academy.filter(x=>x.id!==pid);
  toast(`👋 ${p.name} dilepas dari akademi`);
  render();
}

function getTeamPositions(team, mirror){
  const f=FORMATION_POS[team.formation]||FORMATION_POS['4-3-3'];
  const xi=team.xi.map(id=>getP(team,id)).filter(Boolean);
  const out=[];
  const idx={GK:0,DEF:0,MID:0,FWD:0};
  xi.forEach(p=>{
    const arr=f[p.pos];
    if(!arr) return;
    const pos=arr[idx[p.pos]++ % arr.length];
    out.push({x:mirror?100-pos[0]:pos[0], y:pos[1]});
  });
  return out;
}

function ballTargetFor(e){
  const isHome=e.team==='home';
  if(e.type==='goal'){
    return isHome?{x:ri(91,95),y:ri(27,37)}:{x:ri(5,9),y:ri(27,37)};
  }
  if(e.type==='card'){
    return {x:ri(25,75),y:ri(15,49)};
  }
  if(e.type==='commentary'){
    const t=e.text||'';
    if(/corner|sudut/i.test(t)){
      const side=Math.random()<0.5?4:96;
      return {x:side,y:Math.random()<0.5?4:60};
    }
    if(/kiper|penyelamatan|menepis/i.test(t)){
      return isHome?{x:ri(88,94),y:ri(28,36)}:{x:ri(6,12),y:ri(28,36)};
    }
    return {x:ri(30,70),y:ri(10,54)};
  }
  return {x:50,y:32};
}
function updatePitch(e){
  const svg=document.querySelector('.pitch');
  if(!svg) return;
  const ball=svg.querySelector('#pitchBall');
  if(ball){
    const t=ballTargetFor(e);
    ball.setAttribute('transform',`translate(${t.x},${t.y})`);
  }
  svg.querySelectorAll('.pp').forEach(g=>{
    const bx=+g.dataset.bx, by=+g.dataset.by;
    const dx=rnd(-3,3), dy=rnd(-3,3);
    g.setAttribute('transform',`translate(${Math.max(2,Math.min(98,bx+dx))},${Math.max(2,Math.min(62,by+dy))})`);
  });
}
function resetPitch(){
  const svg=document.querySelector('.pitch');
  if(!svg) return;
  const ball=svg.querySelector('#pitchBall');
  if(ball) ball.setAttribute('transform','translate(50,32)');
  svg.querySelectorAll('.pp').forEach(g=>{
    g.setAttribute('transform',`translate(${g.dataset.bx},${g.dataset.by})`);
  });
}
function toggleSpeed(){
  state.animSpeed = (state.animSpeed===1) ? 2 : 1;
  const b=document.getElementById('speedBtn');
  if(b) b.textContent = state.animSpeed===1 ? '⏩ 1x' : '⏩⏩ 2x';
}

function pickTalk(id){

  document.querySelectorAll('#talkOpts .pc-answer').forEach(b=>{

function addSubRow(){
  const m=pendingMatch;
  if(!m||m.subsLeft<=0) return;
  const myIsHome=m.f.home===state.myIdx;
  const myTeam=myIsHome?m.h:m.a;
  const xi=myTeam.xi.map(id=>getP(myTeam,id)).filter(Boolean);
  const bench=myTeam.players.filter(p=>!myTeam.xi.includes(p.id) && !p.injury && p.stamina>30);
  if(!bench.length) return;
  const row=document.createElement('div');
  row.style.cssText='display:flex;gap:6px;margin-bottom:6px';
  row.innerHTML=`
    <select class="subOut" style="flex:1;padding:6px;background:#182720;color:#e8f0ec;border:1px solid #2f5442;border-radius:6px;font-size:11px">
      <option value="">-- Keluar --</option>
      ${xi.map(p=>`<option value="${p.id}">${p.name} (${p.pos})</option>`).join('')}
    </select>
    <select class="subIn" style="flex:1;padding:6px;background:#182720;color:#e8f0ec;border:1px solid #2f5442;border-radius:6px;font-size:11px">
      <option value="">-- Masuk --</option>
      ${bench.map(p=>`<option value="${p.id}">${p.name} (${p.pos} · ${p.rating})</option>`).join('')}
    </select>
    <button class="btn small" onclick="applySubRow(this)">✓</button>
  `;
  document.getElementById('subRows').appendChild(row);
}
function applySubRow(btn){
  const m=pendingMatch;
  const row=btn.parentElement;
  const outId=+row.querySelector('.subOut').value;
  const inId=+row.querySelector('.subIn').value;
  if(!outId||!inId){ toast('Pilih keluar & masuk'); return; }
  const myIsHome=m.f.home===state.myIdx;
  const myTeam=myIsHome?m.h:m.a;
  const outP=getP(myTeam,outId), inP=getP(myTeam,inId);
  if(!outP||!inP){ toast('Pemain tidak valid'); return; }
  if(inP.injury>0){ toast(`${inP.name} cedera`); return; }
  if(inP.stamina<30){ toast(`${inP.name} kelelahan`); return; }
  if(outP.pos!==inP.pos){ toast('Posisi harus sama'); return; }
  const idx=myTeam.xi.indexOf(outId);
  myTeam.xi[idx]=inId;
  m.subsLeft--;
  const sl=document.getElementById('subsLeft');
  if(sl) sl.textContent=m.subsLeft;
  row.remove();
  toast(`🔄 ${outP.name} → ${inP.name}`);
  if(m.subsLeft>0) addSubRow();
}
function startSecondHalf(){
  const m=pendingMatch;
  const modal=document.getElementById('createModal');
  if(modal) modal.remove();
  const talk=TEAM_TALKS.find(t=>t.id===state.selectedTalk)||TEAM_TALKS[2];

  else { m.ctx.awayBoost=talk.atk - talk.def*0.5; }

  m.ctx.H=teamStats(m.h);
  m.ctx.A=teamStats(m.a);
  toast(`🎙️ ${talk.label} diterapkan`);
  simulateSegment(m.h, m.a, 46, 90, m.ctx);
  render();
  animateHalf(2);
}

/* ==================== ANIMASI MATCH ==================== */
let animTimer=null;
function animateHalf(half){
  const m=pendingMatch;
  if(!m) return;
  const evs=m.ctx.events.filter(e=> half===1 ? e.min<=45 : e.min>45)
    .sort((a,b)=>a.min-b.min);
  const scoreEl=document.getElementById('matchScore');
  const clockEl=document.getElementById('matchClock');
  const listEl=document.getElementById('matchEvents');
  if(!scoreEl||!listEl) return;
  let idx=0;
  const startMin = half===1?0:45;
  const endMin   = half===1?45:90;
  let curMin=startMin;

  clearInterval(animTimer);
  if(half===1) resetPitch();

  const MS_PER_MIN = 3333;
  const TICK=60;
  let last=performance.now();

  animTimer=setInterval(()=>{
    const now=performance.now();
    const dt=now-last; last=now;
    const speed=state.animSpeed||1;
    curMin += (dt*speed)/MS_PER_MIN;

    while(idx<evs.length && evs[idx].min<=curMin){
      const e=evs[idx++];
      applyEventToUI(e, m, scoreEl, listEl);
    }

    if(clockEl) clockEl.textContent=`${Math.min(endMin,Math.floor(curMin))}'`;

    if(curMin>=endMin){
      clearInterval(animTimer);
      while(idx<evs.length){
        applyEventToUI(evs[idx++], m, scoreEl, listEl);
      }
      if(clockEl) clockEl.textContent=`${endMin}'`;
      if(half===1) openHalfTimeModal();
      else finishFullMatch();
    }
  }, TICK);
}
function applyEventToUI(e, m, scoreEl, listEl){
  if(e.type==='goal'){
    let hg=0, ag=0;
    for(const ev of m.ctx.events){
      if(ev.type!=='goal') continue;
      if(ev.min<e.min) { if(ev.team==='home')hg++; else ag++; }
      else if(ev.min===e.min && ev!==e){
        if(ev.team==='home')hg++; else ag++;
      }
    }
    if(e.team==='home')hg++; else ag++;
    scoreEl.textContent=`${hg} - ${ag}`;
    scoreEl.classList.add('pulse');
    setTimeout(()=>scoreEl.classList.remove('pulse'),250);
    if(state.sound) sfxGoal();
  } else if(e.type==='card' && state.sound){ sfxCard(); }
  updatePitch(e);
  const div=document.createElement('div');
  div.className='event '+e.type+' '+(e.team||'');
  div.textContent=`${e.min}'  ${e.text}`;
  listEl.appendChild(div);
  listEl.scrollTop=listEl.scrollHeight;
}
function skipAnim(){
  const m=pendingMatch;
  if(!m) return;
  clearInterval(animTimer);
  const scoreEl=document.getElementById('matchScore');
  const listEl=document.getElementById('matchEvents');
  const clockEl=document.getElementById('matchClock');
  if(listEl) listEl.innerHTML='';
  let hg=0,ag=0;
  m.ctx.events.sort((a,b)=>a.min-b.min).forEach(e=>{
    if(e.type==='goal'){ if(e.team==='home')hg++; else ag++; }
    if(listEl){
      const div=document.createElement('div');
      div.className='event '+e.type+' '+(e.team||'');
      div.textContent=`${e.min}'  ${e.text}`;
      listEl.appendChild(div);
    }
  });
  if(scoreEl) scoreEl.textContent=`${hg} - ${ag}`;
  if(clockEl) clockEl.textContent='90\'';
  if(listEl) listEl.scrollTop=listEl.scrollHeight;
  finishFullMatch();
}
function finishFullMatch(){
  clearInterval(animTimer);
  const m=pendingMatch;
  if(!m) return;
  if(!m.finished){
    m.f.played=true;
    m.f.hg=m.ctx.hg; m.f.ag=m.ctx.ag;
    finalizeMatch(m.h, m.a, m.ctx);
    m.finished=true;
  }
  if(state.sound) sfxWhistle();
  const el=document.getElementById('matchActions');
  if(el) el.innerHTML=`<button class="btn primary" onclick="nextRound()">Lanjut ➜</button>`;
}

/* ==================== SPONSOR ==================== */
function makeSponsorOffer(teamDiv){
  const pool=[...SPONSOR_POOL];
  const avail=pool.filter(s=>{
    if(teamDiv===2) return s.tier==='lokal'||s.tier==='nasional';
    return true;
  });
  const s=pick(avail);
  const t=SPONSOR_TIERS[s.tier];
  const annual=Math.round(rnd(t.annualMin,t.annualMax)/1e9)*1e9;
  const years=ri(2,20);
  const paymentMode=Math.random()<0.5?'upfront':'monthly';
  const bonuses={};
  Object.keys(SPONSOR_BONUSES).forEach(k=>{
    bonuses[k]=Math.round(annual*SPONSOR_BONUSES[k]);
  });
  return {
    id:Date.now()+Math.random(),
    sponsorName:s.name, color:s.color, tier:s.tier,
    annual, years, paymentMode, bonuses,
    totalValue:annual*years,
    offeredSeason:state.season
  };
}
function generateSponsorOffers(){
  const my=state.teams[state.myIdx];
  if(!my) return;
  if(state.sponsorOffersWeek===state.round && state.sponsorOffers.length) return;
  state.sponsorOffersWeek=state.round;
  const count=state.sponsors.length>=3?ri(1,2):ri(2,4);
  state.sponsorOffers=[];
  for(let i=0;i<count;i++) state.sponsorOffers.push(makeSponsorOffer(my.div));
}
function acceptSponsor(offerId){
  const my=state.teams[state.myIdx];
  const offer=state.sponsorOffers.find(o=>o.id===offerId);
  if(!offer) return;
  if(state.sponsors.length>=5){ toast('Maksimal 5 sponsor aktif'); return; }
  const upfront=offer.paymentMode==='upfront'?offer.annual*offer.years:0;
  if(upfront>0) my.budget += upfront;
  state.sponsors.push({
    ...offer,
    startSeason:state.season,
    endSeason:state.season+offer.years-1,
    lastPaidSeason:state.season,
    totalPaid:upfront,
    bonusesEarned:0
  });
  state.sponsorOffers=state.sponsorOffers.filter(o=>o.id!==offerId);
  toast(`🤝 ${offer.sponsorName} jadi sponsor!`);
  if(state.sound) sfxClick();
  render();
}
function rejectSponsor(offerId){
  state.sponsorOffers=state.sponsorOffers.filter(o=>o.id!==offerId);
  render();

/* ==================== IPO ==================== */
function canIPO(team){
  if(team.listed) return {ok:false, reason:'Sudah tercatat di bursa'};
  if(team.budget < IPO_CONFIG.minBudget) return {ok:false, reason:`Budget minimal ${formatIDR(IPO_CONFIG.minBudget)}`};
  if((state.managerReputation||0) < IPO_CONFIG.minReputation) return {ok:false, reason:`Reputasi manajer minimal ${IPO_CONFIG.minReputation}`};
  if((state.trophyRoom?.length||0) < IPO_CONFIG.minTrophy) return {ok:false, reason:`Minimal ${IPO_CONFIG.minTrophy} trofi`};
  if(team.div !== 1) return {ok:false, reason:'Hanya klub Divisi 1'};
  return {ok:true};
}
function calculateValuation(team){
  const squadValue=team.players.reduce((s,p)=>s+marketValue(p),0);
  const stadiumValue=team.stadium.cap*500000;
  const trophyValue=(state.trophyRoom?.length||0)*50e9;
  const reputationValue=(state.managerReputation||50)*1e9;
  return squadValue+stadiumValue+trophyValue+reputationValue;
}

function startIPOFlow(){
  const my=state.teams[state.myIdx];
  const valuation=calculateValuation(my);
  const basePrice=Math.max(IPO_CONFIG.basePrice, Math.round(valuation/IPO_CONFIG.shareCount/100)*100);
  state.ipoFlow={stage:'approval', basePrice, publicPct:IPO_CONFIG.publicPct, days:ri(3,10)};
  toast('📄 Prospektus diajukan ke OJK');
  render();
}
function ipoAdvance(){
  const f=state.ipoFlow;
  if(!f) return;
  f.days--;
  if(f.days<=0){
    if(Math.random()<0.15){
      toast('❌ OJK menolak prospektus');
      state.news.unshift({t:'❌ Pengajuan IPO ditolak OJK',time:`Musim ${state.season}`});
      state.ipoFlow=null; render(); return;
    }
    f.stage='bookbuilding';
    toast('✅ OJK menyetujui!');
  } else {
    toast(`⏳ ${f.days} hari lagi`);
  }
  render();
}

function confirmIPO(){

  my.shares={

    price, ipoPrice:price, high:price, low:price,
    history:[{season:state.season, week:state.round, price}],
    owners:[],
    dividendPerShare:0,
    totalDividendPaid:0

function buybackShares(pct){
  const my=state.teams[state.myIdx];
  if(!my.listed) return;
  const buyQty=Math.round(my.shares.public*pct);
  if(buyQty<=0) return;
  const cost=buyQty*my.shares.price;
  if(my.budget<cost){ toast('Budget tidak cukup'); return; }
  my.budget -= cost;
  my.shares.public -= buyQty;
  my.shares.insider += buyQty;
  toast(`💼 Buyback ${buyQty.toLocaleString('id-ID')} lembar`);
  render();
}
function delistStock(){
  const my=state.teams[state.myIdx];
  if(!my.listed) return;
  const cost=my.shares.public*my.shares.price;
  if(my.budget<cost){ toast(`Butuh ${formatIDR(cost)}`); return; }
  my.budget -= cost;
  my.shares.insider=my.shares.total;
  my.shares.public=0;
  my.listed=false;
  state.news.unshift({t:`📉 ${my.name} delisting dari bursa`,time:`Musim ${state.season}`});
  toast('📉 Delisting berhasil');
  render();
}
function payDividend(perShare){
  const my=state.teams[state.myIdx];
  if(!my.listed){ toast('Belum IPO'); return; }
  const totalCost=my.shares.total*perShare;
  if(my.budget<totalCost){ toast('Budget tidak cukup'); return; }
  my.budget -= totalCost;
  my.shares.dividendPerShare=perShare;
  my.shares.totalDividendPaid+=totalCost;
  state.lastDividendSeason=state.season;
  toast(`💵 Dividen: ${formatIDR(totalCost)}`);
  render();
}

/* ==================== AKUISISI ==================== */
function calculateClubValue(team){
  const squadValue=team.players.reduce((s,p)=>s+marketValue(p),0);
  const stadiumValue=team.stadium.cap*400000;
  return squadValue+stadiumValue;
}
function acquireClub(targetIdx, pct){
  const my=state.teams[state.myIdx];
  const target=state.teams[targetIdx];
  if(!target||targetIdx===state.myIdx){ toast('Pilih klub lain'); return; }
  if(target.acquiredBy!==null && target.acquiredBy!==state.myIdx){
    toast(`${target.name} sudah dikendalikan klub lain`); return;
  }
  const value=calculateClubValue(target);
  const cost=Math.round(value*pct);
  if(my.budget<cost){ toast(`Butuh ${formatIDR(cost)}`); return; }
  my.budget-=cost;
  target.acquiredBy=state.myIdx;
  target.acquiredStake=Math.min(1,(target.acquiredStake||0)+pct);
  const totalStake=target.acquiredStake;
  let acq=state.acquisitions.find(a=>a.targetIdx===targetIdx);
  if(!acq){
    acq={targetIdx, totalCost:cost, stake:totalStake, since:state.season};
    state.acquisitions.push(acq);
  } else {
    acq.totalCost+=cost;
    acq.stake=totalStake;
  }
  state.news.unshift({t:`🏢 ${my.name} akuisisi ${(pct*100).toFixed(0)}% ${target.name} — ${formatIDR(cost)}`,time:`Musim ${state.season}`});
  if(totalStake>=0.51){ toast(`👑 ${target.name} dikuasai!`); }
  else toast(`🏢 ${(totalStake*100).toFixed(0)}% ${target.name} dikuasai`);
  if(state.sound) sfxGoal();
  render();
}
function releaseClub(targetIdx){
  const target=state.teams[targetIdx];
  if(!target||target.acquiredBy!==state.myIdx) return;
  const value=calculateClubValue(target);
  const refund=Math.round(value*target.acquiredStake*0.85);
  state.teams[state.myIdx].budget+=refund;
  state.acquisitions=state.acquisitions.filter(a=>a.targetIdx!==targetIdx);
  target.acquiredBy=null;
  target.acquiredStake=0;
  toast(`💸 ${target.name} dilepas +${formatIDR(refund)}`);
  render();
}
function renderAkuisisi(){
  const my=state.teams[state.myIdx];
  const owned=state.acquisitions;
  const available=state.teams.map((t,i)=>({t,i}))
    .filter(x=>x.i!==state.myIdx && (x.t.acquiredBy===null || x.t.acquiredBy===state.myIdx))
    .map(x=>{
      const val=calculateClubValue(x.t);
      const stake=x.t.acquiredStake||0;
      return {...x, val, stake};
    })
    .sort((a,b)=>a.val-b.val);
  return `<div class="card">
    <h2>🏢 Akuisisi Klub</h2>
    <div style="background:#16241d;padding:12px;border-radius:10px;margin-bottom:12px;font-size:12px;color:#8bb59f;line-height:1.8">
      Beli saham klub lain untuk pendapatan pasif tiap musim.<br>
      • <b>10%+</b> akses pemain akademi mereka<br>
      • <b>51%+</b> kendali penuh<br>
      • <b>100%</b> kepemilikan penuh
    </div>
    <h3>💰 Klub Milik Anda</h3>
    ${owned.length?owned.map(a=>{
      const t=state.teams[a.targetIdx];
      return `<div style="background:#0f1a15;border:1px solid #ffd700;border-radius:10px;padding:10px;margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <b style="color:${t.color}">${t.name}</b>
          <span style="font-size:11px;color:#ffd700">${(a.stake*100).toFixed(0)}%</span>
        </div>
        <div style="font-size:11px;color:#8bb59f;margin-top:4px">
          Div ${t.div} · Investasi: ${formatIDR(a.totalCost)} · Sejak musim ${a.since}
        </div>
        <button class="btn small danger" style="margin-top:6px" onclick="releaseClub(${a.targetIdx})">Lepas</button>
      </div>`;
    }).join(''):'<div class="empty">Belum memiliki klub lain.</div>'}
    <h3 style="margin-top:16px">🎯 Klub Tersedia</h3>
    <div style="font-size:11px;color:#7fae94;margin-bottom:8px">
      Budget: <b style="color:#ffd700">${formatIDR(my.budget)}</b>
    </div>
    ${available.slice(0,15).map(x=>{
      const cost10=Math.round(x.val*0.10);
      const costTo51=Math.round(x.val*(0.51-x.stake));
      const costRest=Math.round(x.val*(1-x.stake));
      return `<div style="background:#16241d;border:1px solid #24382e;border-radius:10px;padding:10px;margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <b style="color:${x.t.color}">${x.t.name}</b>
          <span style="font-size:10px;color:#8bb59f">Div ${x.t.div}</span>
        </div>
        <div style="font-size:11px;color:#8bb59f;line-height:1.7;margin-bottom:8px">
          Nilai: <b style="color:#ffd700">${formatIDR(x.val)}</b><br>
          Kepemilikan: <b>${(x.stake*100).toFixed(0)}%</b>
        </div>
        <div class="row">
          ${x.stake<0.10?`<button class="btn small" ${my.budget<cost10?'disabled':''} onclick="acquireClub(${x.i},0.10)">+10% (${formatIDR(cost10)})</button>`:''}
          ${x.stake>=0.10 && x.stake<0.51?`<button class="btn small primary" ${my.budget<costTo51?'disabled':''} onclick="acquireClub(${x.i},${(0.51-x.stake).toFixed(2)})">Jadi 51% (${formatIDR(costTo51)})</button>`:''}
          ${x.stake>=0.51 && x.stake<0.999?`<button class="btn small primary" ${my.budget<costRest?'disabled':''} onclick="acquireClub(${x.i},${(1-x.stake).toFixed(2)})">100% (${formatIDR(costRest)})</button>`:''}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

   ]},
  {q:'Kompetisi musim ini sangat ketat, komentar?',
   a:[
     {t:'Kami fokus pada pertandingan sendiri.',eff:+1},
     {t:'Kami akan berjuang sampai akhir.',eff:+2},

function openPressConference(){
  const qs=[];
  while(qs.length<2){const q=pick(PC_QUESTIONS);if(!qs.includes(q))qs.push(q);}
  const m=document.createElement('div');
  m.id='createModal';
  m.innerHTML=`<div class="inner">
    <h2>🎤 Press Conference</h2>

      <div style="margin-bottom:14px">

        ${q.a.map(a=>`<button class="pc-answer" onclick="answerPC(${a.eff},this)">${a.t}</button>`).join('')}
      </div>
    `).join('')}
    <button class="btn primary" style="width:100%" onclick="closePC()">Selesai</button>
  </div>`;

function answerPC(eff,btn){
  state.morale=(state.morale||0)+eff;
  btn.style.background=eff>0?'#1d3a27':eff<0?'#3a1d20':'#26432f';
  btn.style.borderColor=eff>0?'#2ecc71':eff<0?'#e63946':'#457b9d';
  btn.disabled=true;
}
function closePC(){
  const m=document.getElementById('createModal');
  if(m) m.remove();
  if(state.morale){
    const my=state.teams[state.myIdx];
    my.players.forEach(p=>{p.rating=Math.max(40,Math.min(95,p.rating+Math.round(state.morale/3)));});
    toast(`Moral: ${state.morale>0?'+':''}${state.morale}`);
  }
  state.morale=0;
  render();
  setTimeout(()=>playRound(), 100);
}

let audioCtx=null;
function beep(freq,dur,type='sine',vol=0.15){
  if(!state.sound) return;
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.value=vol;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
    o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
function sfxGoal(){ beep(880,0.12,'square',0.2); setTimeout(()=>beep(1100,0.15,'square',0.18),100); setTimeout(()=>beep(1320,0.2,'square',0.15),220); }

function slotKey(n){ return SAVE_PREFIX+n; }

function hasSave(n){

function loadGame(n){
  try{
    const key=slotKey(n||state.activeSlot);
    const raw=localStorage.getItem(key);
    if(!raw) return false;
    const data=JSON.parse(raw);
    Object.assign(state, data.state);
    PID=data.PID||0;
    if(state.fixtures){
      state.fixtures={
        1: state.fixtures['1']||state.fixtures[1]||[],
        2: state.fixtures['2']||state.fixtures[2]||[]
      };
    }
    if(!state.history) state.history=[];
    if(!state.news) state.news=[];
    if(!state.training) state.training=[];
    if(!state.sponsors) state.sponsors=[];
    if(!state.sponsorOffers) state.sponsorOffers=[];
    if(!state.acquisitions) state.acquisitions=[];
    if(!state.allTime) state.allTime={scorers:{},assisters:{},mvp:{},cs:{},apps:{},cards:{}};
    if(!state.trophyRoom) state.trophyRoom=[];
    if(state.managerName===undefined) state.managerName='';
    if(state.managerReputation===undefined) state.managerReputation=50;
    if(state.fanMood===undefined) state.fanMood=50;
    if(state.theme===undefined) state.theme='dark';
    if(state.sound===undefined) state.sound=true;
    if(state.activeSlot===undefined || state.activeSlot===null) state.activeSlot=n||1;
    if(state.myIdx!=null && state.teams[state.myIdx]) state.myDiv=state.teams[state.myIdx].div;
    return true;
  }catch(e){
    console.warn('Load failed',e);
    return false;

/* ==================== NEXT ROUND ==================== */
function nextRound(){
  // ===== 1. Pemasukan laga kandang dari laga yang baru selesai =====
  const prevRound=state.round;
  const prevF=state.fixtures[state.myDiv]?.[prevRound]?.find(f=>f.home===state.myIdx);
  if(prevF && prevF.played){
    const myScore=prevF.hg;
    const oppScore=prevF.ag;
    const oppTeam=state.teams[prevF.away];
    const rev=calcHomeMatchRevenue(state.teams[state.myIdx], oppTeam, myScore, oppScore);
    state.teams[state.myIdx].budget += rev.net;
    state.lastAttendance=rev.attendance;
    state.teams[state.myIdx].stadium.revenueHistory.push({...rev, week:state.round});
    if(state.teams[state.myIdx].stadium.revenueHistory.length>20){
      state.teams[state.myIdx].stadium.revenueHistory=state.teams[state.myIdx].stadium.revenueHistory.slice(-20);
    }
    if(rev.riot){
      state.news.unshift({t:`🔥 Kerusuhan di stadion! Kerusakan ${formatIDR(rev.riot.damage)}`,time:`Musim ${state.season} · Pekan ${state.round}`});
      if(state.sound) sfxCard();
    }
    if(rev.occ>=0.98){
      state.news.unshift({t:`🎉 Stadion nyaris penuh! ${rev.attendance.toLocaleString('id-ID')} penonton`,time:`Musim ${state.season} · Pekan ${state.round}`});
    }
  }

  // ===== 2. Update harga saham =====
  if(prevF){
    const isHome=prevF.home===state.myIdx;
    updateAllStocks({
      gf: isHome?prevF.hg:prevF.ag,
      ga: isHome?prevF.ag:prevF.hg,
      isHome
    });
  } else {
    updateAllStocks(null);
  }

  // ===== 3. Increment pekan =====
  state.round++;

  // ===== 4. Trigger Piala Nasional =====
  if([5,9,13,17].includes(state.round)){
    if(!state.pialaNasional) startPialaNasional();
    if(state.pialaNasional && !state.pialaNasional.finished) playPialaRound();
  }

  // ===== 5. Berita acak =====
  addRandomNews();
  if(Math.random()<0.4) addRandomNews();

  // ===== 6. Cek akhir musim =====
  if(state.round>=TOTAL_ROUNDS){
    finalizeSeason();
    processPromotionRelegation();
    state.view='seasonEnd';
  } else {
    state.view='main';
    state.tab='klasemen';
    state.tableDiv=state.myDiv;
  }
  render();
}

/* ==================== FINALIZE SEASON ==================== */
function finalizeSeason(){
  // 1. Piala Nusantara
  startPialaNusantara();
  if(state.pialaNusantara){
    let guard=0;
    while(!state.pialaNusantara.finished && guard++<5){
      playPialaNusantaraRound();
    }
  }

  // 2. Liga Champions Asia
  startLigaChampions();
  if(state.ligaChampions){
    let guardLC=0;
    while(!state.ligaChampions.finished && guardLC++<5){
      playLigaChampionsRound();
    }
  }

  // 3. Akumulasi statistik sepanjang masa
  accumulateSeason();

  // 4. Ruang trofi user
  const seasonNum=state.season;
  const t1=getTable(1), t2=getTable(2);
  const myT=state.teams[state.myIdx];
  if(t1[0] && t1[0].idx===state.myIdx && myT.div===1){
    state.trophyRoom.push({type:'Juara Divisi 1', season:seasonNum});
  }
  if(t2[0] && t2[0].idx===state.myIdx && myT.div===2){
    state.trophyRoom.push({type:'Juara Divisi 2', season:seasonNum});
  }
  if(state.currentPialaNasWinner && state.currentPialaNasWinner.idx===state.myIdx){
    state.trophyRoom.push({type:'Piala Nasional', season:seasonNum});
  }
  if(state.currentPialaNusWinner && state.currentPialaNusWinner.idx===state.myIdx){
    state.trophyRoom.push({type:'Piala Nusantara', season:seasonNum});
  }
  if(state.currentLCWinner && state.currentLCWinner.idx===state.myIdx){
    state.trophyRoom.push({type:'Liga Champions Asia', season:seasonNum});
  }

  // 5. Bonus sponsor performa
  const myResult = myT.div===1 ? t1 : t2;
  const myRank = myResult.findIndex(r=>r.idx===state.myIdx)+1;
  const wonLeague = myT.div===1 && myRank===1;
  const wonDiv2 = myT.div===2 && myRank===1;
  const isRunnerUp = myRank===2;
  const isTop4 = myRank>=3 && myRank<=4;
  state.sponsors.forEach(sp=>{
    let bonus=0;
    if(wonLeague) bonus += sp.bonuses.juara_liga||0;
    if(wonDiv2) bonus += (sp.bonuses.juara_liga||0)*0.4;
    if(isRunnerUp) bonus += sp.bonuses.runner_up||0;
    if(isTop4) bonus += sp.bonuses.top4||0;
    if(state.currentPialaNasWinner && state.currentPialaNasWinner.idx===state.myIdx) bonus += sp.bonuses.juara_piala||0;
    if(state.currentLCWinner && state.currentLCWinner.idx===state.myIdx) bonus += sp.bonuses.juara_lca||0;
    if(bonus>0){
      myT.budget += bonus;
      sp.bonusesEarned += bonus;
      sp.totalPaid += bonus;
      state.news.unshift({t:`💰 ${sp.sponsorName} bayar bonus ${formatIDR(bonus)}`,time:`Musim ${state.season}`});
    }
  });

  // 6. Bonus pemain performa
  let totalPlayerBonus=0;
  state.teams.forEach(t=>{
    t.players.forEach(p=>{
      const gb=(p.goalBonus||0)*p.seasonGoals;
      const ab=(p.assistBonus||0)*p.assists;
      const cb=(p.csBonus||0)*p.cs;
      const mb=(p.mvpBonus||0)*p.mvp;
      const tot=gb+ab+cb+mb;
      if(tot>0){
        t.budget -= tot;
        p.lastSeasonBonus=tot;
        if(t===myT) totalPlayerBonus+=tot;
      }
    });
  });
  if(totalPlayerBonus>0){
    state.news.unshift({t:`💵 Bonus pemain dibayar: ${formatIDR(totalPlayerBonus)}`,time:`Musim ${state.season}`});
  }

  // 7. Pendapatan pasif dari akuisisi
  state.acquisitions.forEach(a=>{
    const t=state.teams[a.targetIdx];
    if(!t) return;
    const tDiv=t.div===1 ? getTable(1) : getTable(2);
    const pos=tDiv.findIndex(r=>r.idx===a.targetIdx)+1;
    const baseIncome=calculateClubValue(t)*0.05*a.stake;
    let posBonus=0;
    if(pos===1) posBonus=0.5;
    else if(pos<=3) posBonus=0.25;
    else if(pos<=8) posBonus=0.10;
    const totalIncome=Math.round(baseIncome*(1+posBonus));
    myT.budget+=totalIncome;
    state.news.unshift({t:`💼 Dividen ${t.name} (${(a.stake*100).toFixed(0)}%) — ${formatIDR(totalIncome)}`,time:`Musim ${state.season}`});
  });

  // 8. Akses akademi dari akuisisi >= 10%
  state.acquisitions.forEach(a=>{
    if(a.stake<0.10) return;
    const t=state.teams[a.targetIdx];
    if(!t||!t.academy.length) return;
    const best=[...t.academy].sort((x,y)=>y.rating-x.rating)[0];
    if(best && myT.academy.length<15){
      myT.academy.push({...best, id:PID++});
      state.news.unshift({t:`🎓 Rekrut dari akademi ${t.name}: ${best.name}`,time:`Musim ${state.season}`});
    }
  });

  // 9. Dividen wajib kalau laba besar
  if(myT.listed && myT.budget>500e9){
    const divPerShare=20000;
    const totalCost=myT.shares.total*divPerShare;
    if(myT.budget>totalCost*1.5){
      myT.budget -= totalCost;
      myT.shares.totalDividendPaid+=totalCost;
      myT.shares.dividendPerShare=divPerShare;
      state.news.unshift({t:`💵 ${myT.name} bagikan dividen ${formatIDR(divPerShare)}/lembar`,time:`Musim ${state.season}`});
    }
  }

  // 10. Reputasi manajer dari market cap
  if(myT.listed){
    const mc=myT.shares.total*myT.shares.price;
    if(mc>2000e9){
      state.managerReputation=Math.min(100,(state.managerReputation||50)+5);
      state.news.unshift({t:`🌟 Reputasi ${state.managerName} melonjak — market cap ${formatIDR(mc)}`,time:`Musim ${state.season}`});
    }
    if(myT.shares.price < myT.shares.ipoPrice*0.5){
      state.news.unshift({t:`⚠️ Saham ${myT.name} jatuh >50% dari IPO!`,time:`Musim ${state.season}`});
      state.fanMood=Math.max(0,(state.fanMood??50)-10);
    }
  }

  // 11. Mood suporter dari posisi
  if(myRank===1){
    state.fanMood=100;
    state.news.unshift({t:`🎉 Suporter euforia! Mood mencapai 100!`,time:`Musim ${state.season}`});
  } else if(myRank<=4){
    state.fanMood=Math.min(100,(state.fanMood??50)+15);
  }
}

/* ==================== PROMOSI / DEGRADASI ==================== */
function processPromotionRelegation(){
  const t1=getTable(1), t2=getTable(2);
  const relegated=t1.slice(-RELEGATED);
  const promoted=t2.slice(0,PROMOTED);
  const reldIdx=relegated.map(r=>r.idx);
  const promIdx=promoted.map(r=>r.idx);

  const myTeam=state.teams[state.myIdx];
  const oldDiv=myTeam.div;
  const myResult = oldDiv===1 ? t1 : t2;
  const myPos = myResult.findIndex(r=>r.idx===state.myIdx)+1;

  // ===== Award collection =====
  const allPlayers=[];
  state.teams.forEach(t=>t.players.forEach(p=>allPlayers.push({p,t})));
  const byMvp=[...allPlayers].sort((a,b)=>b.p.mvp-a.p.mvp);
  const byGoals=[...allPlayers].sort((a,b)=>b.p.seasonGoals-a.p.seasonGoals);
  const byAssists=[...allPlayers].sort((a,b)=>b.p.assists-a.p.assists);
  const byRating=[...allPlayers].sort((a,b)=>b.p.rating-a.p.rating);
  const youngPool=[...allPlayers].filter(x=>x.p.age<=21).sort((a,b)=>b.p.rating-a.p.rating);
  const posOrder=['GK','DEF','MID','FWD'];
  const bestXI=[];
  posOrder.forEach(pos=>{
    const take=pos==='GK'?1:pos==='DEF'?4:pos==='MID'?3:3;
    const list=[...allPlayers].filter(x=>x.p.pos===pos).sort((a,b)=>b.p.rating-a.p.rating).slice(0,take);
    list.forEach(x=>bestXI.push({name:x.p.name, team:x.t.name, pos, rating:x.p.rating}));
  });

  // ===== History entry =====
  state.history.push({
    season: state.season,
    div1Champ: {name:t1[0].team.name, pts:t1[0].Pts},
    div2Champ: {name:t2[0].team.name, pts:t2[0].Pts},
    myTeam: myTeam.name,
    myDiv: oldDiv,
    myPos: myPos,
    myPts: myResult[myPos-1]?myResult[myPos-1].Pts:0,
    pialaNasWinner: state.currentPialaNasWinner,
    pialaNusWinner: state.currentPialaNusWinner,
    ligaChampWinner: state.currentLCWinner,
    awardMVP: byMvp[0]?{name:byMvp[0].p.name, team:byMvp[0].t.name, val:byMvp[0].p.mvp}:null,
    awardTopScorer: byGoals[0]?{name:byGoals[0].p.name, team:byGoals[0].t.name, val:byGoals[0].p.seasonGoals}:null,
    awardTopAssist: byAssists[0]?{name:byAssists[0].p.name, team:byAssists[0].t.name, val:byAssists[0].p.assists}:null,
    awardGoldenBoy: youngPool[0]?{name:youngPool[0].p.name, team:youngPool[0].t.name, rating:youngPool[0].p.rating}:null,
    awardBestRating: byRating[0]?{name:byRating[0].p.name, team:byRating[0].t.name, rating:byRating[0].p.rating}:null,
    bestXI
  });

  // ===== Swap divisi =====
  reldIdx.forEach(i=>state.teams[i].div=2);
  promIdx.forEach(i=>state.teams[i].div=1);

  let myChange='stayed';
  if(promIdx.includes(state.myIdx)) myChange='promoted';
  else if(reldIdx.includes(state.myIdx)) myChange='relegated';

  state.lastPR={
    relegated: relegated.map(r=>r.team.name),
    promoted: promoted.map(r=>r.team.name),
    myName: myTeam.name,
    myChange,
    myDiv: myTeam.div
  };
  state.myDiv=myTeam.div;

  // Reset flag piala
  state.currentPialaNasWinner=null;
  state.currentPialaNusWinner=null;
  state.currentLCWinner=null;
}

/* ==================== MUSIM BARU ==================== */
function startNewSeason(){
  state.season++;
  state.pialaNasional=null;
  state.pialaNusantara=null;
  state.ligaChampions=null;
  state.currentPialaNasWinner=null;
  state.currentPialaNusWinner=null;
  state.currentLCWinner=null;
  state.pcAnswered=false;
  state.training=[];
  state.lastPR=null;

  state.teams.forEach(t=>{
    const baseR=avg(t.players.map(p=>p.rating))||60;
    const recycled=[];

    t.players.forEach(p=>{
      p.age++;
      if(p.age>45){
        recycled.push(makeYouth(baseR, p));
        return;
      }
      const talent=p.talent||1.0;
      if(p.age<=21) p.rating += Math.round(ri(3,6)*talent);
      else if(p.age<=25) p.rating += Math.round(ri(2,4)*talent);
      else if(p.age<=28) p.rating += Math.round(ri(0,2)*talent);
      else if(p.age<=31) p.rating += ri(-1,1);
      else if(p.age<=35) p.rating -= ri(1,3);
      else if(p.age<=40) p.rating -= ri(2,4);
      else p.rating -= ri(3,6);
      const cap = p.age<=28 ? (p.potential||95) : 95;
      p.rating=Math.max(38, Math.min(95, cap, p.rating));

      // Reset season stats
      p.seasonGoals=0; p.apps=0;
      p.assists=0; p.yellow=0; p.red=0; p.cs=0; p.mvp=0;
      p.stamina=100; p.injury=0; p.injuryType='';
      p.ratings=[]; p.avgRating=0;
      if(p.contractYears>0) p.contractYears--;
      p.weeklyWage=weeklyWage(p);
    });

    // Remove retired
    t.players=t.players.filter(p=>p.age<=45);
    t.xi=t.xi.filter(id=>t.players.some(p=>p.id===id));

    // Academy development
    t.academy.forEach(p=>{
      p.age++;
      const gain=ri(2,5)*(p.talent||1.0);
      p.rating=Math.min(p.potential||85, p.rating+Math.round(gain));
    });
    t.academy=t.academy.filter(p=>p.age<=19);

    // Recycle
    t.academy.push(...recycled);

    // New youth intake
    const intake=ri(1,3);
    for(let i=0;i<intake;i++) t.academy.push(makeYouth(baseR));

    // Fix XI
    if(!checkXI(t) || t.xi.length<11) autoPickXI(t, t.formation);

    // Budget top-up
    t.budget += (t.div===1?ri(40,90):ri(15,40))*1e9;
  });

  // Sponsor payments
  const myT=state.teams[state.myIdx];
  if(myT){
    state.sponsors=state.sponsors.filter(sp=>{
      if(sp.endSeason<state.season){
        state.news.unshift({t:`📄 Kontrak sponsor ${sp.sponsorName} berakhir.`,time:`Musim ${state.season}`});
        return false;
      }
      if(sp.paymentMode==='monthly' && sp.lastPaidSeason<state.season){
        myT.budget += sp.annual;
        sp.lastPaidSeason=state.season;
        sp.totalPaid += sp.annual;
      }
      return true;
    });
  }

  // Mood suporter pulih
  state.fanMood=Math.min(100,(state.fanMood??50)+10);

  // AI formasi acak ulang
  randomizeAIFormations();

  // Fixtures baru
  state.fixtures={
    1: makeFixtures(getDivIndices(1)),
    2: makeFixtures(getDivIndices(2))
  };
  state.round=0;
  state.view='main';
  state.tab='squad';
  state.tableDiv=state.myDiv;

  render();
}

      navigator.serviceWorker.register(swURL).catch(()=>{});
    }
  }catch(e){}
})();
