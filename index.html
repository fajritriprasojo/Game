<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>⚽ Liga Manajer Indonesia</title>
<meta name="theme-color" content="#16241d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" id="pwaManifest">
<style>
/* ==================== RESET & BASE ==================== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:radial-gradient(circle at 20% 0%,#16241d 0%,#0b120f 60%);
  color:#e8f0ec;min-height:100vh;padding:12px;padding-bottom:85px;overflow-x:hidden}
.wrap{max-width:940px;margin:0 auto}

/* ==================== HEADER ==================== */
header{display:flex;justify-content:space-between;align-items:center;
  padding:12px 14px;margin-bottom:12px;border-radius:14px;
  background:linear-gradient(100deg,#1b3a2c,#12261d);
  border:1px solid #2c4a3a;box-shadow:0 6px 24px rgba(0,0,0,.35);
  position:sticky;top:6px;z-index:50}
header h1{font-size:15px;letter-spacing:.5px;cursor:pointer;user-select:none}
#hdr-sub{font-size:10px;color:#8fbfa4;text-align:right;line-height:1.5}

/* ==================== CARD ==================== */
.card{background:#131e19;border:1px solid #24382e;border-radius:14px;
  padding:14px;margin-bottom:12px}
h2{font-size:15px;margin-bottom:10px;color:#a8e6c1}
h3{font-size:12px;color:#7fae94;margin:12px 0 8px;text-transform:uppercase;letter-spacing:1px}
h4{font-size:11px;color:#7fae94;margin:8px 0 4px;text-transform:uppercase;letter-spacing:1px}

/* ==================== BUTTONS ==================== */
.btn{background:#1d3227;color:#c8f0d8;border:1px solid #2f5442;
  padding:8px 14px;border-radius:9px;cursor:pointer;font-size:12px;
  font-weight:600;font-family:inherit;transition:.15s}
.btn:hover{background:#26432f}
.btn.primary{background:linear-gradient(100deg,#2ecc71,#20a35a);color:#04160c;border:none}
.btn.primary:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:5px 10px;font-size:11px}
.btn.danger{background:#3a1d20;border-color:#e63946;color:#ff8f96}
.btn.gold{background:linear-gradient(100deg,#ffd700,#ffaa00);color:#1a1400;border:none;font-weight:800}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ==================== TABS ==================== */
.tabs{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.tab{padding:7px 12px;border-radius:8px;background:#131e19;border:1px solid #24382e;
  cursor:pointer;font-size:12px;font-weight:600;color:#8bb59f;white-space:nowrap}
.tab.active{background:#2ecc71;color:#04160c;border-color:#2ecc71}
.subtabs{display:flex;gap:4px;margin-bottom:10px;overflow-x:auto;
  padding-bottom:2px;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtab{padding:7px 12px;border-radius:8px;background:#131e19;
  border:1px solid #24382e;cursor:pointer;font-size:12px;
  font-weight:600;color:#8bb59f;white-space:nowrap;flex-shrink:0;font-family:inherit}
.subtab.active{background:#2ecc71;color:#04160c;border-color:#2ecc71}

/* ==================== BOTTOM NAV ==================== */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;
  background:linear-gradient(0deg,#0d1a14,#131e19);
  border-top:1px solid #24382e;display:flex;justify-content:space-around;
  padding:6px 4px;z-index:60;
  padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.bnav-btn{flex:1;background:none;border:none;color:#7fae94;
  font-size:10px;font-weight:600;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 4px;cursor:pointer;border-radius:10px;transition:.15s}
.bnav-btn .ic{font-size:22px;line-height:1}
.bnav-btn.active{color:#2ecc71;background:rgba(46,204,113,.10)}
.bnav-btn:active{transform:scale(0.95)}

/* ==================== TEAM CARD ==================== */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.team-card{background:#16241d;border:1px solid #27402f;border-radius:10px;
  padding:10px;cursor:pointer;transition:.18s;position:relative;overflow:hidden}
.team-card:hover{transform:translateY(-2px);border-color:#3f7a5a}
.team-card .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
.team-card .nm{font-weight:700;font-size:13px;margin-left:6px}
.team-card .mt{font-size:10px;color:#8bb59f;margin-left:6px;margin-top:4px}
.div-label{display:inline-block;padding:2px 7px;border-radius:5px;font-size:9px;
  font-weight:800;margin-left:6px;letter-spacing:.5px}
.div-1{background:#e9c46a;color:#1a1400}
.div-2{background:#457b9d;color:#fff}

/* ==================== PLAYER CARD ==================== */
.plist{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media(max-width:600px){.plist{grid-template-columns:1fr}}
.pcard{display:flex;align-items:center;gap:8px;padding:7px 10px;
  background:#182720;border:1px solid #24382e;border-radius:9px;
  cursor:pointer;transition:.13s;font-size:12px}
.pcard:hover{border-color:#3f7a5a;background:#1d3026}
.pcard.sel{border-color:#2ecc71;background:#1b3a28;box-shadow:0 0 0 2px rgba(46,204,113,.25)}
.pos{width:34px;text-align:center;font-size:9px;font-weight:800;padding:3px 0;
  border-radius:5px;letter-spacing:.5px;display:inline-block}
.pos.GK{background:#5e60ce;color:#fff}
.pos.DEF{background:#2a9d8f;color:#04160c}
.pos.MID{background:#e9c46a;color:#241c00}
.pos.FWD{background:#e63946;color:#fff}
.pos-mini{display:inline-block;font-size:8px;font-weight:800;padding:1px 5px;
  border-radius:4px;margin-right:2px;letter-spacing:.3px}
.pname{flex:1;font-weight:600}
.pmeta{font-size:10px;color:#7fae94}
.rate{font-weight:800;font-size:13px;color:#a8e6c1;min-width:22px;text-align:right}
.special-icon{display:inline-block;font-size:14px;margin-left:4px;cursor:pointer;
  filter:drop-shadow(0 0 3px #ffd700)}
.avatar{width:28px;height:28px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-size:11px;font-weight:800;
  color:#fff;flex-shrink:0;text-shadow:0 1px 2px rgba(0,0,0,.5)}

/* ==================== TABLES ==================== */
table{width:100%;border-collapse:collapse;font-size:11px}
th{text-align:left;padding:6px 4px;color:#7fae94;font-size:9px;
  text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #24382e}
td{padding:6px 4px;border-bottom:1px solid #1b2a22}
tr.mine td{background:rgba(46,204,113,.12);font-weight:700}
tr.mine td:first-child{border-left:3px solid #2ecc71}
tr.rel td{background:rgba(230,57,70,.10)}
tr.rel td:first-child{border-left:3px solid #e63946}
tr.pro td{background:rgba(46,204,113,.08)}
tr.pro td:first-child{border-left:3px solid #2ecc71}
.num{text-align:center}
.scroll-box{max-height:440px;overflow-y:auto}
.scroll-box::-webkit-scrollbar{width:5px}
.scroll-box::-webkit-scrollbar-thumb{background:#2f5442;border-radius:3px}

/* ==================== SCOREBOARD ==================== */
.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  gap:10px;padding:16px;background:linear-gradient(100deg,#132018,#0d1a14);
  border-radius:14px;border:1px solid #24382e;margin-bottom:12px}
.sb-team{text-align:center;font-weight:700;font-size:13px}
.sb-badge{width:38px;height:38px;border-radius:50%;margin:0 auto 6px;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900}
.score{font-size:30px;font-weight:900;letter-spacing:2px;color:#fff;
  transition:.2s;text-align:center}
.score.pulse{color:#2ecc71;transform:scale(1.12)}

/* ==================== EVENTS ==================== */
.events{max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:5px}
.event{padding:7px 10px;border-radius:8px;font-size:11px;
  background:#16241d;border-left:3px solid #2f5442;animation:slide .3s ease}
.event.goal{background:#1d3a27;border-left-color:#2ecc71;font-weight:700}
.event.card{background:#332c14;border-left-color:#e9c46a}
.event.commentary{background:#0f1a15;border-left-color:#3a5a4a;
  color:#a8bfb4;font-style:italic;font-size:10px}
@keyframes slide{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}

/* ==================== PITCH ==================== */
.pitch-wrap{background:#0d1a14;padding:8px;border-radius:14px;
  border:1px solid #24382e;margin-bottom:12px}
.pitch{width:100%;display:block;border-radius:8px;background:#2d6b3a}
.pitch .pp{transition:transform .45s ease}
.pitch .ball{transition:transform .45s ease}

/* ==================== STAMINA ==================== */
.stamina-bar{width:36px;height:5px;background:#2c3a33;border-radius:3px;
  overflow:hidden;display:inline-block;margin-left:4px;vertical-align:middle}
.stamina-fill{height:100%;background:#2ecc71;transition:.3s}
.stamina-fill.mid{background:#e9c46a}
.stamina-fill.low{background:#e63946}
.inj-badge{background:#e63946;color:#fff;font-size:9px;font-weight:800;
  padding:2px 5px;border-radius:4px;margin-left:4px}

/* ==================== BRACKET ==================== */
.bracket{display:flex;gap:8px;overflow-x:auto;padding:8px 0}
.bracket-col{min-width:150px;display:flex;flex-direction:column;justify-content:space-around;gap:8px}
.bracket-match{background:#182720;border:1px solid #2f5442;border-radius:8px;padding:6px 8px;font-size:11px}
.bracket-match.mine{border-color:#2ecc71;background:#1b3a28}
.bracket-match .win{color:#a8e6c1;font-weight:700}
.bracket-match .lose{color:#7fae94;opacity:.6}

/* ==================== NEWS ==================== */
.news-item{background:#16241d;border-left:3px solid #457b9d;border-radius:8px;
  padding:8px 10px;margin-bottom:6px;font-size:12px}
.news-item .head{color:#a8e6c1;font-weight:700;margin-bottom:2px;font-size:11px}
.news-item .time{font-size:9px;color:#7fae94;text-transform:uppercase;letter-spacing:1px}

/* ==================== PRESS CONFERENCE ==================== */
.pc-answer{display:block;width:100%;text-align:left;padding:10px;margin-bottom:6px;
  background:#182720;border:1px solid #2f5442;border-radius:8px;color:#e8f0ec;
  font-size:12px;cursor:pointer;font-family:inherit}
.pc-answer:hover{background:#1d3026;border-color:#2ecc71}

/* ==================== TOAST & EMPTY ==================== */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:#e63946;color:#fff;padding:10px 18px;border-radius:10px;
  font-size:12px;font-weight:600;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.5);
  max-width:88vw;text-align:center;animation:toastIn .3s ease}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
.empty{color:#5f7d6c;font-size:12px;padding:14px;text-align:center}
.badge-round{display:inline-block;background:#1d3227;color:#8fbfa4;
  padding:3px 9px;border-radius:16px;font-size:11px;font-weight:600}

/* ==================== DEV PANEL ==================== */
#devPanel{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9000;
  display:flex;align-items:center;justify-content:center;padding:14px}
#devPanel .inner{background:#0f1a15;border:2px solid #ffd700;border-radius:14px;
  padding:16px;max-width:420px;width:100%;max-height:88vh;overflow-y:auto;
  box-shadow:0 0 40px rgba(255,215,0,.3)}
#devPanel h2{color:#ffd700;text-align:center;margin-bottom:4px;font-size:16px}
#devPanel .sub{text-align:center;color:#8bb59f;font-size:11px;margin-bottom:14px}
#devPanel .btn{width:100%;margin-bottom:6px;text-align:left}
#devPanel .sect{color:#7fae94;font-size:10px;text-transform:uppercase;
  letter-spacing:1px;margin:12px 0 6px}
#devBadge{position:fixed;top:8px;right:8px;background:#ffd700;color:#1a1400;
  font-size:10px;font-weight:900;padding:3px 8px;border-radius:6px;z-index:150;
  letter-spacing:1px;animation:devPulse 1.5s infinite}
@keyframes devPulse{0%,100%{opacity:1}50%{opacity:.55}}

/* ==================== CREATE MODAL ==================== */
#createModal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9100;
  display:flex;align-items:flex-end;justify-content:center;padding:0;
  animation:modalBg .25s ease}
@keyframes modalBg{from{background:rgba(0,0,0,0)}to{background:rgba(0,0,0,.85)}}
#createModal .inner{background:#0f1a15;border:2px solid #2ecc71;
  border-radius:20px 20px 0 0;
  padding:20px 16px 24px;max-width:460px;width:100%;max-height:90vh;overflow-y:auto;
  animation:modalUp .35s cubic-bezier(.2,.9,.3,1);
  padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
@keyframes modalUp{from{transform:translateY(100%);opacity:.5}to{transform:translateY(0);opacity:1}}
#createModal .inner::before{content:'';display:block;width:40px;height:4px;
  background:#2f5442;border-radius:2px;margin:0 auto 12px}
#createModal h2{color:#a8e6c1;text-align:center;margin-bottom:4px;font-size:16px}
#createModal .sub{text-align:center;color:#8bb59f;font-size:11px;margin-bottom:14px}
#createModal label{display:block;font-size:11px;color:#7fae94;
  text-transform:uppercase;letter-spacing:1px;margin:10px 0 4px}
#createModal input,#createModal select{width:100%;padding:9px 10px;
  background:#182720;border:1px solid #2f5442;border-radius:8px;
  color:#e8f0ec;font-size:13px;font-family:inherit}
#createModal input:focus,#createModal select:focus{outline:none;border-color:#2ecc71}
#createModal .cost{background:#16241d;padding:8px 10px;border-radius:8px;
  font-size:12px;color:#a8e6c1;margin-top:10px;text-align:center}
#createModal .row{margin-top:14px}
#createModal .row .btn{flex:1}

/* ==================== SETTINGS ==================== */
.settings-card{background:#131e19;border:1px solid #24382e;border-radius:14px;
  padding:16px;margin-bottom:12px}
.settings-row{display:flex;justify-content:space-between;align-items:center;
  padding:12px 0;border-bottom:1px solid #1b2a22;font-size:13px}
.settings-row:last-child{border-bottom:none}

/* ==================== PORTAL RAHASIA ==================== */
#portalInput{width:100%;padding:14px;background:#0a120e;color:#2ecc71;
  border:2px solid #2f5442;border-radius:10px;font-size:16px;font-weight:800;
  text-align:center;letter-spacing:4px;font-family:monospace;text-transform:uppercase}
#portalInput:focus{outline:none;border-color:#2ecc71;box-shadow:0 0 20px rgba(46,204,113,.3)}
.portal-flash{position:fixed;inset:0;background:#000;z-index:99999;
  display:flex;align-items:center;justify-content:center;
  animation:portalFlash 2.5s ease-out forwards;pointer-events:none}
@keyframes portalFlash{
  0%{opacity:0}
  10%{opacity:1;background:#000}
  20%{background:#0f3a1e}
  40%{background:#000}
  60%{background:#1a2818}
  100%{opacity:0;background:#000}
}
.portal-msg{color:#2ecc71;font-size:26px;font-weight:900;letter-spacing:6px;
  text-align:center;text-shadow:0 0 30px #2ecc71,0 0 60px #2ecc71;
  animation:portalMsg 2.5s ease-out forwards;font-family:monospace}
@keyframes portalMsg{
  0%{opacity:0;transform:scale(0.5)}
  30%{opacity:1;transform:scale(1.1)}
  70%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(1.3)}
}
.portal-hint{font-size:10px;color:#5f7d6c;text-align:center;margin-top:8px;letter-spacing:2px}

/* ==================== GOD MODE & CRISIS BADGE ==================== */
#godBadge{position:fixed;top:8px;left:8px;background:linear-gradient(135deg,#ffd700,#ffaa00);
  color:#1a1400;font-size:10px;font-weight:900;padding:4px 10px;border-radius:8px;
  z-index:150;letter-spacing:2px;animation:godPulse 1.2s infinite alternate;
  box-shadow:0 0 20px rgba(255,215,0,0.6)}
@keyframes godPulse{
  0%{transform:scale(1);filter:brightness(1)}
  100%{transform:scale(1.08);filter:brightness(1.4)}
}
#crisisBadge{position:fixed;top:8px;left:130px;background:#e63946;color:#fff;
  font-size:10px;font-weight:900;padding:4px 10px;border-radius:8px;
  z-index:150;letter-spacing:2px;animation:crisisPulse 0.8s infinite alternate;
  box-shadow:0 0 15px rgba(230,57,70,0.8)}
@keyframes crisisPulse{
  0%{opacity:1;box-shadow:0 0 15px rgba(230,57,70,0.8)}
  100%{opacity:0.7;box-shadow:0 0 30px rgba(230,57,70,1)}
}

/* ==================== ERROR BOX ==================== */
#errBox{position:fixed;top:0;left:0;right:0;background:#e63946;color:#fff;
  padding:10px;font-size:11px;z-index:99999;font-family:monospace;
  white-space:pre-wrap;max-height:40vh;overflow:auto;cursor:pointer}

/* ==================== FORM PITCH EDITOR ==================== */
.form-pitch-wrap{background:#0d1a14;padding:10px;border-radius:14px;
  border:1px solid #24382e;margin-bottom:12px;position:relative}
.form-pitch{width:100%;display:block;border-radius:8px;background:#2d6b3a;touch-action:manipulation}
.form-slot{cursor:pointer;transition:.2s}
.form-slot circle{transition:.2s}
.form-slot:hover circle{filter:brightness(1.3)}
.form-slot.sel circle{stroke:#ffd700;stroke-width:0.7;filter:drop-shadow(0 0 6px #ffd700)}
.form-slot.sel text{fill:#ffd700}
.form-slot .slot-bg{stroke:#fff;stroke-width:0.25}
.form-slot.empty .slot-bg{fill:#1a1a1a;stroke:#666;stroke-dasharray:1,0.5}
.form-info{background:#16241d;padding:10px;border-radius:10px;font-size:11px;
  color:#8bb59f;margin-bottom:10px;text-align:center}
.form-info b{color:#a8e6c1}
.form-info.sel{background:#1b3a28;color:#e8f0ec;border:1px solid #2ecc71}

/* ==================== LIGHT THEME ==================== */
body.light{background:radial-gradient(circle at 20% 0%,#e8f5ee 0%,#d5e8dc 60%);color:#1a2e22}
body.light header{background:linear-gradient(100deg,#fff,#f0f7f3);border-color:#a8d4bc}
body.light .card{background:#fff;border-color:#c8e0d2}
body.light .btn{background:#d6ecdc;color:#0a3a1f;border-color:#7fbf96}
body.light .btn.primary{background:linear-gradient(100deg,#2ecc71,#20a35a);color:#04160c}
body.light .tab,body.light .subtab{background:#e0efe5;color:#3a6b4a;border-color:#a8d4bc}
body.light .tab.active,body.light .subtab.active{background:#2ecc71;color:#04160c}
body.light h2{color:#1a6b3a}
body.light td{border-color:#d6e8dc}
body.light th{color:#5a8a6a}
body.light .pcard,body.light .team-card{background:#f0f7f3;border-color:#c8e0d2}
body.light .event{background:#e8f0eb;color:#1a2e22}
body.light #hdr-sub{color:#5a8a6a}
body.light .scoreboard{background:linear-gradient(100deg,#f0f7f3,#e8f0eb)}
body.light .score{color:#0a3a1f}
body.light .news-item{background:#f0f7f3}
body.light .bracket-match{background:#f0f7f3}
body.light .pc-answer{background:#f0f7f3;color:#1a2e22}
body.light .empty{color:#8ba899}
body.light .bottom-nav{background:linear-gradient(0deg,#d5e8dc,#e0efe5);border-top-color:#a8d4bc}
body.light .bnav-btn{color:#5a8a6a}
body.light .bnav-btn.active{color:#1a6b3a;background:rgba(46,204,113,.15)}
body.light .settings-card{background:#fff;border-color:#c8e0d2}
body.light .settings-row{border-color:#e0efe5}
body.light .form-info{background:#e8f0eb;color:#1a2e22}
body.light .form-info.sel{background:#d6ecdc;color:#0a3a1f}

/* ==================== RESPONSIVE ==================== */
@media(max-width:400px){
  body{padding:8px}
  header{padding:10px}
  header h1{font-size:13px}
  .btn{padding:7px 11px;font-size:11px}
  .tab,.subtab{padding:6px 9px;font-size:11px}
  .score{font-size:24px}
  .plist{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="appTitle">⚽ LIGA INDONESIA</h1>
    <div style="display:flex;gap:6px;align-items:center">
      <button class="btn small" id="soundBtn" onclick="toggleSound()">🔊</button>
      <button class="btn small" id="themeBtn" onclick="toggleTheme()">🌙</button>
      <button class="btn small" id="settingsBtn" onclick="openSettings()" style="display:none">⚙️</button>
      <button class="btn small" id="exitBtn" onclick="exitToMenu()" style="display:none">🚪</button>
      <div id="hdr-sub"></div>
    </div>
  </header>
  <div id="app"></div>
</div>

<script>

/* [PART 2] */
/* ==================== UTIL ==================== */
var rnd=function(a,b){return Math.random()*(b-a)+a;};
var ri=function(a,b){return Math.floor(rnd(a,b+1));};
var pick=function(a){return a[Math.floor(Math.random()*a.length)];};
var avg=function(a){return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:60;};
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}}
function formatIDR(n){
  if(state.godMode && n>0) return '∞';
  var rp=Math.abs(n);
  var sign=n<0?'-':'';
  if(rp>=1e15) return sign+'Rp '+(rp/1e15).toFixed(2)+' P';
  if(rp>=1e12) return sign+'Rp '+(rp/1e12).toFixed(2)+' T';
  if(rp>=1e9)  return sign+'Rp '+(rp/1e9).toFixed(2)+' M';
  if(rp>=1e6)  return sign+'Rp '+(rp/1e6).toFixed(1)+' jt';
  if(rp>=1e3)  return sign+'Rp '+(rp/1e3).toFixed(0)+' rb';
  return sign+'Rp '+Math.round(rp);
}
function formatIDRShort(n){
  var rp=Math.abs(n);
  var sign=n<0?'-':'';
  if(rp>=1e15) return sign+(rp/1e15).toFixed(1)+'P';
  if(rp>=1e12) return sign+(rp/1e12).toFixed(1)+'T';
  if(rp>=1e9)  return sign+(rp/1e9).toFixed(1)+'M';
  if(rp>=1e6)  return sign+(rp/1e6).toFixed(0)+'jt';
  if(rp>=1e3)  return sign+(rp/1e3).toFixed(0)+'rb';
  return sign+Math.round(rp);
}

function nameInitials(name){
  var parts=name.split(' ');
  if(parts.length===1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0]+parts[parts.length-1][0]).toUpperCase();
}
function nameColor(name){

}

/* ==================== STATISTIK INDIVIDU ==================== */
function generateHeight(cat, specificPos){
  var base, spread;
  if(cat==='GK'){ base=190; spread=8; }
  else if(specificPos==='CB'){ base=187; spread=7; }
  else if(specificPos==='CF'||specificPos==='SS'){ base=180; spread=9; }
  else if(specificPos==='RB'||specificPos==='LB'||specificPos==='RWB'||specificPos==='LWB'){ base=175; spread=7; }
  else { base=178; spread=8; }
  var h=Math.round(base+rnd(-spread,spread));
  return Math.max(160,Math.min(205,h));
}
function derivePhysical(height, playStyle){
  var aerial, balance, agility, pace, strength;
  if(height>=190){
    aerial=ri(80,95); balance=ri(60,75); agility=ri(55,70); pace=ri(55,75); strength=ri(80,95);
  } else if(height>=185){
    aerial=ri(72,88); balance=ri(68,82); agility=ri(65,80); pace=ri(65,82); strength=ri(75,90);
  } else if(height>=178){
    aerial=ri(60,78); balance=ri(75,88); agility=ri(75,88); pace=ri(72,88); strength=ri(65,82);
  } else if(height>=170){
    aerial=ri(48,68); balance=ri(82,92); agility=ri(85,95); pace=ri(78,92); strength=ri(55,72);
  } else {
    aerial=ri(38,58); balance=ri(85,95); agility=ri(88,98); pace=ri(85,96); strength=ri(45,62);
  }
  if(playStyle==='Target Man'){ aerial+=ri(5,10); strength+=ri(5,8); }
  if(playStyle==='Pemburu Gol'||playStyle==='Pemburu Peluang'){ pace+=ri(3,8); }
  if(playStyle==='Sayap Cut Inside'){ pace+=ri(3,7); agility+=ri(3,7); }
  if(playStyle==='Pemain Sayap Kreatif'){ agility+=ri(3,7); pace+=ri(2,5); }
  if(playStyle==='Inverted Wing Back'||playStyle==='Bek Sayap Menyerang'){ pace+=ri(3,7); }
  if(playStyle==='Jangkar'||playStyle==='Perusak Serangan'){ strength+=ri(5,10); balance+=ri(3,7); }
  if(playStyle==='Kiper Stoper'){ aerial+=ri(5,10); strength+=ri(5,10); }
  if(playStyle==='Kiper Agresif'){ agility+=ri(5,10); pace+=ri(3,7); }
  return {
    height:height,
    aerial:Math.min(99,aerial),
    balance:Math.min(99,balance),
    agility:Math.min(99,agility),
    pace:Math.min(99,pace),
    strength:Math.min(99,strength)
  };
}
function generateIndividStats(cat, specificPos, rating, playStyle){
  var base=rating;
  var stats={};
  var v=function(){return rnd(-8,8);};
  if(cat==='GK'){
    stats.reflexes=Math.min(99,Math.round(base+v()+5));
    stats.handling=Math.min(99,Math.round(base+v()));
    stats.positioning=Math.min(99,Math.round(base+v()));
    stats.kicking=Math.min(99,Math.round(base+v()-3));
    stats.command=Math.min(99,Math.round(base+v()-5));
    stats.speed=Math.min(99,Math.round(base+v()-15));
    stats.shooting=ri(5,20);
    stats.passing=Math.min(99,Math.round(base+v()-10));
    stats.dribbling=ri(10,25);
    stats.defending=Math.min(99,Math.round(base+v()));
    stats.physical=Math.min(99,Math.round(base+v()));
  } else if(cat==='DEF'){
    stats.defending=Math.min(99,Math.round(base+v()+5));
    stats.physical=Math.min(99,Math.round(base+v()));
    stats.passing=Math.min(99,Math.round(base+v()-3));
    stats.shooting=Math.min(99,Math.round(base+v()-15));
    stats.dribbling=Math.min(99,Math.round(base+v()-10));
    stats.speed=Math.min(99,Math.round(base+v()));
  } else if(cat==='MID'){
    stats.passing=Math.min(99,Math.round(base+v()+5));
    stats.dribbling=Math.min(99,Math.round(base+v()));
    stats.defending=Math.min(99,Math.round(base+v()-5));
    stats.shooting=Math.min(99,Math.round(base+v()-3));
    stats.physical=Math.min(99,Math.round(base+v()));
    stats.speed=Math.min(99,Math.round(base+v()));
  } else {
    stats.shooting=Math.min(99,Math.round(base+v()+5));
    stats.dribbling=Math.min(99,Math.round(base+v()+3));
    stats.passing=Math.min(99,Math.round(base+v()-3));
    stats.defending=Math.min(99,Math.round(base+v()-18));
    stats.physical=Math.min(99,Math.round(base+v()-3));
    stats.speed=Math.min(99,Math.round(base+v()+3));
  }
  return stats;
}
function finishYouthStats(p){
  var phys=derivePhysical(p.height,p.playStyle);
  p.aerial=phys.aerial;p.balance=phys.balance;p.agility=phys.agility;
  p.pace=phys.pace;p.strength=phys.strength;
  p.stats=generateIndividStats(p.pos,p.specificPos,p.rating,p.playStyle);
  return p;
}

  return pick(POSITIONS_SPECIFIC[cat]);

function rollAltPositions(mainPos){
  var cat=catOf(mainPos);
  if(cat==='GK') return [];
  var alts=[];
  if(Math.random()<0.55){
    var pool=POSITIONS_SPECIFIC[cat].filter(function(p){return p!==mainPos;});
    if(pool.length) alts.push(pick(pool));
    if(Math.random()<0.25){
      var pool2=POSITIONS_SPECIFIC[cat].filter(function(p){return p!==mainPos&&alts.indexOf(p)===-1;});
      if(pool2.length) alts.push(pick(pool2));
    }
  }
  return alts;
}

/* ==================== AUTO PICK XI ==================== */
function pickBestForSlot(candidates, team, wantPos){
  var scored=candidates.map(function(p){
    var score=p.rating;
    if(p.specificPos===wantPos) score+=15;
    else if(p.altPos&&p.altPos.indexOf(wantPos)!==-1) score+=8;
    else if(wantPos && catOf(wantPos)===p.pos) score+=3;
    if(p.stamina>=80) score+=5;
    else if(p.stamina>=60) score+=2;
    else if(p.stamina<40) score-=10;
    if(p.injury>0) score-=50;
    if(wantPos==='CB'&&(p.playStyle==='Pembangun Serangan'||p.playStyle==='Perusak Serangan')) score+=2;
    return {p:p,score:score};
  });
  scored.sort(function(a,b){return b.score-a.score;});
  return scored.length?scored[0].p:null;
}
function autoPickXI(team,formation){
  var f=FORMATIONS[formation];
  var xi=[];
  var used={};
  var slots=[];
  slots.push({cat:'GK',pos:'GK'});
  ['DEF','MID','FWD'].forEach(function(cat){
    (f[cat]||[]).forEach(function(pos){slots.push({cat:cat,pos:pos});});
  });
  slots.forEach(function(slot){
    var candidates;
    if(slot.cat==='GK'){
      candidates=team.players.filter(function(p){return p.pos==='GK'&&!used[p.id];});
    } else {
      candidates=team.players.filter(function(p){return p.pos===slot.cat&&!used[p.id];});
    }
    if(!candidates.length){
      candidates=team.players.filter(function(p){return !used[p.id];});
    }
    var best=pickBestForSlot(candidates, team, slot.pos);
    if(best){xi.push(best.id);used[best.id]=true;}
  });
  team.xi=xi;
}
function autoPickXIFit(team,formation){
  var fit=team.players.filter(function(p){return p.injury===0 && p.stamina>=60;});
  if(fit.length<11) return autoPickXI(team,formation);
  var savedPlayers=team.players.slice();
  team.players=fit;
  autoPickXI(team,formation);
  team.players=savedPlayers;
}
function autoPickXIAttack(team,formation){
  team.players.forEach(function(p){
    if(p.stats){
      p._origRating=p.rating;
      if(p.pos==='FWD') p.rating=Math.round(p.rating*0.7+p.stats.shooting*0.3);
      else if(p.pos==='MID') p.rating=Math.round(p.rating*0.7+p.stats.passing*0.3);
      else if(p.pos==='DEF') p.rating=Math.round(p.rating*0.8+p.stats.speed*0.2);
    }
  });
  autoPickXI(team,formation);
  team.players.forEach(function(p){if(p._origRating){p.rating=p._origRating;delete p._origRating;}});
}
function autoPickXIDefense(team,formation){
  team.players.forEach(function(p){
    if(p.stats){
      p._origRating=p.rating;
      if(p.pos==='DEF') p.rating=Math.round(p.rating*0.7+p.stats.defending*0.3);
      else if(p.pos==='MID') p.rating=Math.round(p.rating*0.7+p.stats.defending*0.3);
    }
  });
  autoPickXI(team,formation);
  team.players.forEach(function(p){if(p._origRating){p.rating=p._origRating;delete p._origRating;}});
}
function checkXI(team){
  if(state.freePos) return true;

  team.xi.forEach(function(id){var p=getP(team,id);if(p)c[p.pos]++;});

  return c.GK>=need.GK&&c.DEF>=need.DEF&&c.MID>=need.MID&&c.FWD>=need.FWD;
}

/* ==================== FIXTURES ==================== */
function getDivIndices(div){
  return state.teams.map(function(t,i){return t.div===div?i:-1;}).filter(function(i){return i>=0;});
}
function makeFixtures(teamIndices){
  var ids=teamIndices.slice();
  var n=ids.length;
  var rounds=[];
  for(var r=0;r<n-1;r++){
    var pairs=[];
    for(var i=0;i<n/2;i++) pairs.push([ids[i],ids[n-1-i]]);
    rounds.push(pairs);
    var fixed=ids[0];
    var rest=ids.slice(1);
    rest.unshift(rest.pop());
    ids=[fixed].concat(rest);
  }
  return rounds.map(function(rd){
    return rd.map(function(pa){return {home:pa[0],away:pa[1],played:false,hg:0,ag:0};});
  });
}

/* ==================== HELPERS ==================== */
function getP(team,id){
  if(!team||!team.players) return null;
  for(var i=0;i<team.players.length;i++){if(team.players[i].id===id) return team.players[i];}
  return null;
}
function marketValue(p){
  var ageF=p.age<=23?1.4:p.age<=27?1.2:p.age<=30?0.9:p.age<=33?0.5:0.25;
  return Math.max(3,Math.round((p.rating-40)*(p.rating-40)/30*ageF))*1e9;
}
function weeklyWage(p){return Math.round((p.rating-40)*1.5e6);}
function teamStats(team){
  var xi=team.xi.map(function(id){return getP(team,id);}).filter(Boolean);
  var by={GK:[],DEF:[],MID:[],FWD:[]};
  xi.forEach(function(p){by[p.pos].push(p.rating);});
  var gk=avg(by.GK),def=avg(by.DEF),mid=avg(by.MID),fwd=avg(by.FWD);
  var atk=fwd*.55+mid*.30+def*.15;
  var dfn=gk*.35+def*.45+mid*.20;
  var m=team.tactics.mentality;
  if(m==='menyerang'){atk*=1.10;dfn*=0.92;}
  else if(m==='defensif'){atk*=0.90;dfn*=1.10;}
  if(state.godMode && state.teams[state.myIdx] === team){
    atk *= 2.0;
    dfn *= 2.0;
  }
  return {atk:atk,def:dfn,mid:mid};
}
function pickScorer(team){
  var xi=team.xi.map(function(id){return getP(team,id);}).filter(Boolean);
  if(!xi.length) return null;
  var w={GK:0,DEF:1,MID:3.5,FWD:6};
  var total=0;
  xi.forEach(function(p){
    var weight=w[p.pos]||1;
    if(p.playStyle==='Sayap Cut Inside') weight+=2.5;
    if(p.playStyle==='Pemain Sayap Kreatif') weight+=1.5;
    if(p.playStyle==='Pemburu Gol') weight+=1;
    if(p.playStyle==='Target Man') weight+=0.5;
    total+=weight;
  });
  var r=Math.random()*total;
  for(var i=0;i<xi.length;i++){
    var weight2=w[xi[i].pos]||1;
    if(xi[i].playStyle==='Sayap Cut Inside') weight2+=2.5;
    if(xi[i].playStyle==='Pemain Sayap Kreatif') weight2+=1.5;
    if(xi[i].playStyle==='Pemburu Gol') weight2+=1;
    if(xi[i].playStyle==='Target Man') weight2+=0.5;
    r-=weight2;
    if(r<=0) return xi[i];
  }
  return xi[xi.length-1];
}
function pickAssist(team,scorerId){
  var xi=team.xi.map(function(id){return getP(team,id);}).filter(function(p){return p&&p.id!==scorerId;});
  if(!xi.length) return null;
  var w={GK:0,DEF:1,MID:5,FWD:4};
  var total=0;
  xi.forEach(function(p){
    var weight=w[p.pos]||1;
    if(p.playStyle==='Spesialis Umpan Silang') weight+=4;
    if(p.playStyle==='Pemain Sayap Kreatif') weight+=3;
    if(p.playStyle==='Otak Permainan') weight+=3;
    if(p.playStyle==='Playmaker Kreatif') weight+=3;
    if(p.playStyle==='Pembantu Serangan') weight+=2;
    if(p.playStyle==='Box-To-Box') weight+=1;
    total+=weight;
  });
  var r=Math.random()*total;
  for(var i=0;i<xi.length;i++){
    var weight2=w[xi[i].pos]||1;
    if(xi[i].playStyle==='Spesialis Umpan Silang') weight2+=4;
    if(xi[i].playStyle==='Pemain Sayap Kreatif') weight2+=3;
    if(xi[i].playStyle==='Otak Permainan') weight2+=3;
    if(xi[i].playStyle==='Playmaker Kreatif') weight2+=3;
    if(xi[i].playStyle==='Pembantu Serangan') weight2+=2;
    if(xi[i].playStyle==='Box-To-Box') weight2+=1;
    r-=weight2;
    if(r<=0) return xi[i];
  }
  return xi[0];
}
function pickMVP(team){
  var xi=team.xi.map(function(id){return getP(team,id);}).filter(Boolean);
  if(!xi.length) return null;
  var w=xi.map(function(p){return Math.pow(p.rating,2);});
  var total=w.reduce(function(a,b){return a+b;},0);
  var r=Math.random()*total;
  for(var i=0;i<xi.length;i++){r-=w[i];if(r<=0) return xi[i];}
  return xi[xi.length-1];
}

/* ==================== SIMULASI SEGMEN ==================== */
function simulateSegment(home,away,fromMin,toMin,ctx){
  var wMod=ctx.weather?ctx.weather.goal:1.0;
  var H=ctx.H,A=ctx.A,possH=ctx.possH;
  for(var min=fromMin;min<=toMin;min++){
    // Komentar random
    if(Math.random()<0.22){
      var isHome=Math.random()<possH;
      var t=isHome?home:away;
      var kat=pick(['buildup','buildup','buildup','atmosfer','atmosfer','corner']);
      ctx.events.push({min:min,type:'commentary',text:komentarBaris(t,kat)});
    }
    // Peluang gol
    if(Math.random()<0.50){
      var isH2=Math.random()<possH;
      var hb=ctx.homeBoost||0,ab=ctx.awayBoost||0;
      var atkMul=(isH2?1.06:1)*(1+(isH2?hb:ab));
      var defMul=(isH2?1:1.06)*(1+(isH2?ab:hb)*0.7);
      var atk=(isH2?H.atk:A.atk)*atkMul;
      var dfn=(isH2?A.def:H.def)*defMul;
      var pGoal=0.115*(atk/(atk+dfn))*2*wMod;
      var att2=isH2?home:away;
      var def2=isH2?away:home;
      att2.xi.forEach(function(id){
        var pl=getP(att2,id);
        if(!pl) return;
        if(hasSpecial(pl,'finisher')) pGoal*=1.15;
        if(hasSpecial(pl,'leader')) pGoal*=1.02;
        if(pl.pace) pGoal *= (1 + (pl.pace-60)/500);
      });
      def2.xi.forEach(function(id){
        var pl=getP(def2,id);
        if(!pl||!pl.aerial) return;
        pGoal *= (1 - (pl.aerial-60)/800);
      });
      var att=isH2?home:away,def=isH2?away:home;
      if(Math.random()<pGoal){
        var s=pickScorer(att);
        if(!s) continue;
        if(isH2)ctx.hg++;else ctx.ag++;
        var assistTxt='',assistId=null;
        var maestroOn=att.xi.some(function(id){return hasSpecial(getP(att,id),'maestro');});
        var assistChance=maestroOn?0.90:0.75;
        if(Math.random()<assistChance){
          var a=pickAssist(att,s.id);
          if(a){a.assists++;assistId=a.id;assistTxt=' (assist: '+a.name+')';}
        }
        ctx.events.push({
          min:min,type:'goal',team:isH2?'home':'away',scorerId:s.id,assistId:assistId,
          text:'⚽ GOL! '+s.name+' ('+att.name+')'+assistTxt+' — '+ctx.hg+'-'+ctx.ag
        });
      } else {
        var s2=pickScorer(att);
        if(Math.random()<0.45){
          ctx.events.push({min:min,type:'commentary',text:komentarBaris(def,'save')});
        } else {
          ctx.events.push({min:min,type:'commentary',text:pick(KOMENTAR.shot).replace('{p}',s2?s2.name:'penyerang')});
        }
      }
    }
    // Kartu
    if(Math.random()<0.010){
      var isH3=Math.random()<0.5;
      var t3=isH3?home:away;
      var players=t3.xi.map(function(id){return getP(t3,id);}).filter(Boolean);
      if(!players.length) continue;
      var p3=pick(players);
      var isRed=Math.random()<0.08;
      if(isRed) p3.red++; else p3.yellow++;
      ctx.events.push({
        min:min,type:'card',team:isH3?'home':'away',
        text:isRed?'🟥 KARTU MERAH! '+p3.name+' ('+t3.name+')':'🟨 Kuning untuk '+p3.name+' ('+t3.name+')'
      });
    }
  }
}

/* ==================== HITUNG RATING PEMAIN ==================== */
function computeMatchRatings(team,gf,ga,events,mvp){
  team.xi.forEach(function(id){
    var p=getP(team,id);
    if(!p) return;
    var r=6.0;
    events.forEach(function(e){
      if(e.type==='goal'&&e.scorerId===id) r+=1.5;
      if(e.type==='goal'&&e.assistId===id) r+=1.0;
    });
    if(p.pos==='GK'&&ga===0) r+=1.5;
    if(p.pos==='DEF'&&ga===0) r+=0.8;
    if(p.pos==='FWD'&&gf>=3) r+=0.3;
    if(mvp&&mvp.id===id) r+=0.5;
    if(hasSpecial(p,'clutch')&&events.some(function(e){return e.min>45;})) r+=0.5;
    if(hasSpecial(p,'biggame')&&(state.pialaNasional||state.ligaChampions)) r+=0.4;
    r+=rnd(-0.4,0.4);
    r=Math.max(1,Math.min(10,r));
    if(!p.ratings) p.ratings=[];
    p.ratings.push(Math.round(r*10)/10);
    if(p.ratings.length>60) p.ratings=p.ratings.slice(-60);
    p.avgRating=p.ratings.reduce(function(a,b){return a+b;},0)/p.ratings.length;
  });
}

/* ==================== FINALIZE MATCH ==================== */
function finalizeMatch(home,away,ctx){
  // Clean sheet
  var hGK=null,aGK=null;
  home.xi.forEach(function(id){var p=getP(home,id);if(p&&p.pos==='GK') hGK=p;});
  away.xi.forEach(function(id){var p=getP(away,id);if(p&&p.pos==='GK') aGK=p;});
  if(ctx.ag===0&&hGK) hGK.cs++;
  if(ctx.hg===0&&aGK) aGK.cs++;
  // MVP
  var mvp=null;
  if(ctx.hg>ctx.ag) mvp=pickMVP(home);
  else if(ctx.ag>ctx.hg) mvp=pickMVP(away);
  else mvp=pickMVP(Math.random()<0.5?home:away);
  if(mvp) mvp.mvp++;
  // Gol stat
  ctx.events.forEach(function(e){
    if(e.type==='goal'){
      var t=e.team==='home'?home:away;
      var p=getP(t,e.scorerId);
      if(p){p.seasonGoals++;p.careerGoals++;}
    }
  });
  // Apps, stamina, cedera
  [home,away].forEach(function(t){
    var isMyTeam=(state.teams[state.myIdx] === t);
    t.xi.forEach(function(id){
      var p=getP(t,id);
      if(!p) return;
      p.apps++;
      p.stamina=Math.max(0,p.stamina-STAMINA_COST+ri(-4,4));
      if(p.injury>0) return;
      var injChance=(state.godMode&&isMyTeam)?0:0.10;
      if(p.stamina<25) injChance+=0.10;
      if(hasSpecial(p,'ironman')) injChance*=0.5;
      if(p.balance<60) injChance+=0.03;
      if(Math.random()<injChance){
        var roll=Math.random();
        var severity;
        if(roll<0.005) severity='acl';
        else if(roll<0.025) severity='patah';
        else if(roll<0.10) severity='sedang';
        else severity='ringan';
        var inj=injuryDurationWeeks(severity);
        p.injury=inj.weeks;
        p.injuryName=inj.name;
        p.injurySeverity=inj.severity;
        p.stamina=Math.min(p.stamina,40);
        if(inj.severity==='acl'){
          state.news.unshift({t:'🚨 '+p.name+' alami '+inj.name+'! Absen '+injuryLabel(inj.weeks),time:'Musim '+state.season});
        }
      }
    });
  });
  // Rating
  computeMatchRatings(home,ctx.hg,ctx.ag,ctx.events,ctx.hg>ctx.ag?mvp:null);
  computeMatchRatings(away,ctx.ag,ctx.hg,ctx.events,ctx.ag>ctx.hg?mvp:null);
}

/* ==================== PLAY ROUND ==================== */
function playRound(){
  try{
    // Pulihkan non-XI
    state.teams.forEach(function(t){
      t.players.forEach(function(p){
        if(t.xi.indexOf(p.id)===-1) p.stamina=Math.min(100,p.stamina+STAMINA_RECOVER);
        if(p.injury>0){
          p.injury=Math.max(0,p.injury-1);
          if(p.injury===0){
            p.injuryName='';p.injurySeverity='';
            if(t===state.teams[state.myIdx]){
              state.news.unshift({t:'✅ '+p.name+' sembuh dari cedera!',time:'Musim '+state.season});
            }
          }
        }
      });
    });
    // Press conference
    if(!state.pcAnswered && Math.random()<0.35){
      state.pcAnswered=true;
      openPressConference();
      return;
    }
    if(state.sound){try{sfxWhistle();}catch(e){}}

    var mine=null;
    [1,2].forEach(function(div){
      var round=state.fixtures[div][state.round];
      if(!round) return;
      round.forEach(function(f){
        try{
          var h=state.teams[f.home],a=state.teams[f.away];
          var isUser=(f.home===state.myIdx)||(f.away===state.myIdx);
          var weather=rollWeather();
          if(isUser){
            var H=teamStats(h),A=teamStats(a);
            var ctx={H:H,A:A,possH:H.mid/(H.mid+A.mid),hg:0,ag:0,events:[],weather:weather,homeBoost:0,awayBoost:0};
            simulateSegment(h,a,1,45,ctx);
            if(state.instantWinNext){
              if(f.home===state.myIdx){ctx.hg=Math.max(ctx.hg,3);ctx.ag=0;}
              else{ctx.ag=Math.max(ctx.ag,3);ctx.hg=0;}
            }
            state.lastWeather=weather;
            mine={f:f,h:h,a:a,ctx:ctx,subsLeft:6,finished:false};
          } else {
            var H2=teamStats(h),A2=teamStats(a);
            var ctx2={H:H2,A:A2,possH:H2.mid/(H2.mid+A2.mid),hg:0,ag:0,events:[],weather:weather,homeBoost:0,awayBoost:0};
            simulateSegment(h,a,1,90,ctx2);
            f.hg=ctx2.hg;f.ag=ctx2.ag;f.played=true;
            finalizeMatch(h,a,ctx2);
          }
        }catch(err){
          console.warn('Match error',err);
          if(!f.played){f.hg=0;f.ag=0;f.played=true;}
        }
      });
    });
    pendingMatch=mine;
    if(mine){
      state.view='match';
      state.pcAnswered=false;
      render();
      try{animateHalf(1);}catch(e){console.warn('Anim error',e);finishFullMatch();}
    } else {
      nextRound();
    }
  }catch(err){
    console.warn('playRound error',err);
    if(typeof nextRound==='function'){nextRound();}
    else{state.round++;render();}
  }
}

function applySubRow(btn){

  if(!m) return;
  var row=btn.parentElement;
  var outId=+row.querySelector('.subOut').value;
  var inId=+row.querySelector('.subIn').value;
  if(!outId||!inId){toast('Pilih pemain');return;}
  var myIsHome=m.f.home===state.myIdx;
  var myTeam=myIsHome?m.h:m.a;
  var outP=getP(myTeam,outId),inP=getP(myTeam,inId);
  if(!outP||!inP){toast('Pemain invalid');return;}
  if(inP.injury>0||inP.stamina<30){toast('Pemain tidak fit');return;}

}

function nextRound(){
  try{
    var prevRound=state.round;
    var prevF=null;
    var rw=state.fixtures[state.myDiv][prevRound];
    if(rw) rw.forEach(function(f){if(f.home===state.myIdx) prevF=f;});

    // Pemasukan kandang
    if(prevF&&prevF.played){
      var rev=calcHomeMatchRevenue(state.teams[state.myIdx],state.teams[prevF.away],prevF.hg,prevF.ag);
      state.teams[state.myIdx].budget+=rev.net;
      state.lastAttendance=rev.attendance;
      state.teams[state.myIdx].stadium.revenueHistory.push({
        attendance:rev.attendance,occ:rev.occ,
        ticketRevenue:rev.ticketRevenue,tourRevenue:rev.tourRevenue,tourVisitors:rev.tourVisitors,
        storeRevenue:rev.storeRevenue,storeBuyers:rev.storeBuyers,hotelRevenue:rev.hotelRevenue,hotelNights:rev.hotelNights,
        grossRevenue:rev.grossRevenue,security:rev.security,cleaning:rev.cleaning,opsCost:rev.opsCost,police:rev.police,
        totalCost:rev.totalCost,riot:rev.riot,net:rev.net,week:state.round
      });
      if(state.teams[state.myIdx].stadium.revenueHistory.length>20){
        state.teams[state.myIdx].stadium.revenueHistory=state.teams[state.myIdx].stadium.revenueHistory.slice(-20);
      }
      if(rev.riot){
        state.news.unshift({t:'🔥 Kerusuhan! '+formatIDR(rev.riot.damage),time:'Pekan '+state.round});
        if(state.sound) sfxCard();
      }
    }

    // Update saham
    if(prevF){
      var isHome=prevF.home===state.myIdx;
      updateAllStocks({gf:isHome?prevF.hg:prevF.ag,ga:isHome?prevF.ag:prevF.hg,isHome:isHome});
    } else {
      updateAllStocks(null);
    }

    state.round++;

    // Trigger Piala Nasional (kalau tidak travel ban)
    if([5,9,13,17].indexOf(state.round)!==-1){
      if(!(isCrisisActive() && state.activeCrisis.travelBan)){
        if(!state.pialaNasional) startPialaNasional();
        if(state.pialaNasional&&!state.pialaNasional.finished) playPialaRound();
      }
    }

    // Berita acak
    addRandomNews();

    // Akhir musim?
    if(state.round>=TOTAL_ROUNDS){
      finalizeSeason();
      processPromotionRelegation();
      state.view='seasonEnd';
    } else {
      state.view='main';
      state.mainTab='kompetisi';
      state.subTab='klasemen';
      state.tableDiv=state.myDiv;
    }
    render();
  }catch(err){
    console.warn('nextRound error',err);
    state.round++;
    if(state.round>=TOTAL_ROUNDS){state.view='seasonEnd';}
    render();
  }
}

/* ==================== UPDATE SAHAM ==================== */
function updateAllStocks(userMatchResult){
  state.teams.forEach(function(t){
    if(t.listed){
      var isUser=state.teams.indexOf(t)===state.myIdx;
      updateStockPrice(t,isUser?userMatchResult:null);
    }
  });
}
function updateStockPrice(team,matchResult){
  if(!team.listed) return;
  var s=team.shares;
  var change=0;
  if(matchResult){
    if(matchResult.gf>matchResult.ga) change+=matchResult.isHome?0.04:0.06;
    else if(matchResult.gf===matchResult.ga) change+=0.005;
    else change-=matchResult.isHome?0.03:0.02;
  }
  var t=getTable(team.div);
  var idx=state.teams.indexOf(team);
  var pos=-1;
  for(var i=0;i<t.length;i++){if(t[i].idx===idx){pos=i+1;break;}}
  if(pos===1) change+=0.03;
  else if(pos<=4) change+=0.015;
  else if(pos>=17) change-=0.03;
  change+=(state.fanMood-50)*0.0008;
  change+=rnd(-0.03,0.03);
  if(isCrisisActive()){
    change+=rnd(-0.15,0.08);
  }
  change=Math.max(-0.15,Math.min(0.15,change));
  var newPrice=Math.max(1000,Math.round(s.price*(1+change)/100)*100);
  s.price=newPrice;
  if(newPrice>s.high) s.high=newPrice;
  if(newPrice<s.low||s.low===0) s.low=newPrice;
  s.history.push({season:state.season,week:state.round,price:newPrice});
  if(s.history.length>200) s.history=s.history.slice(-200);
}
function crashAllStocks(){
  var c=state.activeCrisis;
  var sev=c?c.severity:'high';
  var dropMin,dropMax,floorPrice;
  if(sev==='apocalypse'){dropMin=0.90;dropMax=0.99;floorPrice=100;}
  else if(sev==='chaos'){dropMin=0.75;dropMax=0.92;floorPrice=200;}
  else if(sev==='high'){dropMin=0.55;dropMax=0.80;floorPrice=500;}
  else {dropMin=0.30;dropMax=0.55;floorPrice=1000;}
  state.teams.forEach(function(t){
    if(!t.listed) return;
    var drop=1-rnd(dropMin,dropMax);
    var newPrice=Math.max(floorPrice,Math.round(t.shares.price*drop/100)*100);
    t.shares.price=newPrice;
    if(newPrice<t.shares.low || t.shares.low===0) t.shares.low=newPrice;
    t.shares.history.push({season:state.season,week:state.round,price:newPrice,crash:true});
  });
}
function reboundAllStocks(){
  var c=state.activeCrisis;
  if(!c) return;
  var sev=c.severity;
  state.lastCrisisInfo={
    name:c.name,severity:sev,
    startSeason:c.startSeason,endSeason:c.endSeason
  };
  var duration=(c.endSeason-c.startSeason)+1;
  var baseMult;
  if(sev==='apocalypse')  baseMult=rnd(80, 200);
  else if(sev==='chaos')  baseMult=rnd(25, 80);
  else if(sev==='high')   baseMult=rnd(6, 20);
  else                    baseMult=rnd(2, 6);
  var durationBonus=1 + (duration-1)*0.4;
  var finalMult = baseMult * durationBonus;
  var jackpot = Math.random()<0.10;
  if(jackpot) finalMult *= rnd(1.5, 3);
  state.lastReboundInfo={
    multiplier:finalMult,jackpot:jackpot,
    crisisName:c.name,duration:duration,severity:sev
  };
  state.teams.forEach(function(t){
    if(!t.listed) return;
    var newPrice=Math.round(t.shares.price*finalMult/100)*100;
    if(newPrice<1000) newPrice=1000;
    t.shares.price=newPrice;
    if(newPrice>t.shares.high) t.shares.high=newPrice;
    t.shares.history.push({season:state.season,week:state.round,price:newPrice,rebound:true});
  });
}

/* ==================== TABEL ==================== */
function getTable(div){
  var idxs=getDivIndices(div);
  var t=idxs.map(function(i){return {team:state.teams[i],idx:i,P:0,W:0,D:0,L:0,GF:0,GA:0,Pts:0,form:[]};});
  var map={};t.forEach(function(r){map[r.idx]=r;});
  state.fixtures[div].forEach(function(rd){
    rd.forEach(function(f){
      if(!f.played) return;
      var h=map[f.home],a=map[f.away];
      if(!h||!a) return;
      h.P++;a.P++;h.GF+=f.hg;h.GA+=f.ag;a.GF+=f.ag;a.GA+=f.hg;
      if(f.hg>f.ag){h.W++;a.L++;h.Pts+=3;h.form.push('W');a.form.push('L');}
      else if(f.hg<f.ag){a.W++;h.L++;a.Pts+=3;a.form.push('W');h.form.push('L');}
      else{h.D++;a.D++;h.Pts++;a.Pts++;h.form.push('D');a.form.push('D');}
    });
  });
  t.sort(function(x,y){return y.Pts-x.Pts||(y.GF-y.GA)-(x.GF-x.GA)||y.GF-x.GF;});
  return t;
}

function goatScore(name){

/* ==================== STADION & EKONOMI ==================== */
function calculateAttendance(team){
  var st=team.stadium;
  var occ=0.65+Math.random()*0.15;
  var mood=state.fanMood||50;
  occ+=(mood-50)/100*0.5;
  var trophyBoost=Math.min(0.15,(state.trophyRoom?state.trophyRoom.length:0)*0.01);
  occ+=trophyBoost;
  var t1=getTable(team.div);
  var myIdxInDiv=state.teams.indexOf(team);
  var pos=-1;
  for(var i=0;i<t1.length;i++){if(t1[i].idx===myIdxInDiv){pos=i+1;break;}}
  if(pos===1) occ+=0.15;
  else if(pos<=4) occ+=0.08;
  else if(pos>=18) occ-=0.10;
  if(team.div===1) occ+=0.03;
  if(state.lastWeather&&state.lastWeather.name==='Hujan') occ-=0.05;
  if(state.lastWeather&&state.lastWeather.name==='Berkabut') occ-=0.03;
  if(isCrisisActive()){
    occ=occ*state.activeCrisis.attendanceMult;
  }
  occ=Math.max(0,Math.min(0.9999,occ));
  return {occ:occ,attendance:Math.round(st.cap*occ)};
}
function operationalCost(st){
  var total=st.cap*100000*(1+st.level*0.5);
  return {security:Math.round(total*0.40),cleaning:Math.round(total*0.15),
    ops:Math.round(total*0.30),police:Math.round(total*0.15),total:Math.round(total)};
}
function checkRiot(myScore,oppScore){
  var p=0.02;
  if(myScore<oppScore) p+=(oppScore-myScore)*0.015;
  if((state.fanMood||50)<30) p+=0.05;
  if(myScore===0&&oppScore>=5) p+=0.10;
  return Math.random()<p;
}
function calcRiotDamage(st){
  var base=st.cap*200000*(1+st.level*0.3);
  return Math.round(base*rnd(0.5,2.0));
}
function calcHomeMatchRevenue(team,opp,myScore,oppScore){
  var st=team.stadium;
  var ar=calculateAttendance(team);
  var occ=ar.occ,attendance=ar.attendance;
  var ticketRevenue=attendance*st.ticketPrice;
  var tourVisitors=Math.round(ri(40,120)*(1+st.level*0.3)*(0.5+occ));
  var tourRevenue=tourVisitors*st.tourPrice*3;
  var storeBuyers=Math.round(ri(300,900)*(1+st.level*0.4)*(0.5+occ));
  var storeRevenue=storeBuyers*st.storeAvg;
  var hotelNights=Math.round(st.hotelRooms*0.7*2*(0.6+occ*0.4));
  var hotelRevenue=hotelNights*st.hotelRate;
  var gross=ticketRevenue+tourRevenue+storeRevenue+hotelRevenue;
  var costs=operationalCost(st);
  var riot=null;
  if(myScore<oppScore&&checkRiot(myScore,oppScore)){
    var dmg=calcRiotDamage(st);
    riot={damage:dmg};
    state.fanMood=Math.max(0,(state.fanMood||50)-15);
  }
  if(!riot){
    if(myScore>oppScore) state.fanMood=Math.min(100,(state.fanMood||50)+2+(myScore-oppScore));
    else if(myScore<oppScore) state.fanMood=Math.max(0,(state.fanMood||50)-(2+(oppScore-myScore)*2));
    else state.fanMood=Math.max(0,(state.fanMood||50)-1);
  }
  var net=gross-costs.total-(riot?riot.damage:0);
  return {
    attendance:attendance,occ:occ,ticketRevenue:ticketRevenue,tourRevenue:tourRevenue,tourVisitors:tourVisitors,
    storeRevenue:storeRevenue,storeBuyers:storeBuyers,hotelRevenue:hotelRevenue,hotelNights:hotelNights,
    grossRevenue:gross,security:costs.security,cleaning:costs.cleaning,opsCost:costs.ops,police:costs.police,
    totalCost:costs.total,riot:riot,net:net
  };
}

/* ==================== FINALIZE SEASON ==================== */
function finalizeSeason(){
  // 1. Liga Champions Asia (kalau tidak travel ban)
  if(isCrisisActive() && state.activeCrisis.travelBan){
    state.ligaChampions=null;
    state.currentLCWinner=null;
    state.news.unshift({t:'🚫 Liga Champions Asia DIBATALKAN karena '+state.activeCrisis.name,time:'Musim '+state.season});
  } else {
    startLigaChampions();
    if(state.ligaChampions){
      var g2=0;
      while(!state.ligaChampions.finished&&g2++<5) playLigaChampionsRound();
    }
  }

  // 2. Akumulasi statistik
  accumulateSeason();

  // 3. Ruang trofi user
  var seasonNum=state.season;
  var t1=getTable(1),t2=getTable(2);
  var myT=state.teams[state.myIdx];
  if(t1[0]&&t1[0].idx===state.myIdx&&myT.div===1) state.trophyRoom.push({type:'Juara Divisi 1',season:seasonNum});
  if(t2[0]&&t2[0].idx===state.myIdx&&myT.div===2) state.trophyRoom.push({type:'Juara Divisi 2',season:seasonNum});
  if(state.currentPialaNasWinner&&state.currentPialaNasWinner.idx===state.myIdx) state.trophyRoom.push({type:'Piala Nasional',season:seasonNum});
  if(state.currentLCWinner&&state.currentLCWinner.idx===state.myIdx) state.trophyRoom.push({type:'Liga Champions Asia',season:seasonNum});

  // 4. Bonus sponsor performa
  var myResult=myT.div===1?t1:t2;
  var myRank=-1;
  for(var i=0;i<myResult.length;i++){if(myResult[i].idx===state.myIdx){myRank=i+1;break;}}
  state.sponsors.forEach(function(sp){
    var bonus=0;
    if(myRank===1) bonus+=sp.bonuses.juara_liga||0;
    if(myRank===2) bonus+=sp.bonuses.runner_up||0;
    if(myRank>=3&&myRank<=4) bonus+=sp.bonuses.top4||0;
    if(state.currentPialaNasWinner&&state.currentPialaNasWinner.idx===state.myIdx) bonus+=sp.bonuses.juara_piala||0;
    if(state.currentLCWinner&&state.currentLCWinner.idx===state.myIdx) bonus+=sp.bonuses.juara_lca||0;
    if(isCrisisActive() && state.activeCrisis.budgetImpact<0){
      bonus=Math.round(bonus*(1+state.activeCrisis.budgetImpact));
    }
    if(bonus>0){myT.budget+=bonus;sp.bonusesEarned+=bonus;sp.totalPaid+=bonus;}
  });

  // 5. Bonus pemain performa
  state.teams.forEach(function(t){
    t.players.forEach(function(p){
      var tot=(p.goalBonus||0)*p.seasonGoals+(p.assistBonus||0)*p.assists+(p.csBonus||0)*p.cs+(p.mvpBonus||0)*p.mvp;
      if(tot>0){t.budget-=tot;p.lastSeasonBonus=tot;}
    });
  });

  // 6. Pendapatan pasif dari akuisisi
  state.acquisitions.forEach(function(a){
    var t=state.teams[a.targetIdx];
    if(!t) return;
    var tDiv=t.div===1?getTable(1):getTable(2);
    var pos=-1;
    for(var i=0;i<tDiv.length;i++){if(tDiv[i].idx===a.targetIdx){pos=i+1;break;}}
    var baseIncome=calculateClubValue(t)*0.05*a.stake;
    var posBonus=pos===1?0.5:pos<=3?0.25:pos<=8?0.10:0;
    var total=Math.round(baseIncome*(1+posBonus));
    myT.budget+=total;
    state.news.unshift({t:'💼 Dividen '+t.name+' ('+(a.stake*100).toFixed(0)+'%) — '+formatIDR(total),time:'Musim '+state.season});
  });

  // 7. Akses akademi dari akuisisi >= 10%
  state.acquisitions.forEach(function(a){
    if(a.stake<0.10) return;
    var t=state.teams[a.targetIdx];
    if(!t||!t.academy.length) return;
    var best=t.academy.slice().sort(function(x,y){return y.rating-x.rating;})[0];
    if(best && myT.academy.length<15){
      var clone=JSON.parse(JSON.stringify(best));
      clone.id=PID++;
      myT.academy.push(clone);
      state.news.unshift({t:'🎓 Rekrut dari akademi '+t.name+': '+best.name,time:'Musim '+state.season});
    }
  });

  // 8. Dividen wajib kalau laba besar
  if(myT.listed && myT.budget>500e9){
    var divPerShare=20000;
    var totalCost=myT.shares.total*divPerShare;
    if(myT.budget>totalCost*1.5){
      myT.budget-=totalCost;
      myT.shares.totalDividendPaid+=totalCost;
      myT.shares.dividendPerShare=divPerShare;
      state.news.unshift({t:'💵 '+myT.name+' bagikan dividen '+formatIDR(divPerShare)+'/lembar',time:'Musim '+state.season});
    }
  }

  // 9. Reputasi manajer naik dari market cap
  if(myT.listed){
    var mc=myT.shares.total*myT.shares.price;
    if(mc>2000e9){
      state.managerReputation=Math.min(100,(state.managerReputation||50)+5);
      state.news.unshift({t:'🌟 Reputasi '+state.managerName+' melonjak — market cap '+formatIDR(mc),time:'Musim '+state.season});
    }
    if(myT.shares.price < myT.shares.ipoPrice*0.5){
      state.news.unshift({t:'⚠️ Saham '+myT.name+' jatuh >50% dari IPO!',time:'Musim '+state.season});
      state.fanMood=Math.max(0,(state.fanMood||50)-10);
    }
  }

  // 10. Mood suporter dari posisi
  if(myRank===1){
    state.fanMood=100;
    state.news.unshift({t:'🎉 Suporter euforia! Mood mencapai 100!',time:'Musim '+state.season});
  } else if(myRank<=4){
    state.fanMood=Math.min(100,(state.fanMood||50)+15);
  }
}

/* ==================== PROMOSI / DEGRADASI ==================== */
function processPromotionRelegation(){
  var t1=getTable(1),t2=getTable(2);
  var relegated=t1.slice(-RELEGATED);
  var promoted=t2.slice(0,PROMOTED);
  var reldIdx=relegated.map(function(r){return r.idx;});
  var promIdx=promoted.map(function(r){return r.idx;});
  var myTeam=state.teams[state.myIdx];
  var oldDiv=myTeam.div;
  var myResult=oldDiv===1?t1:t2;
  var myPos=-1;
  for(var i=0;i<myResult.length;i++){if(myResult[i].idx===state.myIdx){myPos=i+1;break;}}

  // Kumpulkan award
  var allPlayers=[];
  state.teams.forEach(function(t){t.players.forEach(function(p){allPlayers.push({p:p,t:t});});});
  var byMvp=allPlayers.slice().sort(function(a,b){return b.p.mvp-a.p.mvp;});
  var byGoals=allPlayers.slice().sort(function(a,b){return b.p.seasonGoals-a.p.seasonGoals;});
  var byAssists=allPlayers.slice().sort(function(a,b){return b.p.assists-a.p.assists;});
  var byRating=allPlayers.slice().sort(function(a,b){return b.p.rating-a.p.rating;});
  var youngPool=allPlayers.filter(function(x){return x.p.age<=21;}).sort(function(a,b){return b.p.rating-a.p.rating;});

  // Best XI
  var posOrder=['GK','DEF','MID','FWD'];
  var bestXI=[];
  posOrder.forEach(function(pos){
    var take=pos==='GK'?1:pos==='DEF'?4:pos==='MID'?3:3;
    var list=allPlayers.filter(function(x){return x.p.pos===pos;}).sort(function(a,b){return b.p.rating-a.p.rating;}).slice(0,take);
    list.forEach(function(x){bestXI.push({name:x.p.name,team:x.t.name,pos:pos,rating:x.p.rating});});
  });

  state.history.push({
    season:state.season,
    div1Champ:{name:t1[0].team.name,pts:t1[0].Pts},
    div2Champ:{name:t2[0].team.name,pts:t2[0].Pts},
    myTeam:myTeam.name,myDiv:oldDiv,myPos:myPos,
    myPts:myResult[myPos-1]?myResult[myPos-1].Pts:0,
    pialaNasWinner:state.currentPialaNasWinner,
    ligaChampWinner:state.currentLCWinner,
    awardMVP:byMvp[0]?{name:byMvp[0].p.name,team:byMvp[0].t.name,val:byMvp[0].p.mvp}:null,
    awardTopScorer:byGoals[0]?{name:byGoals[0].p.name,team:byGoals[0].t.name,val:byGoals[0].p.seasonGoals}:null,
    awardTopAssist:byAssists[0]?{name:byAssists[0].p.name,team:byAssists[0].t.name,val:byAssists[0].p.assists}:null,
    awardGoldenBoy:youngPool[0]?{name:youngPool[0].p.name,team:youngPool[0].t.name,rating:youngPool[0].p.rating}:null,
    awardBestRating:byRating[0]?{name:byRating[0].p.name,team:byRating[0].t.name,rating:byRating[0].p.rating}:null,
    bestXI:bestXI
  });

  // Swap divisi
  reldIdx.forEach(function(i){state.teams[i].div=2;});
  promIdx.forEach(function(i){state.teams[i].div=1;});

  var myChange='stayed';
  if(promIdx.indexOf(state.myIdx)!==-1) myChange='promoted';
  else if(reldIdx.indexOf(state.myIdx)!==-1) myChange='relegated';

  state.lastPR={
    relegated:relegated.map(function(r){return r.team.name;}),
    promoted:promoted.map(function(r){return r.team.name;}),
    myName:myTeam.name,myChange:myChange,myDiv:myTeam.div
  };
  state.myDiv=myTeam.div;
  state.currentPialaNasWinner=null;
  state.currentLCWinner=null;
}

/* ==================== MUSIM BARU ==================== */
function startNewSeason(){
  state.season++;

  // KLB check
  if(!state.activeCrisis && !state.hadCrisis){
    var crisis=pickGlobalEvent();
    if(crisis){
      state.activeCrisis=crisis;
      state.hadCrisis=true;
      state.fanMood=Math.max(0,(state.fanMood||50)+crisis.moodImpact);
      crashAllStocks();
      state.news.unshift({t:'⚠️ '+crisis.name+' MELETUS! '+crisis.desc,time:'Musim '+state.season});
      state.news.unshift({t:'📉 PASAR SAHAM RUNTUH! Harga saham turun 40-90%!',time:'Musim '+state.season});
      state.news.unshift({t:'💡 Momen beli saham murah! Rebound akan datang.',time:'Musim '+state.season});
    }
  } else if(state.activeCrisis) {
    if(state.season>state.activeCrisis.endSeason){
      var pfCost=0;
      Object.keys(state.stockPortfolio).forEach(function(k){
        pfCost+=state.stockPortfolio[k].totalCost;
      });
      reboundAllStocks();
      state.fanMood=Math.min(100,(state.fanMood||50)+20);
      var ri2=state.lastReboundInfo||{multiplier:2,jackpot:false};
      state.news.unshift({t:'🌤️ '+state.activeCrisis.name+' berakhir. Dunia mulai pulih.',time:'Musim '+state.season});
      var multText = ri2.multiplier>=100 ? Math.round(ri2.multiplier)+'×' : ri2.multiplier.toFixed(1)+'×';
      state.news.unshift({t:'🚀 REBOUND EKSPLOSIF! Saham naik '+multText+'!',time:'Musim '+state.season});
      if(ri2.jackpot){
        state.news.unshift({t:'🎰 JACKPOT! Mega rebound terjadi!',time:'Musim '+state.season});
      }
      var pfAfter=getPortfolioValue();
      var profit=pfAfter-pfCost;
      if(profit>0){
        var pct = pfCost>0 ? Math.round((profit/pfCost)*100) : 0;
        var pctText = pct>=10000 ? (pct/100).toFixed(0)+'×' : pct.toLocaleString('id-ID')+'%';
        state.news.unshift({t:'🤑 Portfolio Anda cuan '+formatIDR(profit)+' ('+pctText+')!',time:'Musim '+state.season});
      }
      state.activeCrisis=null;
    } else {
      state.news.unshift({t:'⚠️ '+state.activeCrisis.name+' masih berlanjut',time:'Musim '+state.season});
    }
  }

  state.pialaNasional=null;state.ligaChampions=null;
  state.currentPialaNasWinner=null;state.currentLCWinner=null;
  state.pcAnswered=false;state.training=[];state.lastPR=null;

  // Perkembangan pemain
  state.teams.forEach(function(t){
    var baseR=avg(t.players.map(function(p){return p.rating;}))||60;
    var recycled=[];
    t.players.forEach(function(p){
      p.age++;
      if(p.age>45){recycled.push(makeYouth(baseR,p));return;}
      var talent=p.talent||1.0;
      if(p.age<=21) p.rating+=Math.round(ri(3,6)*talent);
      else if(p.age<=25) p.rating+=Math.round(ri(2,4)*talent);
      else if(p.age<=28) p.rating+=Math.round(ri(0,2)*talent);
      else if(p.age<=31) p.rating+=ri(-1,1);
      else if(p.age<=35) p.rating-=ri(1,3);
      else p.rating-=ri(2,4);
      var cap = p.age<=28 ? (p.potential||95) : 95;
      p.rating=Math.max(38,Math.min(95,cap,p.rating));
      p.seasonGoals=0;p.apps=0;p.assists=0;p.yellow=0;p.red=0;p.cs=0;p.mvp=0;
      p.stamina=100;
      if(p.injury>0){
        p.injury=Math.max(0,p.injury-4);
        if(p.injury===0){p.injuryName='';p.injurySeverity='';}
      }
      p.ratings=[];p.avgRating=0;
      if(p.contractYears>0) p.contractYears--;
      p.weeklyWage=weeklyWage(p);
    });
    t.players=t.players.filter(function(p){return p.age<=45;});
    t.xi=t.xi.filter(function(id){return t.players.some(function(p){return p.id===id;});});
    t.academy.forEach(function(p){
      p.age++;
      var gain=ri(2,5)*(p.talent||1.0);
      p.rating=Math.min(p.potential||85,p.rating+Math.round(gain));
    });
    t.academy=t.academy.filter(function(p){return p.age<=19;});
    t.academy=t.academy.concat(recycled);
    var intake=ri(1,3);
    for(var i=0;i<intake;i++) t.academy.push(makeYouth(baseR));
    if(!checkXI(t)||t.xi.length<11) autoPickXI(t,t.formation);
    t.budget+=(t.div===1?ri(40,90):ri(15,40))*1e9;
  });

  // Pembayaran sponsor bulanan
  var myT=state.teams[state.myIdx];
  if(myT){
    state.sponsors=state.sponsors.filter(function(sp){
      if(sp.endSeason<state.season){
        state.news.unshift({t:'📄 Kontrak sponsor '+sp.sponsorName+' berakhir.',time:'Musim '+state.season});
        return false;
      }
      if(sp.paymentMode==='monthly' && sp.lastPaidSeason<state.season){
        myT.budget+=sp.annual;
        sp.lastPaidSeason=state.season;
        sp.totalPaid+=sp.annual;
      }
      return true;
    });
  }

  state.fanMood=Math.min(100,(state.fanMood||50)+10);
  randomizeAIFormations();
  state.fixtures={1:makeFixtures(getDivIndices(1)),2:makeFixtures(getDivIndices(2))};
  state.round=0;
  state.view='main';
  state.mainTab='beranda';
  state.subTab='squad';
  state.tableDiv=state.myDiv;
  render();
}

/* ==================== SAVE / LOAD ==================== */
var SAVE_SLOTS=[1,2,3];
var SAVE_PREFIX='ligaSave_v1_';
function slotKey(n){return SAVE_PREFIX+n;}
function saveGame(){
  if(!state.activeSlot) return;
  try{
    localStorage.setItem(slotKey(state.activeSlot),JSON.stringify({state:state,PID:PID}));
  }catch(e){console.warn('save failed',e);}
}
var saveTimer=null;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveGame,400);
}
function loadGame(n){
  try{
    var raw=localStorage.getItem(slotKey(n||state.activeSlot));
    if(!raw) return false;
    var data=JSON.parse(raw);
    Object.keys(data.state).forEach(function(k){state[k]=data.state[k];});
    PID=data.PID||0;
    if(state.fixtures) state.fixtures={1:state.fixtures['1']||state.fixtures[1]||[],2:state.fixtures['2']||state.fixtures[2]||[]};
    if(!state.history) state.history=[];
    if(!state.news) state.news=[];
    if(!state.training) state.training=[];
    if(!state.sponsors) state.sponsors=[];
    if(!state.acquisitions) state.acquisitions=[];
    if(!state.allTime) state.allTime={scorers:{},assisters:{},mvp:{},cs:{},apps:{},cards:{}};
    if(!state.trophyRoom) state.trophyRoom=[];
    if(!state.stockPortfolio) state.stockPortfolio={};
    if(!state.stockTransactions) state.stockTransactions=[];
    if(state.myIdx!=null&&state.teams[state.myIdx]) state.myDiv=state.teams[state.myIdx].div;
    // Perbaiki typo di berita lama
    if(state.news){
      state.news.forEach(function(n){if(n.t) n.t=n.t.replace(/MELEUS/g,'MELETUS');});
    }
    return true;
  }catch(e){console.warn('load failed',e);return false;}
}
function deleteSaveSlot(n){
  try{localStorage.removeItem(slotKey(n));}catch(e){}
}
function getSlotInfo(n){
  try{
    var raw=localStorage.getItem(slotKey(n));
    if(!raw) return null;
    var d=JSON.parse(raw);var s=d.state;
    var my=s.teams&&s.myIdx!=null?s.teams[s.myIdx]:null;
    return {team:my?my.name:'?',div:my?my.div:'?',season:s.season,round:s.round,history:(s.history||[]).length};
  }catch(e){return null;}
}
function continueGame(n){
  if(loadGame(n||state.activeSlot)){
    state.view='main';state.mainTab='beranda';state.subTab='squad';state.tableDiv=state.myDiv;
    document.body.classList.toggle('light',state.theme==='light');
    render();
    toast('💾 Dimuat');
  } else toast('Gagal memuat');
}
function deleteSaveAndRefresh(){
  if(!confirm('Hapus slot aktif?')) return;
  deleteSaveSlot(state.activeSlot);
  render();
}
function exitToMenu(){
  if(!confirm('Keluar ke menu utama?\nProgress otomatis tersimpan di slot '+state.activeSlot+'.')) return;
  saveGame();
  state.view='select';
  state.mainTab='beranda';
  state.subTab='squad';
  state.selectedStarter=null;
  state.settingsOpen=false;
  var eb=document.getElementById('errBox');
  if(eb) eb.remove();
  render();
  toast('🏠 Kembali ke menu');
}

/* ==================== TRANSFER ==================== */
function buyPlayer(pid){
  var my=state.teams[state.myIdx];
  var seller=null,p=null;
  for(var i=0;i<state.teams.length;i++){
    var t=state.teams[i];
    if(t===my) continue;
    for(var j=0;j<t.players.length;j++){
      if(t.players[j].id===pid){seller=t;p=t.players[j];break;}
    }
    if(p) break;
  }
  if(!p){toast('Pemain tidak ditemukan');return;}
  var price=marketValue(p);
  if(price>my.budget){toast('Budget tidak cukup');return;}
  my.budget-=price;seller.budget+=price;
  seller.players=seller.players.filter(function(x){return x.id!==pid;});
  seller.xi=seller.xi.filter(function(id){return id!==pid;});
  if(seller.xi.length<11) autoPickXI(seller,seller.formation);
  my.players.push(p);
  if(p.injury>0){
    toast('⚠️ '+p.name+' masih cedera '+injuryLabel(p.injury)+'!');
  } else {
    toast('✅ '+p.name+' -'+formatIDR(price));
  }
  render();
}
function sellPlayer(pid){
  var my=state.teams[state.myIdx];
  var p=getP(my,pid);
  if(!p) return;
  var price=Math.round(marketValue(p)*0.8);
  my.budget+=price;
  my.players=my.players.filter(function(x){return x.id!==pid;});
  my.xi=my.xi.filter(function(id){return id!==pid;});
  if(my.xi.length<11) autoPickXI(my,my.formation);
  toast('💸 +'+formatIDR(price));
  render();
}

function autoXIDefense(){

function pitchSlotClick(idx){
  var my=state.teams[state.myIdx];
  if(state.pitchSel===null){
    state.pitchSel=idx;
    if(state.sound) sfxClick();
    render();
    return;
  }
  if(state.pitchSel===idx){
    state.pitchSel=null;
    if(state.sound) sfxClick();
    render();
    return;
  }
  var i=state.pitchSel,j=idx;
  var aId=my.xi[i],bId=my.xi[j];
  my.xi[i]=bId;
  my.xi[j]=aId;
  state.pitchSel=null;

  if(!valid){

    toast('⚠️ Posisi tidak cocok formasi');
    if(state.sound) sfxCard();
    render();
    return;

  toast('🔄 Posisi ditukar');
  if(state.sound) sfxGoal();
  render();

/* ==================== INTERAKSI SKUAD ==================== */
function setTab(t){state.tab=t;state.selectedStarter=null;render();}
function setMainTab(t){
  state.mainTab=t;
  if(t==='tim') state.subTab='squad';
  else if(t==='bisnis') state.subTab='transfer';
  else if(t==='kompetisi') state.subTab='klasemen';
  state.selectedStarter=null;
  render();
}
function setSubTab(s){
  state.subTab=s;
  state.selectedStarter=null;
  render();
}
function setTableDiv(d){state.tableDiv=d;render();}
function selectStarter(id){
  state.selectedStarter=state.selectedStarter===id?null:id;
  render();
}
function swapWith(benchId){
  if(state.selectedStarter===null){toast('Pilih pemain inti dulu');return;}
  var my=state.teams[state.myIdx];
  var newP=getP(my,benchId);
  if(newP&&newP.injury>0){toast('Cedera '+newP.injury+' pekan');return;}
  var i=my.xi.indexOf(state.selectedStarter);
  var backup=my.xi[i];
  my.xi[i]=benchId;
  if(!checkXI(my)){my.xi[i]=backup;toast('Formasi invalid!');return;}
  state.selectedStarter=null;
  render();
}
function setFormation(f){
  var my=state.teams[state.myIdx];
  my.formation=f;
  autoPickXI(my,f);
  state.selectedStarter=null;
  render();
}
function setMentality(m){state.teams[state.myIdx].tactics.mentality=m;render();}
function toggleTraining(pid){
  state.training=state.training||[];
  var idx=state.training.indexOf(pid);
  if(idx!==-1) state.training.splice(idx,1);
  else if(state.training.length<3) state.training.push(pid);
  else{toast('Maks 3 pemain');return;}
  render();
}
function promoteYouth(pid){
  var my=state.teams[state.myIdx];
  var p=null;
  for(var i=0;i<my.academy.length;i++){if(my.academy[i].id===pid){p=my.academy[i];break;}}
  if(!p) return;
  if(p.age<15){toast('Min 15 tahun');return;}
  if(my.players.length>=25){toast('Tim penuh');return;}
  my.academy=my.academy.filter(function(x){return x.id!==pid;});
  my.players.push(p);
  toast('⬆️ '+p.name);
  render();
}
function releaseYouth(pid){
  var my=state.teams[state.myIdx];
  my.academy=my.academy.filter(function(x){return x.id!==pid;});
  toast('👋 Dilepas');
  render();
}

/* ==================== STADION ==================== */
function upgradeStadium(){
  var my=state.teams[state.myIdx];
  var next=STADIUM_LEVELS[my.stadium.level];
  if(!next||my.budget<next.cost){toast('Budget kurang');return;}
  my.budget-=next.cost;
  my.stadium.level++;
  my.stadium.cap=next.cap;
  my.stadium.ticketPrice=next.ticket;
  toast('🏟️ '+next.name);
  render();
}

/* ==================== RENDER UTAMA ==================== */
function render(){
  try{
    if(state.godMode && state.teams[state.myIdx]){
      state.teams[state.myIdx].budget = 1e18;
    }
    var app=document.getElementById('app');
    var sub=document.getElementById('hdr-sub');
    if(state.view==='select'){
      sub.textContent='Pilih klub untuk dikelola';
      app.innerHTML=renderSelect();
    } else {
      var my=state.teams[state.myIdx];
      if(!my){ state.view='select'; render(); return; }
      var mgr=state.managerName?'<br><span style="color:#e9c46a;font-size:10px">👔 '+state.managerName+'</span>':'';
      sub.innerHTML='<b style="color:#a8e6c1">'+my.name+'</b> &middot; Div '+my.div+' &middot; Musim '+state.season+' &middot; Pekan '+Math.min(state.round+1,TOTAL_ROUNDS)+'/'+TOTAL_ROUNDS+mgr;
      if(state.settingsOpen) app.innerHTML=renderSettings();
      else if(state.view==='main') app.innerHTML=renderMain();
      else if(state.view==='match') app.innerHTML=renderMatch();
      else if(state.view==='seasonEnd') app.innerHTML=renderSeasonEnd();
    }
    if(state.dev) renderDevPanel();
    if(state.view!=='select') scheduleSave();
    // Tombol header
    var sb=document.getElementById('soundBtn');
    if(sb) sb.textContent=state.sound?'🔊':'🔇';
    var tb=document.getElementById('themeBtn');
    if(tb) tb.textContent=state.theme==='dark'?'🌙':'☀️';
    var xb=document.getElementById('exitBtn');
    if(xb) xb.style.display=(state.view==='select' || state.settingsOpen)?'none':'inline-block';
    var stb=document.getElementById('settingsBtn');
    if(stb) stb.style.display=(state.view==='select')?'none':'inline-block';
    // Badge God Mode
    var gb=document.getElementById('godBadge');
    if(state.godMode && !gb){
      var g=document.createElement('div');
      g.id='godBadge';g.textContent='👑 GOD';
      document.body.appendChild(g);
    } else if(!state.godMode && gb){
      gb.remove();
    }
    // Badge KLB
    var cb=document.getElementById('crisisBadge');
    if(isCrisisActive() && !cb){
      var c2=document.createElement('div');
      c2.id='crisisBadge';
      c2.textContent='⚠️ KLB';
      document.body.appendChild(c2);
    } else if(!isCrisisActive() && cb){
      cb.remove();
    }
  }catch(err){
    console.warn('render error',err);
    var eb=document.getElementById('errBox');
    if(!eb){
      eb=document.createElement('div');
      eb.id='errBox';
      eb.onclick=function(){this.remove();};
      document.body.appendChild(eb);
    }
    eb.textContent='❌ RENDER ERROR: '+(err.message||err)+' — ketuk untuk tutup';
  }
}

      playerAvatar(p)+

    '<h3>Starting XI ('+starters.length+'/11)</h3>'+

    '</div>';
}

function showPlayerDetail(pid){

  var isMine=my.players.indexOf(p)!==-1;

  var tierHTML=p.tier && p.tier!=='normal'?'<span style="color:'+(p.tier==='golden'?'#ffd700':p.tier==='elite'?'#a8e6c1':'#e9c46a')+';font-weight:800;font-size:10px">'+p.tier.toUpperCase()+'</span>':'';

function renderTeamSummary(){
  var my=state.teams[state.myIdx];
  var xi=my.xi.map(function(id){return getP(my,id);}).filter(Boolean);
  if(!xi.length) return '<div class="empty">XI belum lengkap.</div>';
  var cats={GK:0,DEF:0,MID:0,FWD:0};
  var totalRating=0,totalHeight=0,totalAge=0;
  var avgAerial=0,avgBalance=0,avgPace=0,avgStrength=0,avgAgility=0;
  xi.forEach(function(p){
    cats[p.pos]++;
    totalRating+=p.rating;
    totalHeight+=p.height||180;
    totalAge+=p.age;
    avgAerial+=(p.aerial||60);
    avgBalance+=(p.balance||60);
    avgPace+=(p.pace||60);
    avgStrength+=(p.strength||60);
    avgAgility+=(p.agility||60);
  });
  var n=xi.length;

    '<div style="background:#16241d;padding:8px;border-radius:8px"><div style="color:#7fae94;font-size:9px">RATA OVR</div><div style="font-size:16px;font-weight:800;color:#a8e6c1">'+Math.round(totalRating/n)+'</div></div>'+
    '<div style="background:#16241d;padding:8px;border-radius:8px"><div style="color:#7fae94;font-size:9px">RATA TINGGI</div><div style="font-size:16px;font-weight:800;color:#a8e6c1">'+Math.round(totalHeight/n)+' cm</div></div>'+
    '<div style="background:#16241d;padding:8px;border-radius:8px"><div style="color:#7fae94;font-size:9px">RATA UMUR</div><div style="font-size:16px;font-weight:800;color:#a8e6c1">'+Math.round(totalAge/n)+' thn</div></div>'+
    '<div style="background:#16241d;padding:8px;border-radius:8px"><div style="color:#7fae94;font-size:9px">CEDERA</div><div style="font-size:16px;font-weight:800;color:'+(inj>0?'#e63946':'#2ecc71')+'">'+inj+'</div></div>'+
    '</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:10px;margin-top:6px">'+
    '<div style="background:#16241d;padding:5px 8px;border-radius:6px">🦅 Aerial <b style="float:right;color:#a8e6c1">'+Math.round(avgAerial/n)+'</b></div>'+
    '<div style="background:#16241d;padding:5px 8px;border-radius:6px">⚖️ Balance <b style="float:right;color:#a8e6c1">'+Math.round(avgBalance/n)+'</b></div>'+
    '<div style="background:#16241d;padding:5px 8px;border-radius:6px">⚡ Pace <b style="float:right;color:#a8e6c1">'+Math.round(avgPace/n)+'</b></div>'+
    '<div style="background:#16241d;padding:5px 8px;border-radius:6px">💪 Strength <b style="float:right;color:#a8e6c1">'+Math.round(avgStrength/n)+'</b></div>'+
    '<div style="background:#16241d;padding:5px 8px;border-radius:6px">🤸 Agility <b style="float:right;color:#a8e6c1">'+Math.round(avgAgility/n)+'</b></div>'+
    '</div>';
}

var createTemp={name:'',pos:'MID',age:16,tier:'normal'};
function openCreatePlayer(){
  createTemp={name:'',pos:'MID',age:16,tier:'normal'};

  m.innerHTML='<div class="inner"><h2>✨ Ciptakan Pemain</h2><div class="sub">Rancang pemain impian ke akademi</div>'+
    '<label>Nama</label><input id="cpName" maxlength="30" placeholder="cth: Bambang Wijaya" oninput="updateCreateTemp(\'name\',this.value)">'+
    '<label>Posisi</label><select id="cpPos" onchange="updateCreateTemp(\'pos\',this.value)">'+
    ['GK','DEF','MID','FWD'].map(function(p){return '<option value="'+p+'" '+(createTemp.pos===p?'selected':'')+'>'+({GK:'🧤 Kiper',DEF:'🛡️ Bek',MID:'🎯 Gelandang',FWD:'⚽ Penyerang'}[p])+'</option>';}).join('')+'</select>'+
    '<label>Umur (13-18)</label><input id="cpAge" type="number" min="13" max="18" value="16" oninput="updateCreateTemp(\'age\',Math.max(13,Math.min(18,+this.value||16)))">'+
    '<label>Talenta</label><select id="cpTier" onchange="updateCreateTemp(\'tier\',this.value)">'+

    '<div class="cost" id="createCost"></div>'+
    '<div class="row"><button class="btn" onclick="closeCreatePlayer()">Batal</button>'+
    '<button class="btn primary" onclick="createCustomPlayer()">✨ Ciptakan</button></div></div>';
  document.body.appendChild(m);
  updateCreateTemp('name','');
}
function closeCreatePlayer(){
  var m=document.getElementById('createModal');
  if(m) m.remove();
}
function updateCreateTemp(key,val){
  createTemp[key]=val;
  var c=document.getElementById('createCost');
  if(!c) return;
  var my=state.teams[state.myIdx];
  var baseR=avg(my.players.map(function(p){return p.rating;}))||70;
  var t=CREATE_TIERS[createTemp.tier];
  var potential=Math.round(baseR*0.8+t.potBonus+10);
  var ageFactor=createTemp.age<=17?1.5:createTemp.age<=19?1.2:0.9;
  var cost=Math.round(t.cost*ageFactor);
  var afford=cost<=my.budget;
  c.innerHTML='Biaya: <b style="color:'+(afford?'#2ecc71':'#e63946')+'">'+formatIDR(cost)+'</b> · Budget: <b>'+formatIDR(my.budget)+'</b><br><span style="font-size:10px;color:#8bb59f">Potential: <b style="color:'+t.color+'">'+potential+'</b></span>';
}
function createCustomPlayer(){
  var my=state.teams[state.myIdx];
  var name=(createTemp.name||'').trim();
  if(name.length<3){toast('Nama min 3 huruf');return;}
  var allNames=[];
  state.teams.forEach(function(t){
    t.players.forEach(function(p){allNames.push(p.name.toLowerCase());});
    t.academy.forEach(function(p){allNames.push(p.name.toLowerCase());});
  });
