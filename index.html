function makeSponsorOffer(teamDiv){
  var rep=state.managerReputation||50;
  var trophies=state.trophyRoom?state.trophyRoom.length:0;
  // Tentukan tier minimal berdasarkan prestasi
  var minTierName='lokal';
  if(rep>=90 && trophies>=10) minTierName='dewa';
  else if(rep>=80 && trophies>=7) minTierName='triliuner';
  else if(rep>=70 && trophies>=5) minTierName='sultan';
  else if(rep>=60 && trophies>=3) minTierName='mega';
  else if(rep>=45 && trophies>=1) minTierName='jumbo';
  var tierOrder=['lokal','nasional','jumbo','mega','sultan','triliuner','dewa'];
  var minIdx=tierOrder.indexOf(minTierName);
  var availableTiers=[];
  Object.keys(SPONSOR_TIERS).forEach(function(k){
    var t=SPONSOR_TIERS[k];
    if(teamDiv < t.minDiv) return;
    if(rep < t.minRep) return;
    if(trophies < t.minTrophy) return;
    if(tierOrder.indexOf(k) < minIdx) return;
    availableTiers.push(k);
  });
  if(!availableTiers.length) availableTiers=['lokal'];
  var weightMap={lokal:1,nasional:1,jumbo:5,mega:15,sultan:25,triliuner:25,dewa:20};
  var weightedPool=[];
  availableTiers.forEach(function(k){
    var w=weightMap[k]||1;
    var count=Math.max(1,Math.round(w*3));
    for(var i=0;i<count;i++) weightedPool.push(k);
  });
  var tier=pick(weightedPool);
  var tierPool=SPONSOR_POOL.filter(function(s){return s.tier===tier;});
  if(!tierPool.length){
    tierPool=SPONSOR_POOL.filter(function(s){return s.tier==='lokal';});
  }
  if(!tierPool.length) tierPool=SPONSOR_POOL.slice(0,20);
  var s=pick(tierPool);
  var t=SPONSOR_TIERS[tier];
  var annual=Math.round(rnd(t.annualMin,t.annualMax)/1e9)*1e9;
  var years=ri(t.yearsMin,t.yearsMax);
  var paymentMode=Math.random()<0.5?'upfront':'monthly';
  var bonuses={};
  Object.keys(SPONSOR_BONUSES).forEach(function(k){bonuses[k]=Math.round(annual*SPONSOR_BONUSES[k]);});
  return {
    id:Date.now()+Math.random(),
    sponsorName:s.name,color:s.color,tier:tier,
    annual:annual,years:years,paymentMode:paymentMode,bonuses:bonuses,
    totalValue:annual*years,offeredSeason:state.season
  };
}
function generateSponsorOffers(){
  var my=state.teams[state.myIdx];
  if(!my) return;
  if(state.sponsorOffersWeek===state.round && state.sponsorOffers.length) return;
  state.sponsorOffersWeek=state.round;
  var count=state.sponsors.length>=30?ri(2,4):state.sponsors.length>=15?ri(3,5):ri(4,6);
  state.sponsorOffers=[];
  for(var i=0;i<count;i++) state.sponsorOffers.push(makeSponsorOffer(my.div));
}
function acceptSponsor(offerId){
  var my=state.teams[state.myIdx];
  var offer=null;
  for(var i=0;i<state.sponsorOffers.length;i++){if(state.sponsorOffers[i].id===offerId){offer=state.sponsorOffers[i];break;}}
  if(!offer) return;
  if(state.sponsors.length>=50){toast('Maksimal 50 sponsor aktif');return;}
  var upfront=offer.paymentMode==='upfront'?offer.annual*offer.years:0;
  if(upfront>0) my.budget+=upfront;
  offer.startSeason=state.season;
  offer.endSeason=state.season+offer.years-1;
  offer.lastPaidSeason=state.season;
  offer.totalPaid=upfront;
  offer.bonusesEarned=0;
  state.sponsors.push(offer);
  state.sponsorOffers=state.sponsorOffers.filter(function(o){return o.id!==offerId;});
  toast('🤝 '+offer.sponsorName+' jadi sponsor!');
  if(state.sound) sfxClick();
  render();
}
function rejectSponsor(offerId){
  state.sponsorOffers=state.sponsorOffers.filter(function(o){return o.id!==offerId;});
  render();
}
function terminateSponsor(sponsorId){
  var my=state.teams[state.myIdx];
  var sp=null,idx=-1;
  for(var i=0;i<state.sponsors.length;i++){
    if(state.sponsors[i].id===sponsorId){sp=state.sponsors[i];idx=i;break;}
  }
  if(!sp||idx===-1) return;
  var yearsLeft=Math.max(0,sp.endSeason-state.season+1);
  var remaining=yearsLeft*sp.annual;
  var penalty=Math.round(remaining*0.5);
  var isUpfront=sp.paymentMode==='upfront';
  var msg='Putus kontrak dengan '+sp.sponsorName+'?\n\n'+
    'Sisa kontrak: '+yearsLeft+' tahun\n'+
    'Nilai sisa: '+formatIDR(remaining)+'\n'+
    'Penalti (50%): '+formatIDR(penalty)+
    (isUpfront?'\n\n(Sponsor sudah dibayar dimuka)':'');
  if(!confirm(msg)) return;
  if(my.budget<penalty){toast('❌ Budget kurang untuk penalti '+formatIDR(penalty));return;}
  my.budget-=penalty;
  state.sponsors.splice(idx,1);
  state.news.unshift({t:'📄 '+my.name+' putus kontrak dengan '+sp.sponsorName+' (penalti '+formatIDR(penalty)+')',time:'Musim '+state.season});
  state.managerReputation=Math.max(0,(state.managerReputation||50)-2);
  toast('📄 Kontrak diputus');
  if(state.sound) sfxCard();
  render();
}

/* ==================== TAB BISNIS: IPO & SAHAM ==================== */
function canIPO(team){
  if(team.listed) return {ok:false,reason:'Sudah tercatat'};
  if(team.budget<IPO_CONFIG.minBudget) return {ok:false,reason:'Budget min '+formatIDR(IPO_CONFIG.minBudget)};
  if((state.managerReputation||0)<IPO_CONFIG.minReputation) return {ok:false,reason:'Reputasi min 60'};
  if((state.trophyRoom?state.trophyRoom.length:0)<IPO_CONFIG.minTrophy) return {ok:false,reason:'Min 1 trofi'};
  if(team.div!==1) return {ok:false,reason:'Hanya Div 1'};
  return {ok:true};
}
function calculateValuation(team){
  var sq=team.players.reduce(function(s,p){return s+marketValue(p);},0);
  var st=team.stadium.cap*500000;
  var tr=(state.trophyRoom?state.trophyRoom.length:0)*50e9;
  var rp2=(state.managerReputation||50)*1e9;
  return sq+st+tr+rp2;
}
function calculateClubValue(team){
  var sq=team.players.reduce(function(s,p){return s+marketValue(p);},0);
  return sq+team.stadium.cap*400000;
}
function renderIPO(){
  var my=state.teams[state.myIdx];
  if(my.listed) return renderBursaDashboard();
  var chk=canIPO(my);
  var val=calculateValuation(my);
  var estPrice=Math.max(IPO_CONFIG.basePrice,Math.round(val/IPO_CONFIG.shareCount/100)*100);
  return '<div class="card" style="border-color:#ffd700">'+
    '<div style="text-align:center;padding:8px 0"><div style="font-size:44px">📈</div>'+
    '<h2 style="color:#ffd700">GO PUBLIC</h2>'+
    '<div style="font-size:11px;color:#8bb59f;margin-bottom:14px">'+my.name+'</div></div>'+
    '<table><tr><td>Valuasi</td><td class="num" style="color:#ffd700;font-weight:800">'+formatIDR(val)+'</td></tr>'+
    '<tr><td>Harga IPO</td><td class="num" style="color:#2ecc71">'+formatIDR(estPrice)+'</td></tr>'+
    '<tr><td>Saham Publik</td><td class="num">'+(IPO_CONFIG.publicPct*100).toFixed(0)+'%</td></tr>'+
    '<tr><td>Dana Terkumpul</td><td class="num" style="color:#ffd700">'+formatIDR(estPrice*IPO_CONFIG.shareCount*IPO_CONFIG.publicPct)+'</td></tr></table>'+
    '<div style="margin-top:12px;font-size:12px;line-height:2">'+

    '<div>'+(my.budget>=IPO_CONFIG.minBudget?'✅':'❌')+' Budget cukup</div>'+

      '<div style="text-align:center;color:#e63946;font-size:12px;margin-top:10px">'+chk.reason+'</div>')+

function doIPO(){
  var my=state.teams[state.myIdx];
  var chk=canIPO(my);
  if(!chk.ok){toast(chk.reason);return;}
  var val=calculateValuation(my);
  var price=Math.max(IPO_CONFIG.basePrice,Math.round(val/IPO_CONFIG.shareCount/100)*100);

    total:total,public:publicShares,insider:total-publicShares,

  toast('🎉 IPO! +'+formatIDR(raised));

function renderStockChart(s){

    '<stop offset="100%" stop-color="'+lineColor+'" stop-opacity="0"/></linearGradient></defs>'+
    '<rect width="'+W+'" height="'+H+'" fill="#000"/>'+
    gridLines+
    '<path d="'+areaPath+'" fill="url(#areaGrad)"/>'+
    '<path d="'+linePath+'" fill="none" stroke="'+lineColor+'" stroke-width="1.5" stroke-linejoin="round"/>'+
    '<circle cx="'+toX(highIdx)+'" cy="'+toY(prices[highIdx])+'" r="2" fill="#ffd700"/>'+
    '<circle cx="'+toX(lowIdx)+'" cy="'+toY(prices[lowIdx])+'" r="2" fill="#e63946"/>'+
    '<circle cx="'+lastX+'" cy="'+lastY+'" r="5" fill="'+lineColor+'" opacity="0.3"/>'+
    '<circle cx="'+lastX+'" cy="'+lastY+'" r="2.5" fill="'+lineColor+'" stroke="#fff" stroke-width="0.5"/>'+
    '<text x="'+PAD_L+'" y="'+(H-4)+'" font-size="8" fill="#5f7d6c" font-family="monospace">'+hist[0].season+'/'+hist[0].week+'</text>'+
    '<text x="'+(W-PAD_R)+'" y="'+(H-4)+'" text-anchor="end" font-size="8" fill="#5f7d6c" font-family="monospace">'+hist[hist.length-1].season+'/'+hist[hist.length-1].week+'</text>'+
    '</svg>';
  var first=hist[0].price;
  var last=hist[hist.length-1].price;
  var changePct=((last-first)/first*100);
  var changeColor=changePct>=0?'#2ecc71':'#e63946';

function buybackShares(pct){
  var my=state.teams[state.myIdx];
  if(!my.listed) return;
  var qty=Math.round(my.shares.public*pct);
  if(qty<=0) return;
  var cost=qty*my.shares.price;
  if(my.budget<cost){toast('Budget kurang');return;}
  my.budget-=cost;my.shares.public-=qty;my.shares.insider+=qty;
  toast('💼 Buyback '+qty.toLocaleString('id-ID'));
  render();
}
function delistStock(){
  var my=state.teams[state.myIdx];
  if(!my.listed) return;
  var cost=my.shares.public*my.shares.price;
  if(my.budget<cost){toast('Butuh '+formatIDR(cost));return;}
  my.budget-=cost;my.shares.insider=my.shares.total;my.shares.public=0;my.listed=false;
  toast('📉 Delisting');
  render();
}
function payDividend(per){
  var my=state.teams[state.myIdx];
  if(!my.listed){toast('Belum IPO');return;}
  var cost=my.shares.total*per;
  if(my.budget<cost){toast('Budget kurang');return;}
  my.budget-=cost;my.shares.totalDividendPaid+=cost;
  toast('💵 Dividen '+formatIDR(cost));
  render();
}
function buyStock(teamIdx,lots){
  var my=state.teams[state.myIdx];
  var target=state.teams[teamIdx];
  if(!target||!target.listed){toast('Klub belum listed');return;}
  if(teamIdx===state.myIdx){toast('Gunakan Buyback untuk klub sendiri');return;}
  var shares=lots*100;
  var cost=shares*target.shares.price;
  if(cost>my.budget){toast('Budget tidak cukup. Butuh '+formatIDR(cost));return;}
  my.budget-=cost;
  if(!state.stockPortfolio[teamIdx]){
    state.stockPortfolio[teamIdx]={shares:0,avgPrice:0,totalCost:0};
  }
  var pf=state.stockPortfolio[teamIdx];
  var newTotalCost=pf.totalCost+cost;
  var newShares=pf.shares+shares;
  pf.avgPrice=Math.round(newTotalCost/newShares);
  pf.totalCost=newTotalCost;
  pf.shares=newShares;
  state.stockTransactions.unshift({
    type:'buy',team:target.name,teamIdx:teamIdx,
    shares:shares,price:target.shares.price,cost:cost,
    season:state.season,week:state.round
  });
  toast('📈 Beli '+shares+' lembar '+target.name);
  if(state.sound) sfxGoal();
  render();
}
function sellStock(teamIdx,lots){
  var my=state.teams[state.myIdx];
  var target=state.teams[teamIdx];
  if(!state.stockPortfolio[teamIdx]){toast('Tidak punya saham ini');return;}
  var pf=state.stockPortfolio[teamIdx];
  var shares=lots*100;
  if(shares>pf.shares) shares=pf.shares;
  if(shares<=0){toast('Tidak ada saham');return;}
  var revenue=shares*target.shares.price;
  var profit=revenue-(pf.avgPrice*shares);
  my.budget+=revenue;
  pf.shares-=shares;
  pf.totalCost-=pf.avgPrice*shares;
  if(pf.shares<=0){delete state.stockPortfolio[teamIdx];}
  state.stockTransactions.unshift({
    type:'sell',team:target.name,teamIdx:teamIdx,
    shares:shares,price:target.shares.price,revenue:revenue,profit:profit,
    season:state.season,week:state.round
  });
  toast('💸 Jual '+shares+' lembar '+(profit>=0?'+':'')+formatIDR(profit));
  if(state.sound) sfxGoal();
  render();
}
function sellAllStock(teamIdx){
  var pf=state.stockPortfolio[teamIdx];
  if(!pf) return;
  sellStock(teamIdx,Math.floor(pf.shares/100));
}
function getPortfolioValue(){
  var total=0;
  Object.keys(state.stockPortfolio).forEach(function(k){
    var idx=+k;
    var t=state.teams[idx];
    var pf=state.stockPortfolio[k];
    if(t&&t.listed) total+=pf.shares*t.shares.price;
  });
  return total;
}
function getPortfolioProfit(){
  var total=0;
  Object.keys(state.stockPortfolio).forEach(function(k){
    var idx=+k;
    var t=state.teams[idx];
    var pf=state.stockPortfolio[k];
    if(t&&t.listed) total+=(t.shares.price-pf.avgPrice)*pf.shares;
  });
  return total;
}

function acquireClub(targetIdx,pct){
  var my=state.teams[state.myIdx];
  var target=state.teams[targetIdx];
  if(!target||targetIdx===state.myIdx){toast('Pilih klub lain');return;}
  if(target.acquiredBy!==null&&target.acquiredBy!==state.myIdx){toast('Sudah dikuasai');return;}
  var val=calculateClubValue(target);
  var cost=Math.round(val*pct);
  if(my.budget<cost){toast('Butuh '+formatIDR(cost));return;}
  my.budget-=cost;
  target.acquiredBy=state.myIdx;
  target.acquiredStake=Math.min(1,(target.acquiredStake||0)+pct);
  var acq=null;
  for(var i=0;i<state.acquisitions.length;i++){if(state.acquisitions[i].targetIdx===targetIdx){acq=state.acquisitions[i];break;}}
  if(!acq){
    state.acquisitions.push({targetIdx:targetIdx,totalCost:cost,stake:target.acquiredStake,since:state.season});
  } else {
    acq.totalCost+=cost;
    acq.stake=target.acquiredStake;
  }
  state.news.unshift({t:'🏢 '+my.name+' akuisisi '+(pct*100).toFixed(0)+'% '+target.name+' — '+formatIDR(cost),time:'Musim '+state.season});
  toast('🏢 '+(target.acquiredStake*100).toFixed(0)+'% '+target.name);
  if(state.sound) sfxGoal();
  render();
}
function releaseClub(targetIdx){
  var target=state.teams[targetIdx];
  if(!target||target.acquiredBy!==state.myIdx) return;
  var val=calculateClubValue(target);
  var refund=Math.round(val*target.acquiredStake*0.85);
  state.teams[state.myIdx].budget+=refund;
  state.acquisitions=state.acquisitions.filter(function(a){return a.targetIdx!==targetIdx;});
  target.acquiredBy=null;target.acquiredStake=0;
  toast('💸 +'+formatIDR(refund));
  render();
}

function startPialaNasional(){
  if(state.pialaNasional) return;
  var ranked=state.teams.map(function(t,i){return {i:i,r:avg(t.players.slice(0,11).map(function(p){return p.rating;}))};})
    .sort(function(a,b){return b.r-a.r;}).slice(0,16).map(function(x){return x.i;});
  shuffle(ranked);
  var pairs=[];
  for(var i=0;i<16;i+=2) pairs.push({home:ranked[i],away:ranked[i+1],played:false,hg:0,ag:0});
  state.pialaNasional={
    round:0,rounds:[pairs],
    qualified:ranked.indexOf(state.myIdx)!==-1,
    finished:false
  };
  state.news.unshift({t:'🏆 Piala Nasional dimulai! 16 tim bertarung.',time:'Pekan '+(state.round+1)});
}
function decideCupWinner(f,hStrength,aStrength){
  var diff=hStrength-aStrength;
  f.hg=Math.max(0,Math.round(rnd(0,3)+diff/15+0.5));
  f.ag=Math.max(0,Math.round(rnd(0,3)-diff/15+0.3));
  if(f.hg===f.ag){
    var etH=Math.random()<0.30?ri(0,2):0;
    var etA=Math.random()<0.30?ri(0,2):0;
    f.etHg=etH;f.etAg=etA;f.et=true;
    f.hg+=etH;f.ag+=etA;
    if(f.hg===f.ag){
      var hPen=ri(3,5);
      var aPen=hPen+(Math.random()<0.5?-1:1);
      if(aPen<0) aPen=0;
      if(aPen===hPen) aPen=hPen+1;
      f.penHome=hPen;f.penAway=aPen;
      f.winner=hPen>aPen?f.home:f.away;
    } else {
      f.winner=f.hg>f.ag?f.home:f.away;
    }
  } else {
    f.winner=f.hg>f.ag?f.home:f.away;
  }
  f.played=true;
}
function playPialaRound(){
  var pn=state.pialaNasional;
  if(!pn||pn.finished) return;
  var cur=pn.rounds[pn.round];
  cur.forEach(function(f){
    if(f.played) return;
    var h=state.teams[f.home],a=state.teams[f.away];
    var hS=avg(h.players.slice(0,11).map(function(x){return x.rating;}));
    var aS=avg(a.players.slice(0,11).map(function(x){return x.rating;}));
    decideCupWinner(f,hS,aS);
  });
  if(cur.length>1){
    var winners=cur.map(function(f){return f.winner;});
    var next=[];
    for(var i=0;i<winners.length;i+=2){
      next.push({home:winners[i],away:winners[i+1],played:false,hg:0,ag:0});
    }
    pn.rounds.push(next);
    pn.round++;
  } else {
    var champ=state.teams[cur[0].winner];
    state.news.unshift({t:'🏆 '+champ.name+' juara Piala Nasional!',time:'Musim '+state.season});
    champ.budget+=champ.div===1?150e9:80e9;
    pn.finished=true;
    state.currentPialaNasWinner={name:champ.name,color:champ.color,div:champ.div,idx:cur[0].winner};
  }
}
function getLC(id){
  if(typeof id==='string' && id.charAt(0)==='A'){
    var t=ASIAN_TEAMS[+id.slice(1)];
    return {name:t.name,color:t.color,foreign:true,rating:t.rating};
  }
  return state.teams[id];
}
function startLigaChampions(){
  if(state.ligaChampions) return;
  var local=getTable(1).slice(0,8).map(function(r){return r.idx;});
  var asian=ASIAN_TEAMS.map(function(_,i){return 'A'+i;});
  var all=local.concat(asian);
  shuffle(all);
  var pairs=[];
  for(var i=0;i<16;i+=2){
    pairs.push({home:all[i],away:all[i+1],played:false,hg:0,ag:0});
  }
  state.ligaChampions={
    round:0,rounds:[pairs],finished:false,
    qualified:local.indexOf(state.myIdx)!==-1
  };
}
function playLigaChampionsRound(){
  var lc=state.ligaChampions;
  if(!lc||lc.finished) return;
  var cur=lc.rounds[lc.round];
  cur.forEach(function(f){
    if(f.played) return;
    var h=getLC(f.home),a=getLC(f.away);
    var hS=h.foreign?h.rating:avg(state.teams[f.home].players.slice(0,11).map(function(p){return p.rating;}));
    var aS=a.foreign?a.rating:avg(state.teams[f.away].players.slice(0,11).map(function(p){return p.rating;}));
    decideCupWinner(f,hS,aS);
  });
  if(cur.length>1){
    var winners=cur.map(function(f){return f.winner;});
    var next=[];
    for(var i=0;i<winners.length;i+=2){
      next.push({home:winners[i],away:winners[i+1],played:false,hg:0,ag:0});
    }
    lc.rounds.push(next);
    lc.round++;
  } else {
    var w=cur[0].winner;
    var isForeign=typeof w==='string';
    var winner=isForeign?getLC(w).name:state.teams[w].name;
    var wColor=isForeign?getLC(w).color:state.teams[w].color;
    var wIdx=isForeign?null:w;
    if(!isForeign) state.teams[w].budget+=400e9;
    state.news.unshift({t:'🏆 '+winner+' juara Liga Champions Asia!',time:'Musim '+state.season});
    lc.finished=true;
    state.currentLCWinner={name:winner,color:wColor,idx:wIdx};
  }
}
function renderBracketRounds(rounds,teamGetter,labels){
  var s='<div class="bracket">';
  for(var ri=0;ri<rounds.length;ri++){
    var rd=rounds[ri];
    s+='<div class="bracket-col"><div style="font-size:10px;color:#7fae94;text-align:center;margin-bottom:4px">'+(labels[ri]||'Ronde')+'</div>';
    for(var fi=0;fi<rd.length;fi++){
      var f=rd[fi];
      var h=teamGetter(f.home);
      var a=teamGetter(f.away);
      var isMine=(f.home===state.myIdx)||(f.away===state.myIdx);
      var hCls=f.played&&f.winner===f.home?'win':f.played?'lose':'';
      var aCls=f.played&&f.winner===f.away?'win':f.played?'lose':'';
      var hScore='-',aScore='-';
      if(f.played){
        hScore=''+f.hg;aScore=''+f.ag;
        if(f.penHome!=null){
          hScore+=' ('+f.penHome+')';
          aScore+=' ('+f.penAway+')';
        } else if(f.et){
          hScore+=' <span style="color:#e9c46a;font-size:9px">AET</span>';
          aScore+=' <span style="color:#e9c46a;font-size:9px">AET</span>';
        }
      }
      s+='<div class="bracket-match '+(isMine?'mine':'')+'">'+
        '<div class="'+hCls+'">'+h.name+' <span style="float:right">'+hScore+'</span></div>'+
        '<div class="'+aCls+'">'+a.name+' <span style="float:right">'+aScore+'</span></div></div>';
    }
    s+='</div>';
  }
  s+='</div>';
  return s;
}

function getTeamPositions(team,mirror){
  var f=FORMATION_POS[team.formation]||FORMATION_POS['4-3-3'];
  var xi=team.xi.map(function(id){return getP(team,id);}).filter(Boolean);
  var out=[];
  var idx={GK:0,DEF:0,MID:0,FWD:0};
  xi.forEach(function(p){
    var arr=f[p.pos];
    if(!arr) return;
    var pos=arr[idx[p.pos]++%arr.length];
    out.push({x:mirror?100-pos[0]:pos[0],y:pos[1]});
  });
  return out;
}

function updatePitch(e){
  var svg=document.querySelector('.pitch');
  if(!svg) return;
  var ball=svg.querySelector('#pitchBall');
  if(ball){
    var x=50,y=32;
    if(e.type==='goal'){
      x=e.team==='home'?ri(91,95):ri(5,9);
      y=ri(27,37);
    } else if(e.type==='commentary'){
      x=ri(30,70);y=ri(10,54);
    }
    ball.setAttribute('transform','translate('+x+','+y+')');
  }
  var pps=svg.querySelectorAll('.pp');
  for(var i=0;i<pps.length;i++){
    var g=pps[i];
    var bx=+g.dataset.bx,by=+g.dataset.by;
    var dx=rnd(-3,3),dy=rnd(-3,3);
    g.setAttribute('transform','translate('+Math.max(2,Math.min(98,bx+dx))+','+Math.max(2,Math.min(62,by+dy))+')');
  }
}

  var svg=document.querySelector('.pitch');

}

/* ==================== ANIMASI MATCH ==================== */
var animTimer=null;
function animateHalf(half){
  var m=pendingMatch;
  if(!m) return;
  var evs=m.ctx.events.filter(function(e){return half===1?e.min<=45:e.min>45;})
    .sort(function(a,b){return a.min-b.min;});
  var scoreEl=document.getElementById('matchScore');
  var clockEl=document.getElementById('matchClock');
  var listEl=document.getElementById('matchEvents');
  if(!scoreEl||!listEl) return;
  var idx=0;
  var startMin=half===1?0:45;
  var endMin=half===1?45:90;
  var curMin=startMin;
  clearInterval(animTimer);
  if(half===1) resetPitch();
  var MS_PER_MIN=3333;
  var TICK=60;
  var last=performance.now();
  animTimer=setInterval(function(){
    var now=performance.now();
    var dt=now-last;last=now;
    var speed=state.animSpeed||1;
    curMin+=(dt*speed)/MS_PER_MIN;
    while(idx<evs.length&&evs[idx].min<=curMin){
      applyEventToUI(evs[idx++],m,scoreEl,listEl);
    }
    if(clockEl) clockEl.textContent=Math.min(endMin,Math.floor(curMin))+'\'';
    if(curMin>=endMin){
      clearInterval(animTimer);
      while(idx<evs.length){applyEventToUI(evs[idx++],m,scoreEl,listEl);}
      if(clockEl) clockEl.textContent=endMin+'\'';
      if(half===1) openHalfTimeModal();
      else finishFullMatch();
    }
  },TICK);
}
function applyEventToUI(e,m,scoreEl,listEl){
  if(e.type==='goal'){
    var hg=0,ag=0;
    for(var i=0;i<m.ctx.events.length;i++){
      var ev=m.ctx.events[i];
      if(ev.type!=='goal') continue;
      if(ev===e) break;
      if(ev.team==='home') hg++; else ag++;
    }
    if(e.team==='home') hg++; else ag++;
    scoreEl.textContent=hg+' - '+ag;
    scoreEl.classList.add('pulse');
    setTimeout(function(){scoreEl.classList.remove('pulse');},250);
    if(state.sound){try{sfxGoal();}catch(e2){}}
  } else if(e.type==='card'&&state.sound){try{sfxCard();}catch(e2){}}
  try{updatePitch(e);}catch(e2){}
  var div=document.createElement('div');
  div.className='event '+e.type+' '+(e.team||'');
  div.textContent=e.min+'\' '+e.text;
  listEl.appendChild(div);
  listEl.scrollTop=listEl.scrollHeight;
}

var audioCtx=null;
function beep(freq,dur,type,vol){
  if(!state.sound) return;
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    var o=audioCtx.createOscillator();
    var g=audioCtx.createGain();
    o.type=type||'sine';
    o.frequency.value=freq;
    g.gain.value=vol||0.15;
    o.connect(g);g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
    o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

/* ==================== SECRET PORTAL ==================== */
function checkSecretCode(){
  var inp=document.getElementById('portalInput');
  if(!inp) return;
  var code=(inp.value||'').trim().toUpperCase();
  var found=null;
  Object.keys(SECRET_CODES).forEach(function(k){
    if(k===code) found=SECRET_CODES[k];
  });
  if(!found){
    inp.style.borderColor='#e63946';
    inp.style.color='#e63946';
    inp.value='';
    inp.placeholder='KODE TIDAK VALID';
    setTimeout(function(){
      inp.style.borderColor='#2f5442';
      inp.style.color='#2ecc71';
      inp.placeholder='MASUKKAN KODE RAHASIA';
    },1500);
    if(state.sound) sfxCard();
    return;
  }
  if(state.sound) sfxGoal();
  showPortalFlash(found.msg,found.color);
  setTimeout(function(){applySecretCode(found.type);},1200);
  inp.value='';
  setTimeout(function(){closeSettings();},2500);
}
function showPortalFlash(msg,color){
  var fl=document.createElement('div');
  fl.className='portal-flash';
  fl.innerHTML='<div class="portal-msg" style="color:'+color+';text-shadow:0 0 30px '+color+',0 0 60px '+color+'">'+msg+'</div>';
  document.body.appendChild(fl);
  setTimeout(function(){fl.remove();},2600);
}
function applySecretCode(type){
  var my=state.teams[state.myIdx];
  if(type==='godOn'){
    state.godMode=true;
    if(my) my.budget=1e18;
    var b=document.createElement('div');b.id='godBadge';b.textContent='👑 GOD';
    if(!document.getElementById('godBadge')) document.body.appendChild(b);
    showGodCinematic();
    if(state.sound){setTimeout(sfxGoal,1300);setTimeout(sfxGoal,1500);}
  }
  else if(type==='godOff'){
    state.godMode=false;
    var b2=document.getElementById('godBadge');if(b2) b2.remove();
    toast('👻 God Mode OFF');
  }
  else if(type==='devOn'){
    if(!state.dev){state.dev=true;}
    if(!document.getElementById('devBadge')){
      var d=document.createElement('div');d.id='devBadge';d.textContent='DEV';
      document.body.appendChild(d);
    }
    renderDevPanel();
  }
  else if(type==='rich'){
    if(my) my.budget+=1e15;
    toast('💰 +Rp 1 Q');
  }
  else if(type==='maxRating'){
    if(my){
      my.players.forEach(function(p){p.rating=95;p.potential=95;});
      my.academy.forEach(function(p){p.rating=85;p.potential=95;});
    }
    toast('⭐ Semua pemain jadi 95!');
  }
  else if(type==='allStars'){
    if(my){
      my.academy.forEach(function(p){
        p.tier='golden';p.talent=2.0;p.potential=96;
        p.rating=Math.max(p.rating,65);
        p.specialSkill=rollSpecialSkill('golden');
      });
      var baseR=avg(my.players.map(function(p){return p.rating;}))||75;
      for(var i=0;i<3;i++){
        var gb=makeYouth(baseR);
        gb.tier='golden';gb.talent=2.0;gb.potential=96;
        gb.rating=Math.max(gb.rating,65);gb.age=16;
        gb.specialSkill=rollSpecialSkill('golden');
        my.academy.push(gb);
      }
    }
    toast('🌟 Golden Boy!');
  }
  else if(type==='instantWin'){
    state.instantWinNext=true;
    toast('🏆 Laga berikutnya auto menang!');
  }
  else if(type==='forceCrisis'){
    state.activeCrisis={
      id:'pandemic',name:'🦠 Pandemi Global',
      desc:'Wabah penyakit menyebar.',
      attendanceMult:0,travelBan:true,budgetImpact:-0.3,moodImpact:-30,
      severity:'chaos',startSeason:state.season,endSeason:state.season+1
    };
    state.hadCrisis=true;
    state.fanMood=Math.max(0,state.fanMood-30);
    crashAllStocks();
    state.news.unshift({t:'📉 KRISIS! Saham crash!',time:'Musim '+state.season});
  }
  else if(type==='forceRebound'){
    if(state.activeCrisis){
      reboundAllStocks();
      var ri2=state.lastReboundInfo||{multiplier:2,jackpot:false};
      state.news.unshift({t:'🚀 REBOUND '+Math.round(ri2.multiplier)+'×!',time:'Musim '+state.season});
      state.activeCrisis=null;
    } else {
      reboundAllStocks();
    }
  }
  else if(type==='forceJackpot'){
    state.activeCrisis={
      id:'nuclear',name:'☢️ Insiden Nuklir',
      desc:'Ledakan nuklir.',
      attendanceMult:0,travelBan:true,budgetImpact:-0.6,moodImpact:-60,
      severity:'apocalypse',startSeason:state.season,endSeason:state.season+1
    };
    state.hadCrisis=true;
    crashAllStocks();
    var orig=Math.random;
    Math.random=function(){return 0.05;};
    reboundAllStocks();
    Math.random=orig;
    state.activeCrisis=null;
    var rj=state.lastReboundInfo||{multiplier:200,jackpot:true};
    state.news.unshift({t:'🎰 JACKPOT REBOUND '+Math.round(rj.multiplier)+'×!',time:'Musim '+state.season});
  }
  else if(type==='boostReputation'){
    state.managerReputation=100;
    state.trophyRoom=[];
    for(var k=0;k<15;k++) state.trophyRoom.push({type:'Trofi Test',season:k+1});
    toast('👑 Reputasi 100 & 15 trofi!');
  }
  render();
}

}

/* ==================== KLB FUNCTIONS ==================== */
function crashAllStocks(){
  var c=state.activeCrisis;
  var sev=c?c.severity:'high';
  var dropMin,dropMax,floorPrice;
  if(sev==='apocalypse'){dropMin=0.90;dropMax=0.99;floorPrice=100;}
  else if(sev==='chaos'){dropMin=0.75;dropMax=0.92;floorPrice=200;}
  else if(sev==='high'){dropMin=0.55;dropMax=0.80;floorPrice=500;}
  else {dropMin=0.30;dropMax=0.55;floorPrice=1000;}
  state.teams.forEach(function(t){
    if(!t.listed) return;
    var drop=1-rnd(dropMin,dropMax);
    var newPrice=Math.max(floorPrice,Math.round(t.shares.price*drop/100)*100);
    t.shares.price=newPrice;
    if(newPrice<t.shares.low || t.shares.low===0) t.shares.low=newPrice;
    t.shares.history.push({season:state.season,week:state.round,price:newPrice,crash:true});
  });
}

function devAddBudget(n){

function devGoldenBoy(){
  var my=state.teams[state.myIdx];
  if(!my) return;
  var baseR=avg(my.players.map(function(p){return p.rating;}))||75;
  var gb=makeYouth(baseR);
  gb.tier='golden';gb.talent=2.0;gb.potential=96;
  gb.rating=Math.max(gb.rating,60);gb.age=16;
  gb.specialSkill=rollSpecialSkill('golden');

function devWinMatch(){
  if(state.view!=='match'||!pendingMatch){toast('Bukan di layar pertandingan');return;}
  var m=pendingMatch;
  var isHome=m.f.home===state.myIdx;
  if(isHome){m.ctx.hg=Math.max(m.ctx.hg,5);m.ctx.ag=0;}
  else{m.ctx.ag=Math.max(m.ctx.ag,5);m.ctx.hg=0;}
  toast('🏆 Kemenangan dipaksa!');
  skipAnim();
}
function devSkipSeason(){
  if(state.round>=TOTAL_ROUNDS) return;
  while(state.round<TOTAL_ROUNDS){
    [1,2].forEach(function(div){
      var round=state.fixtures[div][state.round];
      if(!round) return;
      round.forEach(function(f){
        try{
          var h=state.teams[f.home],a=state.teams[f.away];
          var H=teamStats(h),A=teamStats(a);
          var ctx={H:H,A:A,possH:H.mid/(H.mid+A.mid),hg:0,ag:0,events:[],weather:rollWeather(),homeBoost:0,awayBoost:0};
          simulateSegment(h,a,1,90,ctx);
          f.hg=ctx.hg;f.ag=ctx.ag;f.played=true;
          finalizeMatch(h,a,ctx);
        }catch(e){if(!f.played){f.hg=0;f.ag=0;f.played=true;}}
      });
    });
    state.round++;
  }
  finalizeSeason();
  processPromotionRelegation();
  state.view='seasonEnd';
  toast('⏩ Musim selesai');
  renderDevPanel();
  render();
}
function devForcePromote(){
  var my=state.teams[state.myIdx];
  if(!my) return;
  my.div=my.div===1?2:1;
  state.myDiv=my.div;
  toast('🔄 Pindah ke Divisi '+my.div);
  renderDevPanel();
  render();
}
var devTaps=0,devTimer=null;
function initDevTrigger(){
  var h=document.getElementById('appTitle');
  if(!h) return;
  h.addEventListener('click',function(){
    devTaps++;
    clearTimeout(devTimer);
    devTimer=setTimeout(function(){devTaps=0;},2000);

      devTaps=0;
      openSecretPortal();
    }
  });
}
function toggleDev(){
  state.dev=!state.dev;
  if(state.dev){
    toast('😎 DEV MODE ON');
    if(!document.getElementById('devBadge')){
      var b=document.createElement('div');b.id='devBadge';b.textContent='DEV';
      document.body.appendChild(b);
    }
  } else {
    var b2=document.getElementById('devBadge');if(b2) b2.remove();
    toast('Dev mode off');
  }
  renderDevPanel();
}
